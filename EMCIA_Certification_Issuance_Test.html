<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMCIA Gestion</title>
<meta name="application-name" content="EMCIA Gestion">
<meta name="apple-mobile-web-app-title" content="EMCIA Gestion">
<style>
:root{--nav:#102a43;--bg:#f4f7fb;--card:#fff;--line:#d9e2ec;--txt:#102a43;--muted:#627d98;--ok:#16865c;--bad:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--txt)}
header{background:var(--nav);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
header b{font-size:20px} header small{display:block;opacity:.8}
nav{display:flex;gap:7px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:66px;z-index:4}
nav button{white-space:nowrap;background:#eef3f8;color:var(--txt)}
main{max-width:1050px;margin:auto;padding:12px}.page{display:none}.page.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #102a4310}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
/* Daily operations: three complete title/value cards per row, including on phones. */
#daily > .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#daily > .grid > .card{min-width:0;margin:0;padding:10px 6px;text-align:center;overflow-wrap:anywhere}
#daily > .grid > .card .muted{font-size:12px;line-height:1.4}
#daily > .grid > .card .kpi{font-size:clamp(18px,3.8vw,24px);line-height:1.3}
@media(max-width:600px){#daily > .grid{gap:5px}#daily > .grid > .card{padding:9px 4px}#daily > .grid > .card .muted{font-size:11px}}.kpi{font-size:24px;font-weight:800}.muted{color:var(--muted);font-size:13px}
label{font-size:13px;color:var(--muted)}input,select,textarea,button{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:4px 0 8px}
button{border:0;background:var(--nav);color:#fff;font-weight:700;cursor:pointer}.secondary{background:#627d98}.danger{background:var(--bad)}.ok{background:var(--ok)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;align-items:end}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:right;vertical-align:top}th{background:#f7f9fc}
.actions{display:flex;gap:5px}.actions button{width:auto;padding:6px 9px;margin:0}.badge{padding:3px 7px;border-radius:20px;background:#eaf2f8;display:inline-block}
.warn{background:#fff5df;border:1px solid #f1c40f;padding:10px;border-radius:10px}.hidden{display:none}
progress{width:100%;height:16px}.ltr{direction:ltr;text-align:left}
@media(max-width:600px){nav{top:64px}th,td{padding:6px;font-size:12px}.actions{flex-direction:column}.actions button{width:100%}}

@media print{
 body *{visibility:hidden!important}
 #rcPreview,#rcPreview *{visibility:visible!important}
 #rcPreview{display:block!important;position:absolute!important;left:0;top:0;width:100%;margin:0!important;padding:0!important;border:0!important;box-shadow:none!important;background:#fff!important;color:#000!important}
 #rcPreview .rc-actions{display:none!important} #rcPreview .rc-paper{padding:18px!important;font-family:Arial,Tahoma,sans-serif!important}
 #rcPreview h1,#rcPreview h2{text-align:center!important;color:#000!important}
 #rcPreview table{width:100%!important;border-collapse:collapse!important}
 #rcPreview th,#rcPreview td{border:1px solid #777!important;padding:6px!important;color:#000!important;background:#fff!important}
}

/* V5.7.1 navigation corrections */
#nav{display:flex;gap:8px;align-items:flex-start;padding:10px;overflow:visible}
.main-nav{width:165px;flex:0 0 165px;display:flex;flex-direction:column;gap:7px}
.main-nav button{width:100%;min-height:42px;text-align:right;white-space:normal;font-weight:700}
.main-nav button.active-cat{outline:2px solid currentColor}
.subnav-wrap{flex:1;min-width:0}
.subnav-title{font-weight:800;margin:2px 0 7px}
.subnav{display:flex;flex-wrap:wrap;gap:6px;overflow:visible}
.subnav button{flex:1 1 125px;min-width:0;white-space:normal;line-height:1.2;padding:7px 6px}
body.reception-mode #nav{display:none}
body.reception-mode main{width:100%;max-width:none;margin:0;padding:0}
body.reception-mode #home{min-height:calc(100vh - 60px);width:100%}
body.reception-mode #home .welcome-card{min-height:calc(100vh - 95px);margin:0;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
body.reception-mode #home .dashboard-after-welcome{display:none}
.welcome-card{text-align:center;padding:28px 16px}
.welcome-logo{width:100px;height:100px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;border:2px solid currentColor}
.welcome-name{font-size:1.5rem;font-weight:900;margin:8px 0}
.welcome-season{font-size:1.1rem;font-weight:700;margin-top:8px}
.welcome-enter{margin-top:24px;min-width:180px}
@media(max-width:650px){
 #nav{gap:7px;padding:8px}
 .main-nav{width:128px;flex-basis:128px}
 .main-nav button{font-size:.80rem;padding:7px 5px}
 .subnav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
 .subnav button{width:100%;font-size:.80rem;padding:7px 4px}
}

/* V5.7.2: section content directly under its sub-navigation */
#appWorkspace{display:grid;grid-template-columns:165px minmax(0,1fr);grid-template-rows:auto 1fr;gap:0 8px;align-items:start}
#nav{display:contents}
#nav .main-nav{grid-column:1;grid-row:1 / span 2;width:auto;min-width:0;padding:10px 0 10px 10px}
#nav .subnav-wrap{grid-column:2;grid-row:1;padding:10px 10px 0 0;min-width:0}
#appWorkspace main{grid-column:2;grid-row:2;min-width:0;margin:0;padding:0 10px 10px 0}
#appWorkspace main .page.active{margin-top:0}
body.reception-mode #appWorkspace{display:block}
body.reception-mode #nav{display:none}
body.reception-mode #appWorkspace main{width:100%;max-width:none;margin:0;padding:0}
@media(max-width:650px){
 #appWorkspace{grid-template-columns:128px minmax(0,1fr);gap:0 7px}
 #nav .main-nav{padding-left:8px}
 #nav .subnav-wrap{padding:8px 8px 0 0}
 #appWorkspace main{padding:0 8px 8px 0}
}

/* V5.7.3 mobile collapsible navigation */
#mobileNavToggle{display:none}
body.reception-mode #mobileNavToggle{display:none!important}
@media(max-width:650px){
 #mobileNavToggle{display:block;position:sticky;top:0;z-index:50;margin:6px 8px;padding:8px 12px}
 body.mobile-nav-collapsed #appWorkspace{grid-template-columns:1fr}
 body.mobile-nav-collapsed #nav .main-nav{display:none}
 body.mobile-nav-collapsed #nav .subnav-wrap{grid-column:1;grid-row:1;padding:8px}
 body.mobile-nav-collapsed #appWorkspace main{grid-column:1;grid-row:2;padding:0 8px 8px}
 body:not(.mobile-nav-collapsed) #appWorkspace{grid-template-columns:128px minmax(0,1fr)}
}

/* V5.7.4 language-aware direction */
html[dir="rtl"] body{text-align:right}
html[dir="ltr"] body{text-align:left}
html[dir="rtl"] #appWorkspace{direction:rtl}
html[dir="ltr"] #appWorkspace{direction:ltr}
html[dir="rtl"] #nav .main-nav{grid-column:1;padding:10px 10px 10px 0}
html[dir="rtl"] #nav .subnav-wrap{grid-column:2;padding:10px 0 0 10px}
html[dir="rtl"] #appWorkspace main{grid-column:2;padding:0 0 10px 10px}
html[dir="ltr"] #nav .main-nav{grid-column:1;padding:10px 0 10px 10px}
html[dir="ltr"] #nav .subnav-wrap{grid-column:2;padding:10px 10px 0 0}
html[dir="ltr"] #appWorkspace main{grid-column:2;padding:0 10px 10px 0}
html[dir="rtl"] .main-nav button{text-align:right}
html[dir="ltr"] .main-nav button{text-align:left}
html[dir="rtl"] #mobileNavToggle{margin-left:auto;margin-right:8px}
html[dir="ltr"] #mobileNavToggle{margin-right:auto;margin-left:8px}
@media(max-width:650px){
 html[dir="rtl"] #nav .main-nav{padding:8px 8px 8px 0}
 html[dir="rtl"] #nav .subnav-wrap{padding:8px 0 0 8px}
 html[dir="rtl"] #appWorkspace main{padding:0 0 8px 8px}
 html[dir="ltr"] #nav .main-nav{padding:8px 0 8px 8px}
 html[dir="ltr"] #nav .subnav-wrap{padding:8px 8px 0 0}
 html[dir="ltr"] #appWorkspace main{padding:0 8px 8px 0}
 body.mobile-nav-collapsed #nav .subnav-wrap,
 body.mobile-nav-collapsed #appWorkspace main{grid-column:1}
}

/* V5.7.6 — compact mobile dropdown menu */
@media(max-width:650px){
 #mobileNavToggle{
   display:block!important;
   position:relative!important;
   width:auto!important;
   min-width:108px!important;
   margin:7px 8px 7px auto!important;
   padding:8px 12px!important;
   z-index:2100!important;
 }
 html[dir="rtl"] #mobileNavToggle{margin-left:auto!important;margin-right:8px!important}
 html[dir="ltr"] #mobileNavToggle{margin-right:auto!important;margin-left:8px!important}

 #appWorkspace{display:block!important;width:100%!important}
 #nav{display:block!important;width:100%!important;padding:0!important}
 #nav .subnav-wrap{display:block!important;width:100%!important;padding:8px!important;box-sizing:border-box}
 #appWorkspace main{display:block!important;width:100%!important;padding:0 8px 8px!important;box-sizing:border-box}

 #nav .main-nav{
   display:none!important;
   position:absolute!important;
   top:auto!important;
   width:min(76vw,280px)!important;
   height:auto!important;
   max-height:70vh!important;
   overflow-y:auto!important;
   z-index:2000!important;
   padding:7px!important;
   background:#f4f7fb!important;
   border:1px solid #d7e0e8!important;
   border-radius:12px!important;
   box-shadow:0 8px 22px rgba(0,0,0,.22)!important;
 }
 html[dir="rtl"] #nav .main-nav{right:8px!important;left:auto!important}
 html[dir="ltr"] #nav .main-nav{left:8px!important;right:auto!important}
 body.mobile-menu-open #nav .main-nav{display:flex!important}

 body.mobile-nav-collapsed #nav .main-nav{display:none!important}
 body.mobile-nav-collapsed #nav .subnav-wrap,
 body.mobile-nav-collapsed #appWorkspace main{width:100%!important}
}

/* V5.7.8 — reception-only compact language chooser */
.lang-menu{position:absolute;top:8px;left:8px;z-index:3000}
.lang-menu>button{width:42px!important;height:38px!important;min-width:42px!important;padding:4px!important;border-radius:10px!important}
.lang-choices{display:none;position:absolute;top:44px;left:0;min-width:125px;padding:6px;background:#fff;border:1px solid #d7e0e8;border-radius:10px;box-shadow:0 7px 20px rgba(0,0,0,.18)}
.lang-choices.open{display:flex;flex-direction:column;gap:5px}
.lang-choices button{width:100%;padding:7px 9px;white-space:nowrap}
body:not(.reception-mode) #langMenu{display:none!important}
body.reception-mode #langMenu{display:block}

/* Compact report action buttons */
#reportcenter .rc-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#reportcenter .rc-actions button{width:auto!important;min-width:88px;min-height:44px;padding:9px 14px!important;font-size:16px!important;flex:0 0 auto!important}

/* V5.9.8 — report actions: one compact row */
#reportcenter .rc-actions{
  display:flex!important;
  flex-wrap:nowrap!important;
  gap:6px!important;
  align-items:center!important;
  justify-content:center!important;
  width:100%!important;
}
#reportcenter .rc-actions button{
  flex:1 1 0!important;
  width:0!important;
  min-width:0!important;
  min-height:40px!important;
  padding:7px 5px!important;
  margin:0!important;
  font-size:14px!important;
  white-space:nowrap!important;
}
@media(max-width:650px){
  #reportcenter .rc-actions{gap:5px!important}
  #reportcenter .rc-actions button{
    min-height:38px!important;
    padding:6px 3px!important;
    font-size:13px!important;
  }
}

/* V5.9.9 — actual report buttons: exactly one row */
#reportcenter .report-action-row{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:5px!important;width:100%!important}
#reportcenter .report-action-row button{width:100%!important;min-width:0!important;min-height:36px!important;padding:5px 1px!important;margin:0!important;font-size:12px!important;line-height:1.1!important;white-space:nowrap!important}

/* V5.10.0 — compact sub-navigation on phones: 3 per row */
@media(max-width:650px){
 .subnav{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:5px!important}
 .subnav button{width:100%!important;min-width:0!important;padding:6px 3px!important;font-size:.72rem!important;line-height:1.15!important}
}

/* V5.10.1 — clear active navigation state */
.main-nav button.active-cat{
 transform:scale(1.035);
 box-shadow:0 0 0 2px rgba(255,255,255,.72),0 0 12px rgba(255,255,255,.32);
 font-weight:700!important;
}
.subnav button.active-sub{
 transform:scale(1.035);
 box-shadow:0 0 0 2px #2563eb,0 0 10px rgba(37,99,235,.28);
 font-weight:700!important;
 position:relative;
 z-index:1;
}
@media(max-width:650px){
 .main-nav button.active-cat,.subnav button.active-sub{transform:scale(1.025)}
}

/* V5.11.3 — enrollment selector layout and immediate success feedback */
#enroll .enroll-select-row{align-items:center}
#enroll .show-all-learners{display:flex;align-items:center;gap:6px;margin-inline-start:auto;white-space:nowrap}
#enroll .enroll-success{margin:8px 0;padding:8px 12px;border-radius:8px;font-weight:700;text-align:center;background:#ecfdf5;border:1px solid #86efac}
@media(max-width:650px){
 #enroll .enroll-select-row{display:grid!important;grid-template-columns:1fr 1fr!important;gap:6px!important}
 #enroll .show-all-learners{margin-inline-start:0;justify-self:start}
 #enroll #esearch{width:100%!important}
}

/* Budget: all eight indicators on one horizontally scrollable line. */
#budget .budget-kpi-strip{display:flex!important;flex-wrap:nowrap!important;overflow-x:auto!important;gap:7px!important;width:100%;padding-bottom:8px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
#budget .budget-kpi-strip>.card{flex:0 0 auto!important;width:max-content!important;min-width:112px!important;max-width:220px;margin:0!important;padding:10px 12px!important;text-align:center;white-space:normal}
#budget .budget-kpi-strip>.card>.muted{font-size:clamp(10px,2.4vw,12px);line-height:1.35;min-height:2.7em}
#budget .budget-kpi-strip>.card>.kpi{font-size:clamp(14px,3.2vw,20px);white-space:nowrap;font-variant-numeric:tabular-nums}

/* Compact financial analysis and arrears KPI strips. */
#analysis .analysis-kpi-strip,#arrears .arrears-kpi-strip{display:flex!important;flex-wrap:nowrap!important;overflow-x:auto!important;gap:7px!important;width:100%;padding-bottom:8px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
#analysis .analysis-kpi-strip>.card,#arrears .arrears-kpi-strip>.card{flex:0 0 auto!important;width:max-content!important;min-width:112px!important;max-width:220px!important;margin:0!important;padding:10px 12px!important;text-align:center;white-space:normal}
#analysis .analysis-kpi-strip>.card>.muted,#arrears .arrears-kpi-strip>.card>.muted{font-size:clamp(10px,2.4vw,12px);line-height:1.35;min-height:2.7em}
#analysis .analysis-kpi-strip>.card>.kpi,#arrears .arrears-kpi-strip>.card>.kpi{font-size:clamp(14px,3.2vw,20px);white-space:nowrap;font-variant-numeric:tabular-nums}
/* KPI overview without horizontal scrolling: compact, responsive, full-width grids. */
#budget .budget-kpi-strip,#analysis .analysis-kpi-strip,#arrears .arrears-kpi-strip{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;overflow:visible!important;flex-wrap:wrap!important;gap:7px!important;width:100%!important;padding-bottom:0!important}
#budget .budget-kpi-strip>.card,#analysis .analysis-kpi-strip>.card,#arrears .arrears-kpi-strip>.card{width:auto!important;min-width:0!important;max-width:none!important;flex:initial!important;margin:0!important;padding:9px 4px!important;text-align:center!important;overflow-wrap:anywhere!important;white-space:normal!important}
#budget .budget-kpi-strip>.card>.muted,#analysis .analysis-kpi-strip>.card>.muted,#arrears .arrears-kpi-strip>.card>.muted{font-size:clamp(10px,2.6vw,13px)!important;line-height:1.3!important;min-height:0!important}
#budget .budget-kpi-strip>.card>.kpi,#analysis .analysis-kpi-strip>.card>.kpi,#arrears .arrears-kpi-strip>.card>.kpi{font-size:clamp(12px,3.3vw,20px)!important;line-height:1.35!important;white-space:normal!important;overflow-wrap:anywhere!important;font-variant-numeric:tabular-nums}
@media(min-width:650px){#budget .budget-kpi-strip{grid-template-columns:repeat(4,minmax(0,1fr))!important}}


/* EMCIA V26 — phone-sized table viewing without shrinking data columns */
@media screen and (max-width:650px){
 #groups .card:has(table),#arrears .card:has(table),#reportcenter .card:has(table),#students .card:has(table){
  max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
 }
 #groups .card table,#arrears .card table,#reportcenter .card table,#students .card table{
  width:max-content;min-width:100%;font-size:12px;
 }
 #groups .card th,#groups .card td,#arrears .card th,#arrears .card td,#reportcenter .card th,#reportcenter .card td,#students .card th,#students .card td{
  padding:8px 9px;overflow-wrap:normal;white-space:normal;min-width:70px;
 }
 #groups .card .actions button,#arrears .card .actions button{min-height:38px}
}
@media print{
 #groups .card:has(table),#arrears .card:has(table),#reportcenter .card:has(table),#students .card:has(table){overflow:visible!important}
}

/* EMCIA V27 — visible compact navigation on desktop, balanced account control */
@media screen and (min-width:651px){
 body:not(.reception-mode) #emcia-top-controls #mobileNavToggle{
  display:inline-flex!important;flex:0 0 auto!important;width:auto!important;
  min-width:108px!important;max-width:150px!important;min-height:40px!important;
  align-items:center;justify-content:center;padding:8px 12px!important;
 }
 #emcia-top-controls{justify-content:space-between!important;align-items:center!important;gap:12px!important}
 #emcia-top-controls #emcia-account-menu{flex:0 0 auto!important;width:auto!important;max-width:210px!important;min-width:0!important}
 #emcia-top-controls #emcia-account-menu>button{width:auto!important;max-width:210px!important;min-height:40px!important;padding:8px 12px!important;font-size:14px!important;white-space:nowrap!important}
}

/* EMCIA V109 — semantic non-selectable subject category headings */
#teacherSubjectSelect optgroup,#studentSubjectSelect optgroup{font-weight:700;color:#6b7280;font-style:normal}
#teacherSubjectSelect option,#studentSubjectSelect option{font-weight:400;color:inherit}

/* EMCIA V110 — accessible password visibility control */
#authGate .emcia-password-field{position:relative;display:flex;align-items:center;width:100%;margin:5px 0 12px}
#authGate .emcia-password-field input{width:100%;padding-left:52px;margin:0;direction:ltr;text-align:right}
#authGate .emcia-password-field button{position:absolute;left:5px;top:50%;transform:translateY(-50%);width:42px!important;height:42px!important;min-height:42px!important;padding:0!important;margin:0!important;display:flex;align-items:center;justify-content:center;background:transparent!important;color:#506b82!important;border:0!important;box-shadow:none!important;cursor:pointer}
#authGate .emcia-password-field button:focus-visible{outline:2px solid #2563eb!important;border-radius:7px}

.emcia-eye-wrap{display:block;position:relative;width:100%}
.emcia-eye-wrap>input{width:100%!important;padding-left:48px!important;box-sizing:border-box}
.emcia-eye-wrap>.emcia-eye-button{position:absolute!important;left:4px!important;top:50%!important;transform:translateY(-50%)!important;width:40px!important;height:40px!important;min-height:40px!important;padding:0!important;margin:0!important;display:flex!important;align-items:center!important;justify-content:center!important;background:transparent!important;color:#506b82!important;border:0!important;box-shadow:none!important;z-index:2}

/* EMCIA V113 — ensure the login eye stays visible above the input on phones */
#authGate .emcia-password-field .emcia-eye-wrap{display:block!important;position:relative!important;overflow:visible!important;width:100%!important}
#authGate .emcia-password-field .emcia-eye-wrap>.emcia-eye-button{display:flex!important;visibility:visible!important;opacity:1!important;position:absolute!important;left:5px!important;right:auto!important;top:50%!important;transform:translateY(-50%)!important;width:42px!important;height:42px!important;min-width:42px!important;min-height:42px!important;z-index:50!important;background:#eef3f8!important;color:#102a43!important;border:1px solid #d9e2ec!important;border-radius:8px!important;pointer-events:auto!important}
#authGate .emcia-password-field .emcia-eye-wrap>.emcia-eye-button svg{display:block!important;width:22px!important;height:22px!important;stroke:#102a43!important;visibility:visible!important}
#authGate .emcia-password-field .emcia-eye-wrap>input{padding-left:55px!important}

/* EMCIA student registration — grouped non-selectable level headings */
#studentRequestLevel optgroup{color:#6b7280;font-weight:700;font-style:normal}
#studentRequestLevel option{color:#102a43;font-weight:400}

/* Compact three-column income entry, including narrow phones. */
.oi-compact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:8px 0;align-items:end}.oi-compact-grid>div{min-width:0}.oi-compact-grid label{display:block;font-size:12px;margin:0 0 4px}.oi-compact-grid input,.oi-compact-grid select{width:100%;min-width:0;max-width:100%;padding:8px 5px;font-size:clamp(11px,2.7vw,14px);height:39px}.oi-compact-grid .oi-action button{width:100%;min-width:0;padding:8px 3px;font-size:clamp(10px,2.5vw,13px);min-height:39px;white-space:normal}
</style>

<style>
.subject-chip{
  color:#000 !important;

function tr(s){
 if(LANG!=="fr"||!s)return s;
 let out=String(s);
 Object.keys(I18N).sort((a,b)=>b.length-a.length).forEach(k=>{if(out.includes(k))out=out.split(k).join(I18N[k])});
 return out;
}

 if(lm)lm.style.display=document.querySelector(".page.active")?.id==="home"?"block":"none";

 document.querySelectorAll(sels).forEach(el=>{
   if(el.children.length===0){
     if(el.dataset.uiAr===undefined && /[\u0600-\u06ff]/.test(el.textContent))el.dataset.uiAr=el.textContent;
     if(el.dataset.uiAr!==undefined)el.textContent=LANG==="fr"?tr(el.dataset.uiAr):el.dataset.uiAr;
   }
 });
 document.querySelectorAll("input[placeholder],textarea[placeholder]").forEach(el=>{
   let p=el.getAttribute("placeholder")||"";

   if(el.dataset.uiArPh!==undefined)el.setAttribute("placeholder",LANG==="fr"?tr(el.dataset.uiArPh):el.dataset.uiArPh);
 });
}

 function session(){let v;try{v=JSON.parse(sessionStorage.getItem('emcia_auth_session_v2')||'null')}catch(e){}return v&&v.expiresAt>Date.now()?v:null}
 async function call(method,body){
  const a=session();if(!a?.access_token||!a?.user?.id)throw Error('يرجى تسجيل الدخول مجددًا قبل حفظ الطلب');
  const url='https://gfhmkijxiinoqkxhicza.supabase.co/rest/v1/certificate_requests';
  const res=await fetch(url+(method==='GET'?'?select=id,subject_kind,subject_id,details,certificate_type,language,status,created_at&archived_at=is.null&order=created_at.desc&limit=200':''),{method,headers:{'apikey':'sb_publishable_AZWNmDjlNPpADgPFYwH3oA_71o4ABTM','Authorization':'Bearer '+a.access_token,'Content-Type':'application/json','Prefer':'return=minimal'},...(body?{body:JSON.stringify(body)}:{})});
  if(!res.ok)throw Error('تعذر الاتصال بقاعدة الطلبات (HTTP '+res.status+')');
  return method==='GET'?res.json():null;
 }
 async function certRpc(fn,payload){
  const a=session();if(!a?.access_token)throw Error('انتهت جلسة الدخول');
  const res=await fetch('https://gfhmkijxiinoqkxhicza.supabase.co/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':'sb_publishable_AZWNmDjlNPpADgPFYwH3oA_71o4ABTM','Authorization':'Bearer '+a.access_token,'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(!res.ok){const e=await res.json().catch(()=>({}));throw Error(e.message||'تعذرت العملية');}
  return res.json();
 }
 async function fetchIssued(){
  const a=session();if(!a?.access_token)throw Error('انتهت جلسة الدخول');
  const url='https://gfhmkijxiinoqkxhicza.supabase.co/rest/v1/certificates?select=id,request_id,certificate_number,issued_at,immutable_snapshot,archived_at&archived_at=is.null&order=issued_at.desc&limit=100';

 }

function groupLevelCatalog(subject=""){
 let base=["الأول ابتدائي","الثاني ابتدائي","الثالث ابتدائي","الرابع ابتدائي","الخامس ابتدائي","السادس ابتدائي","الأولى إعدادي","الثانية إعدادي","الثالثة إعدادي","الجذع المشترك","الأولى بكالوريا","الثانية بكالوريا"];
 if(["الفرنسية","الإنجليزية","الإسبانية","الألمانية","الهولندية","العربية"].includes(subjectById(subject)?.n||subject))base=base.concat(["A1","A2","B1","B2","C1","C2","مبتدئ","متوسط","متقدم"]);
 return [...new Set(base)]
}

function chosenGroupLevel(){let el=$("#glevel"),v=el?.value||"";if(v==="__other__"){let x=prompt("أدخل المستوى أو التخصص");if(!x){el.value="";return ""}let op=document.createElement("option");op.value=x.trim();op.textContent=x.trim();op.selected=true;el.insertBefore(op,el.lastElementChild);v=x.trim()}return v}
function updateSuggestedGroupName(){

 let teacher=db.t.find(x=>x.id===tid);

function groupCategoryOptions(){
 return `<option value="">— اختر الفئة —</option><option>لغة</option><option>دعم مدرسي</option><option>تكوين</option><option>أخرى</option>`
}
function groupSubjectsByCategory(category){
 const map={
  "لغة":["الفرنسية","الإنجليزية","الإسبانية","الألمانية","الهولندية","العربية"],
  "دعم مدرسي":["العربية","الفرنسية","الإنجليزية","الرياضيات","الفيزياء","العلوم الطبيعية"],
  "تكوين":["الحجامة","الطبخ","الإعلاميات","الإسعافات الأولية"],
  "أخرى":[]
 };
 let base=map[category]||[];
 // Preserve any existing group materials already used under the same category.
 db.g.filter(g=>g.active!==false&&g.category===category&&g.subject).forEach(g=>{
   let n=normalizeSubjectName(g.subject);if(n&&!base.includes(n))base.push(n)
 });
 return base
}
function groupKnownSubjectOptions(category=""){
 if(!category)return `<option value="">— اختر الفئة أولاً —</option>`;
 let a=groupSubjectsByCategory(category);
 return `<option value="">— اختر المادة —</option>`+a.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("")+`<option value="__other__">أخرى</option>`
}
function groupLevelsFor(category,subject){
 const school=["الأول ابتدائي","الثاني ابتدائي","الثالث ابتدائي","الرابع ابتدائي","الخامس ابتدائي","السادس ابتدائي","الأولى إعدادي","الثانية إعدادي","الثالثة إعدادي","الجذع المشترك","الأولى بكالوريا","الثانية بكالوريا"];
 const lang=["A1","A2","B1","B2","C1","C2","مبتدئ","متوسط","متقدم"];
 if(category==="لغة")return lang;
 if(category==="دعم مدرسي")return school;
 if(category==="تكوين"&&normalizeSubjectName(subject)==="الإعلاميات")return ["المكتبيات","البرمجة","الذكاء الاصطناعي"];
 return [];
}
function groupCascadeLevelOptions(category="",subject=""){
 if(!subject)return `<option value="">— اختر المادة أولاً —</option>`;
 let a=groupLevelsFor(category,subject);
 if(category==="تكوين"&&normalizeSubjectName(subject)!=="الإعلاميات")return `<option value="">— غير مطلوب —</option>`;
 let label=(category==="تكوين"&&normalizeSubjectName(subject)==="الإعلاميات")?"— اختر تخصص الإعلاميات —":"— اختر المستوى أو التخصص —";
 return `<option value="">${label}</option>`+a.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("")+`<option value="__other__">أخرى</option>`
}

function teacherCanTeachMaterial(t,subject){

 return names.some(n=>normalizeSubjectName(n).toLocaleLowerCase()===normalizeSubjectName(subject).toLocaleLowerCase())
}

}

function studentRequestedMaterials(s){

 if(!names.length&&Array.isArray(s.requestedSubjects))names=s.requestedSubjects.filter(Boolean);
 return [...new Set(names.map(normalizeSubjectName))]
}
function waitKey(material,level=""){return normalizeSubjectName(material)+"||"+(level||"").trim()}
function waitConfig(material,level=""){
 let k=waitKey(material,level),r=db.wait.find(x=>x.key===k);
 if(!r){r={id:uid(),key:k,material:normalizeSubjectName(material),level:(level||"").trim(),target:5,status:"waiting",teacherId:"",firstSession:"",note:"",createdAt:new Date().toISOString()};db.wait.push(r);save()}
 return r
}
function waitingStatusRecord(sid,material){
 let mat=normalizeSubjectName(material),r=db.wls.find(x=>x.sid===sid&&normalizeSubjectName(x.material)===mat);
 return r||null
}
function studentEnrolledInMaterial(sid,material){
 let mat=normalizeSubjectName(material);
 return db.e.some(e=>{
   if(!e.active||e.sid!==sid)return false;
   let g=db.g.find(x=>x.id===e.gid);
   return !!(g&&normalizeSubjectName(g.subject||"")===mat);
 })
}
function waitingReasonLabel(v){
 return {"":"—","noanswer":"لا يجيب على الهاتف","notinterested":"غير راغب في الدراسة","schedule":"التوقيت غير مناسب","othercenter":"التحق بمؤسسة أخرى","deferred":"مؤجل","other":"سبب آخر"}[v]||v
}
function setWaitingReason(sid,material,value){
 let mat=normalizeSubjectName(material),r=waitingStatusRecord(sid,mat);
 if(!value){if(r)db.wls=db.wls.filter(x=>x!==r)}
 else if(r){r.reason=value;r.updatedAt=new Date().toISOString()}
 else db.wls.push({id:uid(),sid,material:mat,reason:value,note:"",createdAt:new Date().toISOString()});
 save();waitingRefresh()
}
function editWaitingReasonNote(sid,material){
 let mat=normalizeSubjectName(material),r=waitingStatusRecord(sid,mat);
 if(!r){alert("حدد أولاً سبب عدم الالتحاق.");return}
 let x=prompt("ملاحظة حول عدم الالتحاق:",r.note||"");if(x===null)return;r.note=x.trim();r.updatedAt=new Date().toISOString();save();waitingRefresh()
}
function waiting(){
 let materialSet=new Set();
 db.s.filter(s=>s.active!==false).forEach(s=>studentRequestedMaterials(s).forEach(mat=>materialSet.add(mat)));
 db.g.filter(g=>g.active!==false&&g.subject).forEach(g=>materialSet.add(normalizeSubjectName(g.subject)));
 let mats=[...materialSet].sort((a,b)=>a.localeCompare(b,"ar"));
 $("#waiting").innerHTML=`<div class="card"><div class="row">
 <div><label>البحث بالمادة</label><select id="wlMat" onchange="waitingRefresh()"><option value="">— كل المواد —</option>${mats.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join("")}</select></div>
 <div><label>البحث بالمتعلم</label><input id="wlStudentSearch" placeholder="اكتب اسم المتعلم..." oninput="waitingRefresh()"></div>
 <div><label>المستوى أو التخصص</label><input id="wlLevel" placeholder="اختياري: A1 أو الثانية بكالوريا" oninput="waitingRefresh()"></div>
 </div><p class="muted">يمكن البحث بالمادة أو باسم المتعلم أو باستعمالهما معاً. لائحة الانتظار للمتابعة فقط؛ إنشاء الفوج يتم من «إضافة فوج» ثم الإلحاق من «تسجيل متعلم».</p></div>
 <div id="wlBody"></div>
 <div class="card"><h3>ملخص التسجيلات حسب المواد</h3><div id="waitingSummary">${mats.length?`<table><tr><th>المادة</th><th>إجمالي المسجلين</th><th>غير الملتحقين</th><th>المنتظرون فعلياً</th></tr>${mats.map(mat=>{let all=db.s.filter(s=>s.active!==false&&studentRequestedMaterials(s).includes(mat)&&!studentEnrolledInMaterial(s.id,mat)),excluded=all.filter(s=>waitingStatusRecord(s.id,mat)?.reason).length;return`<tr><td>${esc(mat)}</td><td>${all.length}</td><td>${excluded}</td><td><b>${all.length-excluded}</b></td></tr>`}).join("")}</table>`:"<p class='muted'>لا توجد طلبات مواد مسجلة بعد.</p>"}</div></div>`;
 waitingRefresh()
}
function waitingRefresh(){
 const summary=$("#waitingSummary");if(summary){let mats=[...new Set(db.s.filter(s=>s.active!==false).flatMap(s=>studentRequestedMaterials(s)))].sort((a,b)=>a.localeCompare(b,'ar'));summary.innerHTML=mats.length?'<table><tr><th>المادة</th><th>إجمالي الطلبات</th><th>الملتحقون</th><th>غير الملتحقين</th><th>المنتظرون فعلياً</th></tr>'+mats.map(mat=>{let all=db.s.filter(s=>s.active!==false&&studentRequestedMaterials(s).includes(mat));let enrolled=all.filter(s=>studentEnrolledInMaterial(s.id,mat));let remaining=all.filter(s=>!studentEnrolledInMaterial(s.id,mat));let excluded=remaining.filter(s=>waitingStatusRecord(s.id,mat)?.reason).length;return '<tr><td>'+esc(mat)+'</td><td>'+all.length+'</td><td>'+enrolled.length+'</td><td>'+remaining.length+'</td><td><b>'+(remaining.length-excluded)+'</b></td></tr>'}).join('')+'</table>':'<p class="muted">لا توجد طلبات مواد مسجلة بعد.</p>'}
 let mat=$("#wlMat")?.value||"",q=($("#wlStudentSearch")?.value||"").trim().toLocaleLowerCase(),level=($("#wlLevel")?.value||"").trim().toLocaleLowerCase();
 let enrolledMaterial=new Set();
 db.e.filter(e=>e.active).forEach(e=>{
   let g=db.g.find(x=>x.id===e.gid);
   if(g&&g.subject) enrolledMaterial.add(e.sid+"||"+normalizeSubjectName(g.subject));
 });
 let pairs=[];
 db.s.filter(s=>s.active!==false).forEach(s=>{
   studentRequestedMaterials(s).forEach(sm=>{
     if(enrolledMaterial.has(s.id+"||"+normalizeSubjectName(sm)))return;
     if(mat&&sm!==mat)return;
     if(q&&!objName(s).toLocaleLowerCase().includes(q))return;
     if(level&&!((s.level||"").toLocaleLowerCase().includes(level)))return;
     pairs.push({s,material:sm})
   })
 });
 if(!mat&&!q&&!level){$("#wlBody").innerHTML=`<div class="card"><p class="muted">اختر مادة أو اكتب اسم متعلم لعرض لائحة الانتظار.</p></div>`;return}
 pairs.sort((a,b)=>{
   let ax=waitingStatusRecord(a.s.id,a.material)?.reason?1:0;
   let bx=waitingStatusRecord(b.s.id,b.material)?.reason?1:0;
   if(ax!==bx)return ax-bx;
   return objName(a.s).localeCompare(objName(b.s),"ar");
 });
 let excluded=pairs.filter(x=>waitingStatusRecord(x.s.id,x.material)?.reason),active=pairs.filter(x=>!waitingStatusRecord(x.s.id,x.material)?.reason);
 let cfg=mat?waitConfig(mat,($("#wlLevel")?.value||"").trim()):null,target=cfg?Math.max(1,+cfg.target||5):0;
 let state=mat?(active.length>=target?"جاهز للفتح":active.length>=Math.max(1,target-2)?"قريب من الاكتمال":"في الانتظار"):"نتائج البحث";
 $("#wlBody").innerHTML=`<div class="card"><div class="grid wait-counts">
 <div><div class="muted">إجمالي المسجلين</div><div class="kpi">${pairs.length}</div></div>
 <div><div class="muted">غير الملتحقين</div><div class="kpi">${excluded.length}</div></div>
 <div><div class="muted">المنتظرون فعلياً</div><div class="kpi">${active.length}</div></div></div>
 ${mat?`<div class="row"><div><label>العدد المستهدف لفتح الفوج</label><input id="wlTarget" type="number" min="1" value="${target}"></div><div><label>الحالة</label><input value="${state}" disabled></div><div><label>الأستاذ المقترح</label><select id="wlTeacher"><option value="">— يحدد لاحقاً —</option>${db.t.filter(x=>x.active!==false&&teacherCanTeachMaterial(x,mat)).map(x=>`<option value="${x.id}" ${cfg.teacherId===x.id?"selected":""}>${esc(objName(x))}</option>`).join("")}</select></div><div><label>موعد الحصة الأولى</label><input id="wlFirst" type="datetime-local" value="${esc(cfg.firstSession||"")}"></div></div><div><label>ملاحظة إدارية</label><textarea id="wlNote">${esc(cfg.note||"")}</textarea></div><div class="actions"><button onclick="saveWaitingConfig()">حفظ المتابعة</button></div>`:""}</div>
 <div class="card"><h3>لائحة الانتظار (${pairs.length})</h3>${pairs.length?`<table><tr><th>المتعلم</th><th>المادة</th><th>الهواتف</th><th>المستوى/التخصص</th><th>التوقيت</th><th>سبب عدم الالتحاق</th><th>ملاحظة</th></tr>${pairs.map(({s,material})=>{let r=waitingStatusRecord(s.id,material),tm=s.preferredTime==="day"?"نهاراً":s.preferredTime==="evening"?"مساءً":s.preferredTime==="both"?"نهاراً أو مساءً":"غير محدد";return`<tr class="${r?.reason?"wait-excluded":""}"><td>${esc(objName(s))}</td><td>${esc(material)}</td><td>${esc([s.ph,s.parent,s.landline].filter(Boolean).join(" / ")||"—")}</td><td>${esc([s.educationLevel,s.level].filter(Boolean).join(" — ")||"—")}</td><td>${tm}</td><td><select onchange="setWaitingReason('${s.id}','${esc(material)}',this.value)"><option value="">— سيلتحق / في الانتظار —</option><option value="noanswer" ${r?.reason==="noanswer"?"selected":""}>لا يجيب على الهاتف</option><option value="notinterested" ${r?.reason==="notinterested"?"selected":""}>غير راغب في الدراسة</option><option value="schedule" ${r?.reason==="schedule"?"selected":""}>التوقيت غير مناسب</option><option value="othercenter" ${r?.reason==="othercenter"?"selected":""}>التحق بمؤسسة أخرى</option><option value="deferred" ${r?.reason==="deferred"?"selected":""}>مؤجل</option><option value="other" ${r?.reason==="other"?"selected":""}>سبب آخر</option></select></td><td>${r?.reason?`<button onclick="editWaitingReasonNote('${s.id}','${esc(material)}')">${esc(r.note||"إضافة ملاحظة")}</button>`:"—"}</td></tr>`}).join("")}</table>`:"<p class='muted'>لا توجد نتائج مطابقة.</p>"}</div>`
}
function saveWaitingConfig(){
 let mat=$("#wlMat").value,level=($("#wlLevel").value||"").trim();if(!mat)return alert("اختر المادة أولاً");
 let cfg=waitConfig(mat,level);cfg.target=Math.max(1,+$("#wlTarget").value||5);cfg.teacherId=$("#wlTeacher").value||"";cfg.firstSession=$("#wlFirst").value||"";cfg.note=($("#wlNote").value||"").trim();cfg.updatedAt=new Date().toISOString();save();waitingRefresh()
}

 <div class="card"><h3>لائحة الأفواج</h3><div class="row"><input id="groupListQuery" placeholder="بحث باسم الفوج أو الأستاذ" oninput="emciaFilterGroupList()"><select id="groupListSubject" onchange="emciaFilterGroupList()">${emciaFilterOptions()}</select><input id="groupListLevel" placeholder="المستوى / التخصص" oninput="emciaFilterGroupList()"></div><table id="groupListTable"><tr><th>الفوج</th><th>الفئة</th><th>المادة</th><th>المستوى / التخصص</th><th>الاختصار</th><th>الأستاذ</th><th>الواجب</th><th>النسبة</th><th>الحالة</th><th></th></tr>${[...db.g].reverse().map(o=>`<tr data-group-id="${o.id}"><td>${esc(o.n)}</td><td>${esc(o.category||"—")}</td><td>${esc(o.subject||groupSubject(o.id)||"—")}</td><td>${esc(o.level||"—")}</td><td><b>${esc(o.linkCode||"—")}</b></td><td>${esc(name(db.t,o.tid))}</td><td>${money(o.f)}</td><td>${o.r}%</td><td>${o.active?"نشط":"غير نشط"}</td><td class="actions"><button onclick="editGroup('${o.id}')">✏️</button>${o.active?"":`<button class="ok" onclick="activateObj('g','${o.id}')">✓ تنشيط</button>`}<button class="danger" onclick="removeObj('g','${o.id}')">🗑️</button></td></tr>`).join("")}</table></div>`;

function addGroup(){
 let category=$("#gcat").value,subject=selectedGroupSubjectName(),specialty=selectedGroupSpecialty(),level=specialty,tid=$("#gt").value,linkCode=$("#glinkcode").value.trim();
 if(!category)return alert("اختر الفئة");
 if(!subject)return alert("اختر المادة أو أدخل مادة أخرى");
 if(!tid)return alert("اختر الأستاذ");
 let tt=by(db.t,tid);
 let suggested=[linkCode||subject,level,objName(tt)].filter(Boolean).join(" – ");
 let n=$("#gn").value.trim()||suggested;
 if(!n)return alert("تعذر إنشاء اسم الفوج");
 let same=db.g.filter(g=>g.active&&g.n===n);
 if(same.length&&$("#gn").dataset.manual!=="1")n=`${n} – ${same.length+1}`;
 db.g.push({id:uid(),n,category,subject,subjectId:subjectIdByLegacyName(subject)||"",level,specialty,linkCode,tid:tt.id,f:+$("#gf").value||0,r:+$("#gr").value||0,active:true});save();groups()
}
function editGroup(id){
 let o=by(db.g,id);if(!o)return;
 let names=[...new Set(activeSubjectRecords().map(x=>x.n).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ar"));
 let cur=subjectById(o.subjectId),txt=names.map((n,i)=>`${i+1}. ${n}${n===(cur?.n||o.subject)?" ✓":""}`).join("\n");
 let np=prompt(`اختر رقم المادة:\n${txt}`,String(Math.max(1,names.indexOf(cur?.n||o.subject)+1)));if(np===null)return;

function shiftRecord(day,type){return db.shifts.find(x=>x.date===day&&x.type===type)||null}
function shiftCashPayments(day,type){
 let rec=shiftRecord(day,type); if(!rec||!rec.openedAt)return [];
 let start=new Date(rec.openedAt).getTime(), end=rec.closedAt?new Date(rec.closedAt).getTime():Infinity;
 return db.p.filter(p=>{
   if((p.method||"cash")!=="cash"||(p.date||"")!==day)return false;
   let ts=p.createdAt?new Date(p.createdAt).getTime():NaN;
   // Legacy/current payments without timestamp cannot be reliably assigned to a shift.
   return Number.isFinite(ts)&&ts>=start&&ts<=end
 })
}

function dueInfo(e,m,paid){
 let g=by(db.g,e.gid), start=e.start||"", due=e.fee==null?+g?.f||0:+e.fee;

function teacherSessionRecord(sid,date){return db.tatt.find(x=>x.sid===sid&&x.date===date)||null}
function teacherAbsenceById(id){return db.tatt.find(x=>x.id===id)||null}
function makeupCandidatesForAbsence(r){let s=by(db.sch,r.sid);return s?db.sch.filter(x=>x.active!==false&&x.gid===s.gid&&x.type==="makeup"):[]}
function linkTeacherMakeup(absId){
 let r=teacherAbsenceById(absId);if(!r)return;let c=makeupCandidatesForAbsence(r);
 if(!c.length){alert("لا توجد حصة تعويضية لهذا الفوج في استعمال الزمن. أضف أولاً حصة من نوع «تعويضية» ثم عد إلى هنا.");return}
 let menu=c.map((x,i)=>`${i+1}. ${x.day} ${x.start}–${x.end}`).join("\n"),n=+(prompt(`اختر رقم حصة التعويض:\n${menu}`,"1")||0);if(!n||!c[n-1])return;
 let ms=c[n-1],md=(prompt("أدخل تاريخ تنفيذ حصة التعويض (YYYY-MM-DD):",r.date)||"").trim();
 if(!/^\d{4}-\d{2}-\d{2}$/.test(md)){alert("تاريخ غير صالح.");return}
 if(md.slice(0,7)!==r.date.slice(0,7)){alert("يجب أن يتم التعويض داخل نفس شهر الغياب.");return}
 if(md<r.date){alert("لا يمكن أن يكون تاريخ التعويض قبل تاريخ الغياب.");return}
 r.makeupScheduleId=ms.id;r.makeupDate=md;r.updatedAt=new Date().toISOString();
 let mr=teacherSessionRecord(ms.id,md);if(mr)Object.assign(mr,{status:"madeup",makeupForAbsenceId:r.id,updatedAt:new Date().toISOString()});
 else db.tatt.push({id:uid(),sid:ms.id,date:md,status:"madeup",note:"حصة تعويضية",makeupForAbsenceId:r.id,createdAt:new Date().toISOString()});
 save();teacherAttRefresh();alert("تم ربط حصة التعويض بغياب الأستاذ بنجاح.")
}
function undoTeacherMakeup(absId){let r=teacherAbsenceById(absId);if(!r||!r.makeupDate)return;if(!confirm("إلغاء ربط حصة التعويض؟"))return;db.tatt=db.tatt.filter(x=>x.makeupForAbsenceId!==r.id);r.makeupScheduleId="";r.makeupDate="";save();teacherAttRefresh()}

function emciaScheduleAttendance(sid){

 const date=today(),day=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"][new Date(date+"T12:00:00").getDay()];
 const enrolled=[...new Set(db.e.filter(e=>e.active&&e.gid===ses.gid&&(!e.start||e.start<=date)).map(e=>e.sid))];
 const records=db.att.filter(a=>a.date===date&&a.gid===ses.gid&&enrolled.includes(a.sid)&&a.status);
 const unique=new Map(records.map(a=>[a.sid,a.status]));
 const count=st=>[...unique.values()].filter(x=>x===st).length;
 const scheduled=ses.day===day;
 const registered=unique.size,complete=enrolled.length>0&&registered>=enrolled.length;
 return '<strong>'+esc(date)+'</strong><div>المسجلون: '+enrolled.length+'</div>'+(scheduled?'<div>الحاضرون: '+count("present")+'</div><div>المتأخرون: '+count("late")+'</div><div>الغائبون: '+count("absent")+'</div><div>بعذر: '+count("excused")+'</div><div>حالة التسجيل: '+(registered===0?"لم يسجل بعد":complete?"مكتمل":"جزئي ("+registered+"/"+enrolled.length+")")+'</div>':'<div>هذا الفوج غير مبرمج اليوم.</div>')+'<button type="button" style="margin-top:5px;padding:5px" onclick="editSchedule(\''+ses.id+'\')">✏️ تعديل الحصة</button>';
}

 if(box.dataset.sid===id&&box.style.display!=="none"){box.style.display="none";box.dataset.sid="";return}
 box.dataset.sid=id;box.innerHTML=emciaScheduleAttendance(id);box.style.display="block";

function emciaScheduleGrid(){
 const rooms=db.rooms.filter(r=>r.active!==false).sort((a,b)=>{const an=Number((String(a.n).match(/[0-9٠-٩]+/)||[])[0]?.replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632))||999),bn=Number((String(b.n).match(/[0-9٠-٩]+/)||[])[0]?.replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632))||999);return an-bn||a.n.localeCompare(b.n,"ar")});
 const sessions=db.sch.filter(x=>x.active!==false);
 const minutes=t=>{const p=(t||"").split(":").map(Number);return p.length===2&&p.every(Number.isFinite)?p[0]*60+p[1]:0};
 const label=n=>String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
 const slots=[...Array.from({length:6},(_,i)=>9*60+i*30),...Array.from({length:15},(_,i)=>14*60+i*30)];
 const style='border:1px solid #cbd5e1;padding:5px;text-align:center;vertical-align:middle;font-size:12px';
 const breakCell='<td aria-label="استراحة من 12:00 إلى 14:00" style="background:#475569;border-left:3px solid #1e293b;border-right:3px solid #1e293b;min-width:9px;width:9px;padding:0"></td>';
 const head='<tr><th style="'+style+';position:sticky;right:0;background:#e8eef5">اليوم</th><th style="'+style+';background:#e8eef5">القاعة</th>'+slots.map(t=>(t===14*60?'<th title="استراحة 12:00–14:00" style="background:#475569;min-width:9px;width:9px;padding:0;border:3px solid #1e293b"></th>':'')+'<th style="'+style+';min-width:'+(t===11*60+30?'105':'62')+'px;background:'+(t===14*60?'#dbeafe':'#e8eef5')+';direction:ltr">'+(t===11*60+30?'11:30–12:00':label(t))+'</th>').join('')+'</tr>';
 const body=DAYS.map(day=>rooms.map((r,ri)=>{
  const found=sessions.filter(x=>x.day===day&&x.rid===r.id).sort((a,b)=>a.start.localeCompare(b.start));
  let cells='',index=0;
  while(index<slots.length){
   if(slots[index]===14*60)cells+=breakCell;
   const t=slots[index],ses=found.find(x=>minutes(x.start)<t+30&&minutes(x.end)>t);
   if(!ses){cells+='<td style="'+style+';background:#fafafa;color:#cbd5e1">·</td>';index++;continue}
   let count=1;while(index+count<slots.length&&slots[index+count]===slots[index+count-1]+30&&minutes(ses.start)<slots[index+count]+30&&minutes(ses.end)>slots[index+count])count++;
   const g=by(db.g,ses.gid),teacher=by(db.t,g?.tid);
   cells+='<td colspan="'+count+'" style="'+style+';background:#e0f2fe;border:1px solid #7dd3fc;min-width:65px;cursor:pointer" onclick="emciaSchedulePopup(\''+ses.id+'\')" onmouseenter="emciaScheduleHover(\''+ses.id+'\')"><strong>'+esc(g?.linkCode||g?.n||"—")+'</strong></td>';
   index+=count;
  }
  return '<tr>'+(ri===0?'<th rowspan="'+rooms.length+'" style="'+style+';background:#e8eef5;font-weight:bold;min-width:75px">'+day+'</th>':'')+'<th style="'+style+';white-space:nowrap;background:#f1f5f9">'+esc((r.n.match(/[0-9٠-٩]+/)||[])[0]||r.n)+'</th>'+cells+'</tr>';
 }).join('')).join('');
 return '<div class="card"><h3>استعمال الزمن الأسبوعي حسب القاعات</h3><div id="emciaSchedulePopup" data-sid="" style="display:none;position:sticky;top:5px;z-index:5;background:#fff;border:1px solid #94a3b8;border-radius:8px;padding:10px;max-width:280px;box-shadow:0 3px 10px #0002"><button type="button" style="float:left" onclick="this.parentNode.style.display=\'none\'">✕</button></div><p class="muted">الأيام عمودياً والقاعات حسب أرقامها، والساعات أفقياً (09:00–12:00 و14:00–21:30). مرر الجدول أفقياً على الهاتف. مرر الفأرة أو اضغط على الفوج لعرض حضور اليوم، ثم اختر تعديل الحصة عند الحاجة.</p><div style="overflow-x:auto;max-width:100%;direction:rtl"><table style="border-collapse:collapse;width:max-content;min-width:100%;table-layout:fixed">'+head+body+'</table></div></div>';
}

function addSchedule(){

function attKey(date,gid,sid){return date+"|"+gid+"|"+sid}
function emciaSessionAttendancePreview(gid,month){

 if(!enrollments.length)return "";
 const rows=enrollments.map(e=>{
  const attendance=db.att.filter(a=>a.gid===gid&&a.sid===e.sid&&a.date&&a.date.slice(0,7)===month&&(!e.start||a.date>=e.start)&&["present","late","leftEarly"].includes(a.status));
  const count=new Set(attendance.map(a=>a.date)).size;
  const discount=activeDiscount(e,month)?.amount||0;

 });

 records.forEach(a=>{if(c[a.status]!=null)c[a.status]++});

 <div class="grid attendance-stats-grid"><div class="card"><div class="muted">عدد المسجلين</div><div class="kpi">${students.length}</div></div><div class="card"><div class="muted">الحاضرون</div><div class="kpi">${c.present}</div></div><div class="card"><div class="muted">الغائبون</div><div class="kpi">${c.absent}</div></div><div class="card"><div class="muted">المتأخرون</div><div class="kpi">${c.late}</div></div><div class="card"><div class="muted">غياب بعذر</div><div class="kpi">${c.excused}</div></div><div class="card"><div class="muted">غادر قبل النهاية</div><div class="kpi">${c.leftEarly??0}</div></div></div>
 <div class="card"><div class="row"><button onclick="markAllAttendance('present')">تحديد الجميع حاضرين</button><button onclick="clearAttendanceDay()">مسح تسجيلات الحصة</button></div></div>

 ${gid?emciaSessionAttendancePreview(gid,date.slice(0,7)):""}
 <div class="card"><h3>ملخص الشهر</h3>${attendanceMonthSummary(gid,date.slice(0,7))}</div>`;applyLang()
}
function saveAttendance(date,gid,sid,status){let i=db.att.findIndex(a=>attKey(a.date,a.gid,a.sid)===attKey(date,gid,sid));if(!status){if(i>=0)db.att.splice(i,1)}else if(i>=0)db.att[i].status=status;else db.att.push({id:uid(),date,gid,sid,status,note:""});save();attendance()}
function saveAttendanceNote(date,gid,sid,note){let i=db.att.findIndex(a=>attKey(a.date,a.gid,a.sid)===attKey(date,gid,sid));if(i>=0)db.att[i].note=note;else if(note.trim())db.att.push({id:uid(),date,gid,sid,status:"",note});save()}
function markAllAttendance(status){let date=window.attDate||today(),gid=window.attGid||"";db.e.filter(e=>e.active&&e.gid===gid&&(!e.start||e.start<=date)).forEach(e=>{let i=db.att.findIndex(a=>attKey(a.date,a.gid,a.sid)===attKey(date,gid,e.sid));if(i>=0)db.att[i].status=status;else db.att.push({id:uid(),date,gid,sid:e.sid,status,note:""})});save();attendance()}
function clearAttendanceDay(){let date=window.attDate||today(),gid=window.attGid||"";if(!confirm("هل تريد مسح تسجيلات الحضور والغياب لهذه الحصة؟"))return;db.att=db.att.filter(a=>!(a.date===date&&a.gid===gid));save();attendance()}
function attendanceMonthSummary(gid,m){
 let rec=db.att.filter(a=>a.gid===gid&&a.date.slice(0,7)===m),days=[...new Set(rec.map(a=>a.date))].sort();
 if(!days.length)return"<p class='muted'>لا توجد حصص مسجلة خلال هذا الشهر بعد.</p>";
 let rows=[...new Set(rec.map(a=>a.sid))].map(sid=>{let s=by(db.s,sid),rr=rec.filter(a=>a.sid===sid);return{name:objName(s),p:rr.filter(a=>a.status==="present").length,ab:rr.filter(a=>a.status==="absent").length,l:rr.filter(a=>a.status==="late").length,ex:rr.filter(a=>a.status==="excused").length,le:rr.filter(a=>a.status==="leftEarly").length}});
 return`<p><b>عدد الحصص المسجلة:</b> ${days.length}</p><table><tr><th>المتعلم</th><th>حاضر</th><th>غائب</th><th>متأخر</th><th>بعذر</th><th>غادر قبل النهاية</th></tr>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.p}</td><td>${r.ab}</td><td>${r.l}</td><td>${r.ex}</td><td>${r.le}</td></tr>`).join("")}</table>`
}
const EMCIA_ACCOUNTING_START_MONTH="2026-11";
function monthRange(start,end){
 let out=[];if(!start||!end)return out;let m=start.slice(0,7);if(m<EMCIA_ACCOUNTING_START_MONTH)m=EMCIA_ACCOUNTING_START_MONTH;let guard=0;
 while(m<=end&&guard++<120){out.push(m);m=monthShift(m,1)}return out
}
// Read-only administrative alerts reuse the same dues/payment rules as arrears().
function emciaPendingAlertCount(){
 const month=nowMonth();let count=0;
 db.e.filter(e=>e.active&&e.start&&e.start.slice(0,7)<=month).forEach(e=>{
  if(!by(db.s,e.sid)||!by(db.g,e.gid))return;
  const pending=monthRange(e.start,month).some(mm=>{
   const due=dueForEnrollmentMonth(e,mm);
   const paid=db.p.filter(p=>p.sid===e.sid&&p.gid===e.gid&&p.allocMonth===mm).reduce((sum,p)=>sum+(+(p.netAfterRefund??p.a)||0),0);
   return due-paid>0.001;
  });
  if(pending)count++;
 });
 return count;
}
window.emciaUpdateAlertCounter=function(){
 const badge=document.getElementById('emcia-alert-count');
 if(!badge)return;
 const count=emciaPendingAlertCount();
 badge.textContent=count>99?'99+':String(count);
 badge.style.display='inline-flex';
 badge.title=count+' تسجيلات تستدعي متابعة الأداء';
};

function dueForEnrollmentMonth(e,m){
 if(!m||m<EMCIA_ACCOUNTING_START_MONTH||!e||!e.active||e.billingMode==="session"||!e.start||e.start.slice(0,7)>m)return 0;
 const g=by(db.g,e.gid);if(!g)return 0;
 const base=(e.start.slice(0,7)===m&&e.fee!=null)?Math.max(0,+e.fee||0):Math.max(0,+g.f||0);
 const discount=activeDiscount(e,m);
 return Math.max(0,base-(discount?.amount||0));
}

function validateBackup(obj){
 let d=(obj&&obj.emciaBackup===true&&obj.data)?obj.data:obj;
 if(!d||typeof d!=="object")return {ok:false,msg:"الملف لا يحتوي على قاعدة بيانات صالحة."};
 let required=["t","s","g","e","p","x"];
 let missing=required.filter(k=>!Array.isArray(d[k]));
 if(missing.length)return {ok:false,msg:"النسخة ناقصة أو غير متوافقة. الحقول المفقودة: "+missing.join(", ")};
 return {ok:true,data:d,meta:(obj&&obj.emciaBackup===true)?obj:null}
}
function inspectBackup(inp){
 let f=inp.files&&inp.files[0];if(!f)return;let r=new FileReader();
 r.onload=()=>{let box=$("#backupCheck");try{
   let obj=JSON.parse(r.result),v=validateBackup(obj);
   if(!v.ok){box.style.display="block";box.innerHTML=`<h3>❌ النسخة غير صالحة</h3><p>${esc(v.msg)}</p>`;inp.value="";return}
   window.pendingBackup=v.data;
   let d=v.data,created=v.meta&&v.meta.createdAt?new Date(v.meta.createdAt).toLocaleString("fr-MA"):"نسخة قديمة بدون تاريخ داخلي";
   box.style.display="block";box.innerHTML=`<h3>✅ تم التحقق من النسخة</h3><p><b>الملف:</b> ${esc(f.name)}<br><b>تاريخ الإنشاء:</b> ${esc(created)}</p>
   <p>الأساتذة: ${d.t.length} — المتعلمون: ${d.s.length} — الأفواج: ${d.g.length} — التسجيلات: ${d.e.length} — الأداءات: ${d.p.length}</p>
   <p class="warn">الاسترجاع سيستبدل جميع البيانات الحالية في التطبيق.</p><button type="button" onclick="restoreVerifiedBackup()">♻️ استرجاع هذه النسخة</button>`;
 }catch(e){box.style.display="block";box.innerHTML="<h3>❌ ملف غير صالح</h3><p>تعذر قراءة الملف كنسخة احتياطية لـ EMCIA.</p>";inp.value=""}};
 r.readAsText(f)
}
async function restoreVerifiedBackup(){
 if(!window.pendingBackup){alert("اختر نسخة احتياطية صالحة أولاً.");return}
 if(!confirm("تحذير: سيتم استبدال جميع البيانات الحالية بالنسخة المختارة. هل تريد المتابعة؟"))return;
 if(!confirm("تأكيد أخير: هل أنت متأكد من استرجاع النسخة واستبدال البيانات الحالية؟"))return;
 const original=db;
 const restored=window.pendingBackup;
 const synced=window.EMCIA_CLOUD_SYNC;
 if(!synced?.restore){alert("تعذر الوصول إلى الحفظ السحابي. لم يتم استرجاع البيانات.");return}
 try{
  await synced.restore(restored);
  db=restored;
  localStorage.setItem(KEY,JSON.stringify(db));
  window.pendingBackup=null;
  nav();enterApp();applyLang();
  alert("تم استرجاع البيانات وحفظها في النظام السحابي بنجاح، دون تسجيل الخروج.");
 }catch(error){
  db=original;
  alert("تعذر تأكيد الاسترجاع السحابي، ولم تُستبدل البيانات الحالية: "+error.message);
 }
}

<script>

(function(){

 const hidden=document.getElementById('authPassword');

 if(!eye||!hidden||!shown)return;
 const openIcon='<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>';
 const closedIcon='<path d="M3 3l18 18"/><path d="M10.6 5.1A11 11 0 0 1 12 5c6.4 0 10 7 10 7a15 15 0 0 1-3.2 4"/><path d="M6.2 6.2C3.5 8.1 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.5 4.5-1.3"/>';
 eye.addEventListener('click',function(event){
  event.preventDefault();
  const reveal=eye.getAttribute('aria-pressed')!=='true';
  if(reveal){shown.value=hidden.value;hidden.style.display='none';shown.style.display='block';shown.focus();}
  else{hidden.value=shown.value;shown.style.display='none';hidden.style.display='block';hidden.focus();}
  eye.setAttribute('aria-pressed',String(reveal));
  eye.setAttribute('aria-label',reveal?'إخفاء كلمة المرور':'إظهار كلمة المرور');
  eye.querySelector('svg').innerHTML=reveal?closedIcon:openIcon;
 });
 shown.addEventListener('input',function(){hidden.value=shown.value;});
})();
