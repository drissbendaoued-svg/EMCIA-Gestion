<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التحقق من شهادة EMCIA</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#f0f4f8;color:#102a43;margin:0;padding:20px}.card{max-width:540px;margin:6vh auto;background:white;border:1px solid #d7e0e8;border-top:5px solid #b89a55;border-radius:14px;padding:30px;text-align:center;box-shadow:0 10px 25px #102a4310}h1{font-size:25px}.result{font-size:19px;line-height:2}.ref{direction:ltr;unicode-bidi:isolate;font-weight:bold}.muted{font-size:13px;color:#64748b}</style></head><body><main class="card"><img src="EMCIA_Official_Logo-1.jpg" alt="EMCIA" style="max-height:80px;max-width:80%"><h1>التحقق من صحة الشهادة</h1><div id="result" class="result">جار التحقق...</div><p class="muted">هذه الخدمة تعرض حالة الشهادة ورقمها وتاريخ إصدارها فقط، ولا تعرض بيانات المستفيد.</p></main><script>(async()=>{const target=document.getElementById('result');const token=new URLSearchParams(location.search).get('token');if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(token||'')){target.textContent='رابط التحقق غير صالح';return}try{const r=await fetch('https://gfhmkijxiinoqkxhicza.supabase.co/rest/v1/rpc/emcia_verify_certificate',{method:'POST',headers:{apikey:'sb_publishable_AZWNmDjlNPpADgPFYwH3oA_71o4ABTM','Content-Type':'application/json'},body:JSON.stringify({p_token:token})});if(!r.ok)throw Error('تعذر الاتصال بخدمة التحقق');const rows=await r.json();if(!rows.length){target.textContent='لم يُعثر على شهادة مطابقة لهذا الرمز';return}const c=rows[0];const state=document.createElement('strong');state.textContent=c.certificate_status==='valid'?'شهادة مسجلة وسارية':c.certificate_status==='archived'?'شهادة محذوفة من السجل النشط':'شهادة ملغاة';state.style.color=c.certificate_status==='valid'?'#17643c':'#a22222';target.replaceChildren(state);const p=document.createElement('p');p.className='ref';p.textContent=c.certificate_ref;target.append(p);const date=document.createElement('p');date.textContent='تاريخ الإصدار: '+c.issued_date;target.append(date)}catch(e){target.textContent=e.message}})();</script></body></html>
