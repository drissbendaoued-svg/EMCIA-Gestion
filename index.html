<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMCIA | تسجيل الدخول</title>
<style>body{font-family:system-ui,sans-serif;background:#f2f5fa;color:#18314c;min-height:100vh;margin:0;display:grid;place-items:center}main{background:#fff;border-radius:18px;padding:28px;max-width:420px;width:calc(100% - 48px);box-shadow:0 10px 28px #1232}h1{text-align:center}label{display:block;margin-top:18px}input{box-sizing:border-box;width:100%;padding:14px;margin-top:7px;border:1px solid #bbc4d0;border-radius:9px;font:inherit;direction:ltr}button{width:100%;padding:14px;margin-top:20px;background:#195989;border:0;color:white;border-radius:9px;font:inherit;cursor:pointer}button.secondary{background:transparent;color:#195989;border:1px solid #195989}#status{min-height:28px;margin-top:16px;overflow-wrap:anywhere}small{color:#667}</style></head><body><main><h1>EMCIA | تسجيل الدخول</h1><p>صفحة اختبار آمنة للمصادقة — لا تعرض بيانات المؤسسة.</p>
<form id="login"><label>البريد الإلكتروني<input id="email" type="email" autocomplete="username" required value="emciazaio@gmail.com"></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">دخول</button></form>
<button id="reset" class="secondary" type="button">إرسال رابط استعادة كلمة المرور</button><section id="newpass" hidden><label>كلمة المرور الجديدة<input id="newpassword" type="password" autocomplete="new-password" minlength="8"></label><button id="savepass" type="button">حفظ كلمة المرور الجديدة</button></section><div id="status" role="status" aria-live="polite"></div><small>هذه صفحة اختبار فقط؛ التطبيق الإداري لم يُنشر بعد.</small></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script>
const status=document.getElementById('status');const say=x=>status.textContent=x;
const client=window.supabase?.createClient('https://gfhmkijxiinoqkxhicza.supabase.co','sb_publishable_AZWNmDjlNPpADgPFYwH3oA_71o4ABTM');
if(!client)say('تعذر تحميل مكتبة الاتصال. تحقق من الإنترنت.');
document.getElementById('login').onsubmit=async e=>{e.preventDefault();if(!client)return; say('جار التحقق...');const {data,error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){say('فشل الدخول: '+error.message);return;}const {data:profile}=await client.from('profiles').select('role,active').eq('user_id',data.user.id).maybeSingle();say(profile?.active?'تم تسجيل الدخول. الصلاحية: '+profile.role:'نجح تسجيل الدخول، لكن صلاحية التطبيق لم تُفعّل بعد.');};
document.getElementById('reset').onclick=async()=>{if(!client)return;say('جار إرسال رابط الاستعادة...');const {error}=await client.auth.resetPasswordForEmail(document.getElementById('email').value.trim(),{redirectTo:location.origin+location.pathname});say(error?'تعذر الإرسال: '+error.message:'إذا كان البريد مسجلاً ومسموحًا بالإرسال، ستصلك رسالة لاستعادة كلمة المرور.');};
client?.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){document.getElementById('newpass').hidden=false;say('أدخل كلمة مرور جديدة ثم احفظها.');}});
document.getElementById('savepass').onclick=async()=>{const p=document.getElementById('newpassword').value;if(p.length<8){say('اختر كلمة مرور من 8 رموز على الأقل.');return;}const {error}=await client.auth.updateUser({password:p});say(error?'تعذر التحديث: '+error.message:'تم تحديث كلمة المرور. يمكنك تسجيل الدخول بها الآن.');if(!error)document.getElementById('newpass').hidden=true;};
</script></body></html>
