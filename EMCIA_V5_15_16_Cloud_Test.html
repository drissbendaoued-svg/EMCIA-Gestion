<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMCIA Gestion Mobile V3.7</title>
<style>
:root{--nav:#102a43;--bg:#f4f7fb;--card:#fff;--line:#d9e2ec;--txt:#102a43;--muted:#627d98;--ok:#16865c;--bad:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--txt)}
header{background:var(--nav);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
header b{font-size:20px} header small{display:block;opacity:.8}
nav{display:flex;gap:7px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:66px;z-index:4}
nav button{white-space:nowrap;background:#eef3f8;color:var(--txt)}
main{max-width:1050px;margin:auto;padding:12px}.page{display:none}.page.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #102a4310}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.kpi{font-size:24px;font-weight:800}.muted{color:var(--muted);font-size:13px}
label{font-size:13px;color:var(--muted)}input,select,textarea,button{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:4px 0 8px}
button{border:0;background:var(--nav);color:#fff;font-weight:700;cursor:pointer}.secondary{background:#627d98}.danger{background:var(--bad)}.ok{background:var(--ok)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;align-items:end}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:right;vertical-align:top}th{background:#f7f9fc}
.actions{display:flex;gap:5px}.actions button{width:auto;padding:6px 9px;margin:0}.badge{padding:3px 7px;border-radius:20px;background:#eaf2f8;display:inline-block}
.warn{background:#fff5df;border:1px solid #f1c40f;padding:10px;border-radius:10px}.hidden{display:none}
progress{width:100%;height:16px}.ltr{direction:ltr;text-align:left}
@media(max-width:600px){nav{top:64px}th,td{padding:6px;font-size:12px}.actions{flex-direction:column}.actions button{width:100%}}

@media print{

#nav{display:flex;gap:8px;align-items:flex-start;padding:10px;overflow:visible}
.main-nav{width:165px;flex:0 0 165px;display:flex;flex-direction:column;gap:7px}
.main-nav button{width:100%;min-height:42px;text-align:right;white-space:normal;font-weight:700}
.main-nav button.active-cat{outline:2px solid currentColor}
.subnav-wrap{flex:1;min-width:0}
.subnav-title{font-weight:800;margin:2px 0 7px}
.subnav{display:flex;flex-wrap:wrap;gap:6px;overflow:visible}
.subnav button{flex:1 1 125px;min-width:0;white-space:normal;line-height:1.2;padding:7px 6px}
body.reception-mode #nav{display:none}
body.reception-mode main{width:100%;max-width:none;margin:0;padding:0}
body.reception-mode #home{min-height:calc(100vh - 60px);width:100%}
body.reception-mode #home .welcome-card{min-height:calc(100vh - 95px);margin:0;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
body.reception-mode #home .dashboard-after-welcome{display:none}
.welcome-card{text-align:center;padding:28px 16px}
.welcome-logo{width:100px;height:100px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;border:2px solid currentColor}
.welcome-name{font-size:1.5rem;font-weight:900;margin:8px 0}
.welcome-season{font-size:1.1rem;font-weight:700;margin-top:8px}
.welcome-enter{margin-top:24px;min-width:180px}
@media(max-width:650px){
 #nav{gap:7px;padding:8px}
 .main-nav{width:128px;flex-basis:128px}
 .main-nav button{font-size:.80rem;padding:7px 5px}
 .subnav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
 .subnav button{width:100%;font-size:.80rem;padding:7px 4px}
}

/* V5.7.2: section content directly under its sub-navigation */
#appWorkspace{display:grid;grid-template-columns:165px minmax(0,1fr);grid-template-rows:auto 1fr;gap:0 8px;align-items:start}
#nav{display:contents}
#nav .main-nav{grid-column:1;grid-row:1 / span 2;width:auto;min-width:0;padding:10px 0 10px 10px}
#nav .subnav-wrap{grid-column:2;grid-row:1;padding:10px 10px 0 0;min-width:0}
#appWorkspace main{grid-column:2;grid-row:2;min-width:0;margin:0;padding:0 10px 10px 0}
#appWorkspace main .page.active{margin-top:0}
body.reception-mode #appWorkspace{display:block}
body.reception-mode #nav{display:none}
body.reception-mode #appWorkspace main{width:100%;max-width:none;margin:0;padding:0}
@media(max-width:650px){
 #appWorkspace{grid-template-columns:128px minmax(0,1fr);gap:0 7px}
 #nav .main-nav{padding-left:8px}
 #nav .subnav-wrap{padding:8px 8px 0 0}
 #appWorkspace main{padding:0 8px 8px 0}
}

/* V5.7.3 mobile collapsible navigation */
#mobileNavToggle{display:none}
body.reception-mode #mobileNavToggle{display:none!important}
@media(max-width:650px){
 #mobileNavToggle{display:block;position:sticky;top:0;z-index:50;margin:6px 8px;padding:8px 12px}
 body.mobile-nav-collapsed #appWorkspace{grid-template-columns:1fr}
 body.mobile-nav-collapsed #nav .main-nav{display:none}
 body.mobile-nav-collapsed #nav .subnav-wrap{grid-column:1;grid-row:1;padding:8px}
 body.mobile-nav-collapsed #appWorkspace main{grid-column:1;grid-row:2;padding:0 8px 8px}
 body:not(.mobile-nav-collapsed) #appWorkspace{grid-template-columns:128px minmax(0,1fr)}
}

/* V5.7.4 language-aware direction */
html[dir="rtl"] body{text-align:right}
html[dir="ltr"] body{text-align:left}
html[dir="rtl"] #appWorkspace{direction:rtl}
html[dir="ltr"] #appWorkspace{direction:ltr}
html[dir="rtl"] #nav .main-nav{grid-column:1;padding:10px 10px 10px 0}
html[dir="rtl"] #nav .subnav-wrap{grid-column:2;padding:10px 0 0 10px}
html[dir="rtl"] #appWorkspace main{grid-column:2;padding:0 0 10px 10px}
html[dir="ltr"] #nav .main-nav{grid-column:1;padding:10px 0 10px 10px}
html[dir="ltr"] #nav .subnav-wrap{grid-column:2;padding:10px 10px 0 0}
html[dir="ltr"] #appWorkspace main{grid-column:2;padding:0 10px 10px 0}
html[dir="rtl"] .main-nav button{text-align:right}
html[dir="ltr"] .main-nav button{text-align:left}
html[dir="rtl"] #mobileNavToggle{margin-left:auto;margin-right:8px}
html[dir="ltr"] #mobileNavToggle{margin-right:auto;margin-left:8px}
@media(max-width:650px){

/* V5.7.8 — reception-only compact language chooser */
.lang-menu{position:absolute;top:8px;left:8px;z-index:3000}
.lang-menu>button{width:42px!important;height:38px!important;min-width:42px!important;padding:4px!important;border-radius:10px!important}

/* Compact report action buttons */
#reportcenter .rc-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#reportcenter .rc-actions button{width:auto!important;min-width:88px;min-height:44px;padding:9px 14px!important;font-size:16px!important;flex:0 0 auto!important}

  align-items:center!important;

@media(max-width:650px){

/* V5.10.1 — clear active navigation state */
.main-nav button.active-cat{

<body><div id="authGate"><div class="panel"><h1>EMCIA | تسجيل الدخول</h1><p>نسخة اختبارية V5.15.16 — الدخول للمدير فقط</p><form id="authForm"><label>البريد الإلكتروني<input id="authEmail" type="email" required autocomplete="username" value="emciazaio@gmail.com"></label><label>كلمة المرور<input id="authPassword" type="password" required autocomplete="current-password"></label><button type="submit">دخول</button></form><p id="authStatus" role="status" aria-live="polite"></p><small>البيانات في هذه المرحلة محلية على الجهاز؛ لم تُفعّل المزامنة السحابية بعد.</small></div></div>

<script id="emcia-app-source" type="text/plain">
const KEY="emcia_core_mobile";
const $=s=>document.querySelector(s), money=n=>(+n||0).toFixed(2)+" DH", uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nowMonth=()=>new Date().toISOString().slice(0,7), today=()=>new Date().toISOString().slice(0,10);
let raw={}; try{raw=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
let db={
 subj:Array.isArray(raw.subj)?raw.subj:[], t:Array.isArray(raw.t)?raw.t:[], s:Array.isArray(raw.s)?raw.s:[], g:Array.isArray(raw.g)?raw.g:[],
 e:Array.isArray(raw.e)?raw.e:[], p:Array.isArray(raw.p)?raw.p:[], tp:Array.isArray(raw.tp)?raw.tp:[], adj:Array.isArray(raw.adj)?raw.adj:[], cash:Array.isArray(raw.cash)?raw.cash:[], shifts:Array.isArray(raw.shifts)?raw.shifts:[], tatt:Array.isArray(raw.tatt)?raw.tatt:[], wait:Array.isArray(raw.wait)?raw.wait:[], wls:Array.isArray(raw.wls)?raw.wls:[],
 x:Array.isArray(raw.x)?raw.x:[], oi:Array.isArray(raw.oi)?raw.oi:[], sv:Array.isArray(raw.sv)?raw.sv:[], att:Array.isArray(raw.att)?raw.att:[], sch:Array.isArray(raw.sch)?raw.sch:[], rooms:Array.isArray(raw.rooms)?raw.rooms:[]
};
if(!db.rooms.length)db.rooms=[
 {id:"room30",n:"القاعة 1",cap:30,active:true},
 {id:"room20",n:"القاعة 2",cap:20,active:true},
 {id:"room18",n:"القاعة 3",cap:18,active:true},
 {id:"room10",n:"القاعة 4",cap:10,active:true},
 {id:"room8",n:"القاعة 5",cap:8,active:true}
];
db.rooms=db.rooms.map(r=>({...r,active:r.active!==false,cap:+r.cap||0}));
db.sch=db.sch.map(s=>({...s,active:s.active!==false}));
db.t=db.t.map(o=>({...o,active:o.active!==false,subjects:Array.isArray(o.subjects)?o.subjects.filter(Boolean):(o.sub?[o.sub]:[])}));
db.s=db.s.map(o=>({...o,active:o.active!==false,ph:o.ph||"",parent:o.parent||"",level:o.level||"",joined:o.joined||"",note:o.note||"",studentType:o.studentType||"new",requestedSubjects:Array.isArray(o.requestedSubjects)?o.requestedSubjects:[]}));
db.g=db.g.map(o=>{let tt=db.t.find(x=>x.id===o.tid);return {...o,active:o.active!==false,f:+o.f||0,r:+o.r||0,subject:o.subject||(tt?.sub||(Array.isArray(tt?.subjects)?tt.subjects[0]:"")||""),level:o.level||o.specialty||""}});
db.e=db.e.map(o=>({...o,fee:o.fee==null?null:+o.fee,reason:o.reason||"",start:o.start||"",active:o.active!==false}));
db.p=db.p.map(o=>({...o,date:o.date||today(),receiptMonth:o.receiptMonth||o.m||nowMonth(),allocMonth:o.allocMonth||o.m||nowMonth(),type:o.type||"payment",note:o.note||""}));

let LANG=localStorage.getItem("emcia_lang")||"ar";
document.documentElement.lang=LANG;document.documentElement.dir=LANG==="ar"?"rtl":"ltr";
function tr(s){
 if(LANG!=="fr"||!s)return s;
 let out=String(s);
 Object.keys(I18N).sort((a,b)=>b.length-a.length).forEach(k=>{if(out.includes(k))out=out.split(k).join(I18N[k])});
 return out;
}

function applyLang(){
 document.documentElement.lang=LANG;
 document.documentElement.dir=LANG==="ar"?"rtl":"ltr";
 document.body.classList.toggle("rtl-ui",LANG==="ar");
 document.body.classList.toggle("ltr-ui",LANG==="fr");
 let lm=document.getElementById("langMenu");
 if(lm)lm.style.display=document.querySelector(".page.active")?.id==="home"?"block":"none";
 const sels="button,a,th,td,h1,h2,h3,p,label,option,.muted,.warn";
 document.querySelectorAll(sels).forEach(el=>{
   if(el.children.length===0){
     if(el.dataset.uiAr===undefined && /[\u0600-\u06ff]/.test(el.textContent))el.dataset.uiAr=el.textContent;
     if(el.dataset.uiAr!==undefined)el.textContent=LANG==="fr"?tr(el.dataset.uiAr):el.dataset.uiAr;
   }
 });
 document.querySelectorAll("input[placeholder],textarea[placeholder]").forEach(el=>{
   let p=el.getAttribute("placeholder")||"";
   if(el.dataset.uiArPh===undefined && /[\u0600-\u06ff]/.test(p))el.dataset.uiArPh=p;
   if(el.dataset.uiArPh!==undefined)el.setAttribute("placeholder",LANG==="fr"?tr(el.dataset.uiArPh):el.dataset.uiArPh);
 });
}
function setLang(v){
 LANG=v==="fr"?"fr":"ar";localStorage.setItem("emcia_lang",LANG);
 document.getElementById("langChoices")?.classList.remove("open");
 nav();let p=document.querySelector(".page.active");
 if(p&&p.id&&({home,subjects,teachers,students,groups,enroll,payments,teacherpay,expenses,budget,reportcenter,teacherfile,studentfile,daily,schedule,attendance,arrears,analysis,reports,exports,backup})[p.id])({home,teachers,students,groups,enroll,payments,expenses,budget,reportcenter,teacherfile,studentfile,daily,schedule,attendance,arrears,analysis,reports,exports,backup})[p.id]();
 applyLang()
}

 const school=["الأول ابتدائي","الثاني ابتدائي","الثالث ابتدائي","الرابع ابتدائي","الخامس ابتدائي","السادس ابتدائي","الأولى إعدادي","الثانية إعدادي","الثالثة إعدادي","الجذع المشترك","الأولى بكالوريا","الثانية بكالوريا"];
 const lang=["A1","A2","B1","B2","C1","C2","مبتدئ","متوسط","متقدم"];
 if(category==="لغة")return lang;
 if(category==="دعم مدرسي")return school;
 if(category==="تكوين"&&normalizeSubjectName(subject)==="الإعلاميات")return ["المكتبيات","البرمجة","الذكاء الاصطناعي"];
 return [];
}

}

function showEnrollFee(){let g=by(db.g,$("#eg")?.value);if($("#efd"))$("#efd").value=g?money(g.f):"اختر الفوج أولاً"}
function toggleSpecialFee(){let b=$("#specialFeeBox");if(!b)return;b.classList.toggle("hidden",!$("#er").value);if(!$("#er").value&&$("#ef"))$("#ef").value=""}
function toggleCustomDiscount(){let b=$("#edcustomBox");if(b)b.classList.toggle("hidden",$("#edbear")?.value!=="custom")}
function toggleDiscountEnd(){let b=$("#edendBox");if(b)b.classList.toggle("hidden",$("#edterm")?.value!=="date")}
function seasonEndForMonth(m){if(!m)return "";let y=+m.slice(0,4),mo=+m.slice(5,7);return (mo>=9?y+1:y)+"-06"}
function discountSummary(e){let d=+e.discountAmount||0;if(!d)return "—";let bear={teacher:"الأستاذ",emcia:"المؤسسة",half:"50/50",custom:"مخصص"}[e.discountBearer]||"—";let term=e.discountTerm==="month"?"شهر واحد":e.discountTerm==="season"?"إلى نهاية الموسم":e.discountTerm==="date"?("إلى "+(e.discountEnd||"—")):"حتى الإيقاف";return `${money(d)} — ${bear}<br><span class="muted">${e.discountStart||"—"} · ${term}</span>`}
function activeDiscount(e,month){
 let d=+e?.discountAmount||0;if(!d||!month)return null;
 let st=e.discountStart||((e.start||"").slice(0,7));if(st&&month<st)return null;
 let term=e.discountTerm||"until_stop",end="";
 if(term==="month")end=st;
 else if(term==="season")end=seasonEndForMonth(st);
 else if(term==="date")end=e.discountEnd||"";
 if(end&&month>end)return null;
 let td=0,ed=0,b=e.discountBearer||"emcia";
 if(b==="teacher")td=d;else if(b==="emcia")ed=d;else if(b==="half"){td=d/2;ed=d/2}
 else if(b==="custom"){td=+e.discountTeacher||0;ed=+e.discountEmcia||0}
 return {amount:d,teacher:td,emcia:ed,bearer:b}
}
function enrollmentFor(sid,gid){return db.e.find(e=>e.sid===sid&&e.gid===gid&&e.active)||db.e.find(e=>e.sid===sid&&e.gid===gid)}
function paymentSplit(sid,gid,amount,month){
 let g=by(db.g,gid),e=enrollmentFor(sid,gid),rate=+g?.r||0;
 let base=+(e?.fee==null?g?.f:e.fee)||0,disc=activeDiscount(e,month),D=disc?.amount||0;
 let due=Math.max(0,base-D),teacherFull=base*rate/100-(disc?.teacher||0),emciaFull=base*(100-rate)/100-(disc?.emcia||0);
 teacherFull=Math.max(0,teacherFull);emciaFull=Math.max(0,emciaFull);
 let a=+amount||0,scale=due>0?Math.min(1,a/due):0;
 let td=teacherFull*scale,ee=emciaFull*scale;
 if(a>due){let extra=a-due;ee+=extra}
 return {teacher:td,emcia:ee,discount:D,due,base,discountTeacher:disc?.teacher||0,discountEmcia:disc?.emcia||0}
}
function addEnroll(){

 if(db.e.some(e=>e.sid===sid&&e.gid===gid&&e.active))return alert("المتعلم مسجل في هذا الفوج");
 let fee=null;if(reason){let v=$("#ef").value;if(v==="")return alert("أدخل الاستحقاق الاستثنائي للشهر الأول");fee=+v;if(!(fee>=0))return alert("أدخل مبلغاً صحيحاً")}

 let dt=0,dm=0;
 if(da>0){
  if(bear==="none")return alert("حدد من يتحمل التخفيض");
  if(term==="date"&&!de)return alert("حدد آخر شهر للتخفيض");
  if(term==="date"&&de<ds)return alert("نهاية التخفيض يجب ألا تسبق بدايته");
  if(bear==="custom"){dt=+($("#edteacher")?.value||0);dm=+($("#edemcia")?.value||0);if(Math.abs((dt+dm)-da)>0.01)return alert("في التوزيع المخصص يجب أن يساوي مجموع حصة الأستاذ والمؤسسة قيمة التخفيض")}
 }
 db.e.push({id:uid(),sid,gid,start:$("#est").value||today(),fee,reason,active:true,discountAmount:da,discountBearer:da?bear:"none",discountStart:ds,discountTerm:term,discountEnd:term==="date"?de:"",discountTeacher:dt,discountEmcia:dm});
 save();window._enrollJustSaved=true;enroll();setTimeout(()=>{let x=$("#enrollSuccess");if(x){x.classList.remove("hidden");window._enrollJustSaved=false}},0)
}
function editEnroll(id){

 o.discountAmount=d;
 if(d>0){
  let b=prompt("من يتحمل التخفيض؟ teacher=الأستاذ / emcia=المؤسسة / half=50/50 / custom=مخصص",o.discountBearer||"emcia");if(b===null)return;
  if(!["teacher","emcia","half","custom"].includes(b))return alert("اختيار غير صحيح");
  o.discountBearer=b;
  let st=prompt("بداية التخفيض YYYY-MM",o.discountStart||nowMonth());if(st===null)return;o.discountStart=st;
  let tr=prompt("المدة: until_stop=حتى الإيقاف / season=نهاية الموسم / month=شهر / date=إلى شهر محدد",o.discountTerm||"until_stop");if(tr===null)return;
  if(!["until_stop","season","month","date"].includes(tr))return alert("مدة غير صحيحة");o.discountTerm=tr;
  if(tr==="date"){let en=prompt("آخر شهر YYYY-MM",o.discountEnd||st);if(en===null)return;o.discountEnd=en}else o.discountEnd="";
  if(b==="custom"){let td=+prompt("حصة الأستاذ من التخفيض",o.discountTeacher||0),ed=+prompt("حصة المؤسسة من التخفيض",o.discountEmcia||0);if(Math.abs(td+ed-d)>0.01)return alert("مجموع الحصتين يجب أن يساوي التخفيض");o.discountTeacher=td;o.discountEmcia=ed}
 }else{o.discountBearer="none";o.discountTeacher=0;o.discountEmcia=0;o.discountEnd=""}

}
function delEnroll(id){let o=by(db.e,id);if(db.p.some(p=>p.sid===o.sid&&p.gid===o.gid)){if(confirm("توجد أداءات مرتبطة. سيتم إيقاف التسجيل بدل حذفه."))o.active=false}else if(confirm("حذف التسجيل؟"))db.e=db.e.filter(x=>x.id!==id);save();enroll()}


function shiftLabel(v){return v==="evening"?"المناوبة المسائية":"المناوبة الصباحية"}
function shiftRecord(day,type){return db.shifts.find(x=>x.date===day&&x.type===type)||null}
function shiftCashPayments(day,type){
 let rec=shiftRecord(day,type); if(!rec||!rec.openedAt)return [];
 let start=new Date(rec.openedAt).getTime(), end=rec.closedAt?new Date(rec.closedAt).getTime():Infinity;
 return db.p.filter(p=>{
   if((p.method||"cash")!=="cash"||(p.date||"")!==day)return false;
   let ts=p.createdAt?new Date(p.createdAt).getTime():NaN;
   // Legacy/current payments without timestamp cannot be reliably assigned to a shift.
   return Number.isFinite(ts)&&ts>=start&&ts<=end
 })
}

}

  shiftClosePreview();return
 }

 <div class="row"><div><b>العهدة</b><br>${money(500)}</div><div><b>عدد التوصيلات</b><br>${rec.receiptCount||0}</div><div><b>المقبوضات النقدية</b><br>${money(rec.cashIn||0)}</div><div><b>المبلغ المعزول</b><br>${money(rec.isolated||0)}</div><div><b>العهدة المتروكة</b><br>${money(rec.floatLeft||0)}</div><div><b>الفرق</b><br>${money(diff)}</div></div>

function openShift(){
 let day=$("#shdate").value||today(),type=$("#shtype").value,actual=+($("#shopencash").value||0),diff=actual-500,note="";

function dayAr(date){return["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"][new Date(date+"T12:00:00").getDay()]}
function sessionAttendanceStatus(s,date){
 let es=db.e.filter(e=>e.active&&e.gid===s.gid&&(!e.start||e.start<=date)),rec=db.att.filter(a=>a.date===date&&a.gid===s.gid);
 if(!es.length)return{label:"لا متعلمين",cls:"muted",done:true,n:0,marked:0};
 let marked=new Set(rec.filter(a=>a.status).map(a=>a.sid)).size;
 if(marked>=es.length)return{label:"مكتمل",cls:"ok",done:true,n:es.length,marked};
 if(marked>0)return{label:`جزئي ${marked}/${es.length}`,cls:"warn",done:false,n:es.length,marked};
 return{label:"لم يسجل",cls:"bad",done:false,n:es.length,marked:0}
}
function repeatedAbsences(date){
 let cutoff=date.slice(0,7), map={};
 db.att.filter(a=>a.status==="absent"&&a.date.slice(0,7)===cutoff).forEach(a=>{let k=a.sid+"|"+a.gid;map[k]=(map[k]||0)+1});
 return Object.entries(map).filter(([k,n])=>n>=3).map(([k,n])=>{let [sid,gid]=k.split("|");return{s:by(db.s,sid),g:by(db.g,gid),n}}).filter(x=>x.s&&x.g).sort((a,b)=>b.n-a.n)
}
function daily(){
 let date=window.dailyDate||today(),day=dayAr(date),sessions=db.sch.filter(s=>s.active!==false&&s.day===day).sort((a,b)=>a.start.localeCompare(b.start));
 let unfinished=sessions.filter(s=>!sessionAttendanceStatus(s,date).done);
 let capacity=sessions.map(s=>{let g=by(db.g,s.gid),r=by(db.rooms,s.rid),n=db.e.filter(e=>e.active&&e.gid===s.gid&&(!e.start||e.start<=date)).length;return{s,g,r,n}}).filter(x=>x.r&&x.n>x.r.cap);
 let abs=repeatedAbsences(date);
 let m=date.slice(0,7),debtors=0,debtTotal=0;
 db.e.filter(e=>e.active&&e.start&&e.start.slice(0,7)<=m).forEach(e=>{let debt=monthRange(e.start,m).reduce((z,mm)=>{let due=dueForEnrollmentMonth(e,mm),paid=db.p.filter(p=>p.eid===e.id&&p.allocMonth===mm).reduce((a,p)=>a+(+(p.netAfterRefund??p.a)||0),0);return z+Math.max(0,due-paid)},0);if(debt>0){debtors++;debtTotal+=debt}});
 $("#daily").innerHTML=`<div class="card"><div class="row"><div><label>التاريخ</label><input type="date" value="${date}" onchange="window.dailyDate=this.value;daily()"></div><div><b>${day}</b></div></div></div>
 <div class="grid"><div class="card"><div class="muted">حصص اليوم</div><div class="kpi">${sessions.length}</div></div><div class="card"><div class="muted">حضور غير مكتمل</div><div class="kpi">${unfinished.length}</div></div><div class="card"><div class="muted">تنبيهات السعة</div><div class="kpi">${capacity.length}</div></div><div class="card"><div class="muted">غياب متكرر هذا الشهر</div><div class="kpi">${abs.length}</div></div><div class="card"><div class="muted">حالات متأخرة في الأداء</div><div class="kpi">${debtors}</div><div class="muted">${money(debtTotal)}</div></div></div>
 <div class="card"><h3>برنامج اليوم</h3>${sessions.length?`<table><tr><th>الوقت</th><th>الفوج</th><th>الأستاذ</th><th>القاعة</th><th>المسجلون</th><th>الحضور</th><th></th></tr>${sessions.map(s=>{let g=by(db.g,s.gid),r=by(db.rooms,s.rid),st=sessionAttendanceStatus(s,date);return`<tr><td>${s.start}–${s.end}</td><td>${esc(g?g.n:"—")}</td><td>${esc(g?objName(by(db.t,g.tid)):"—")}</td><td>${esc(r?r.n:"—")}</td><td>${st.n}${r?` / ${r.cap}`:""}</td><td><b>${st.label}</b></td><td><button onclick="goAttendance('${date}','${s.gid}')">تسجيل الحضور</button></td></tr>`}).join("")}</table>`:"<p class='muted'>لا توجد حصص مبرمجة لهذا اليوم.</p>"}</div>
 <div class="card"><h3>التنبيهات التشغيلية</h3>${unfinished.length?`<p><b>الحضور:</b> ${unfinished.length} حصة لم يكتمل تسجيل حضورها.</p>`:"<p>✓ تسجيل الحضور مكتمل للحصص المسجلة اليوم.</p>"}${capacity.length?`<p><b>السعة:</b> ${capacity.map(x=>`${esc(x.g.n)} (${x.n}/${x.r.cap} في ${esc(x.r.n)})`).join("، ")}</p>`:"<p>✓ لا يوجد تجاوز لسعة القاعات في حصص اليوم.</p>"}${abs.length?`<p><b>الغياب المتكرر:</b></p><table><tr><th>المتعلم</th><th>الفوج</th><th>مرات الغياب هذا الشهر</th></tr>${abs.map(x=>`<tr><td>${esc(objName(x.s))}</td><td>${esc(x.g.n)}</td><td>${x.n}</td></tr>`).join("")}</table>`:"<p>✓ لا توجد حالياً حالات غياب غير مبرر متكرر (3 مرات فأكثر) هذا الشهر.</p>"}<p><b>المتابعة المالية:</b> ${debtors} تسجيل/حالة بها مبالغ متبقية إلى غاية ${m} بإجمالي ${money(debtTotal)}. <button onclick="show('arrears')">فتح المتأخرات</button></p></div>`;applyLang()
}

const DAYS=["الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت","الأحد"];
function overlap(a,b){return a.start<b.end&&b.start<a.end}
function scheduleConflict(candidate,ignoreId=""){
 let same=db.sch.filter(s=>s.active!==false&&s.id!==ignoreId&&s.day===candidate.day&&overlap(s,candidate));
 let g=by(db.g,candidate.gid),tid=g?g.tid:"";
 let problems=[];
 same.forEach(s=>{let sg=by(db.g,s.gid),stid=sg?sg.tid:"";if(s.rid===candidate.rid)problems.push("القاعة محجوزة في هذا التوقيت");if(s.gid===candidate.gid)problems.push("الفوج لديه حصة أخرى في هذا التوقيت");if(tid&&stid===tid)problems.push("الأستاذ لديه حصة أخرى في هذا التوقيت")});
 return [...new Set(problems)]
}
function sessionTypeLabel(v){return ({official:"رسمية",extra:"إضافية",makeup:"تعويضية",exceptional:"استثنائية"})[v]||"رسمية"}
function sessionTypeOptions(v="official"){return [["official","رسمية"],["extra","إضافية"],["makeup","تعويضية"],["exceptional","استثنائية"]].map(x=>`<option value="${x[0]}" ${v===x[0]?"selected":""}>${x[1]}</option>`).join("")}
function onSessionTypeChange(){let b=$("#makeupBox");if(b)b.classList.toggle("hidden",$("#scType")?.value!=="makeup")}
function editableScheduleOptions(selected=""){return `<option value="">— اختر الحصة الأصلية إن وجدت —</option>`+db.sch.filter(x=>x.active&&x.type!=="makeup").map(x=>{let g=by(db.g,x.gid);return `<option value="${x.id}" ${x.id===selected?"selected":""}>${esc(g?.n||"فوج")} — ${esc(x.day)} ${x.start}-${x.end}</option>`}).join("")}
function schedule(){
 $("#schedule").innerHTML=`<div class="card"><p class="muted">يمكن الآن تحديد نوع الحصة وتعديل الحصص الموجودة دون حذفها.</p>
 <div class="row"><div><label>الفوج</label><select id="scG"><option value="">— اختر الفوج —</option>${db.g.filter(x=>x.active).map(x=>`<option value="${x.id}">${esc(x.linkCode||x.n)}</option>`).join("")}</select></div><div><label>اليوم</label><select id="scD">${["الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت","الأحد"].map(x=>`<option>${x}</option>`).join("")}</select></div><div><label>بداية الحصة</label><input id="scS" type="time"></div><div><label>نهاية الحصة</label><input id="scE" type="time"></div><div><label>رقم القاعة</label><select id="scR"><option value="">— اختر القاعة —</option>${db.rooms.filter(x=>x.active).map(x=>`<option value="${x.id}">${esc(x.n)}</option>`).join("")}</select></div><div><label>نوع الحصة</label><select id="scType" onchange="onSessionTypeChange()">${sessionTypeOptions()}</select></div><button onclick="addSchedule()">إضافة الحصة</button></div>
 <div id="makeupBox" class="hidden" style="margin-top:10px"><label>الحصة التي تعوضها هذه الحصة (اختياري)</label><select id="scMakeup">${editableScheduleOptions()}</select></div></div>
 <div class="card"><table><tr><th>اليوم</th><th>الوقت</th><th>الفوج</th><th>الأستاذ</th><th>القاعة</th><th>نوع الحصة</th><th></th></tr>${db.sch.filter(x=>x.active).sort((a,b)=>a.day.localeCompare(b.day,"ar")||a.start.localeCompare(b.start)).map(x=>{let g=by(db.g,x.gid),tt=by(db.t,g?.tid),r=by(db.rooms,x.rid);return `<tr><td>${esc(x.day)}</td><td>${esc(x.start)}–${esc(x.end)}</td><td>${esc(g?.n||"—")}</td><td>${esc(objName(tt)||"—")}</td><td>${esc(r?.n||"—")}</td><td>${sessionTypeLabel(x.type)}</td><td class="actions"><button onclick="editSchedule('${x.id}')">✏️ تعديل</button><button class="danger" onclick="removeSchedule('${x.id}')">🗑️</button></td></tr>`}).join("")}</table></div>`;
}
function roomLoadText(r){let max=0;db.sch.filter(s=>s.active!==false&&s.rid===r.id).forEach(s=>{max=Math.max(max,db.e.filter(e=>e.active&&e.gid===s.gid).length)});return max>r.cap?`⚠️ تجاوز السعة (${max}/${r.cap})`:"سليمة"}
function addSchedule(){
 let type=$("#scType")?.value||"official";
 let c={id:uid(),gid:$("#scG").value,day:$("#scD").value,start:$("#scS").value,end:$("#scE").value,rid:$("#scR").value,type,makeupFor:type==="makeup"?($("#scMakeup")?.value||""):"",active:true};
 if(!c.gid||!c.rid||!c.start||!c.end)return alert("أكمل بيانات الحصة");
 if(c.start>=c.end)return alert("وقت النهاية يجب أن يكون بعد وقت البداية");
 let p=scheduleConflict(c);if(p.length)return alert("تعذر إضافة الحصة:\n• "+p.join("\n• "));
 let r=by(db.rooms,c.rid),n=db.e.filter(e=>e.active&&e.gid===c.gid).length;if(r&&n>r.cap&&!confirm(`عدد المسجلين (${n}) يتجاوز سعة القاعة (${r.cap}). هل تريد الإضافة رغم ذلك؟`))return;
 db.sch.push(c);save();schedule()
}
function editSchedule(id){
 let o=by(db.sch,id);if(!o)return;
 let day=prompt("اليوم",o.day);if(day===null)return;
 let start=prompt("وقت البداية HH:MM",o.start);if(start===null)return;
 let end=prompt("وقت النهاية HH:MM",o.end);if(end===null)return;
 if(start>=end)return alert("وقت النهاية يجب أن يكون بعد وقت البداية");
 let types="1. رسمية\n2. إضافية\n3. تعويضية\n4. استثنائية",cur={official:1,extra:2,makeup:3,exceptional:4}[o.type||"official"]||1;
 let pick=prompt(`نوع الحصة:\n${types}`,String(cur));if(pick===null)return;
 let type=({1:"official",2:"extra",3:"makeup",4:"exceptional"})[+pick];if(!type)return alert("نوع الحصة غير صحيح");
 let c={...o,day:day.trim()||o.day,start,end,type,makeupFor:type==="makeup"?o.makeupFor||"":""};
 let p=scheduleConflict(c);if(p.length)return alert("تعذر تعديل الحصة:\n• "+p.join("\n• "));
 Object.assign(o,c);save();schedule()
}
function removeSchedule(id){if(!confirm("حذف هذه الحصة من استعمال الزمن؟"))return;db.sch=db.sch.filter(s=>s.id!==id);save();schedule()}
function addRoom(){let n=$("#roomN").value.trim(),cap=+$("#roomC").value;if(!n||cap<1)return alert("أدخل اسم القاعة وسعتها");db.rooms.push({id:uid(),n,cap,active:true});save();schedule()}

function attKey(date,gid,sid){return date+"|"+gid+"|"+sid}
function attendance(){
 let date=window.attDate||today(),gid=window.attGid||"",groups=db.g.filter(g=>g.active!==false);
 if(!gid&&groups.length)gid=groups[0].id;window.attGid=gid;
 let ens=db.e.filter(e=>e.active&&e.gid===gid&&(!e.start||e.start<=date)),students=ens.map(e=>by(db.s,e.sid)).filter(Boolean),records=db.att.filter(a=>a.date===date&&a.gid===gid),c={present:0,absent:0,late:0,excused:0};
 records.forEach(a=>{if(c[a.status]!=null)c[a.status]++});
 let jsDay=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"][new Date(date+"T12:00:00").getDay()],todaySessions=db.sch.filter(s=>s.active!==false&&s.day===jsDay);
 $("#attendance").innerHTML=`<div class="card"><h3>حصص هذا اليوم</h3>${todaySessions.length?`<div class="row">${todaySessions.map(s=>{let g=by(db.g,s.gid),r=by(db.rooms,s.rid);return`<button onclick="window.attGid='${s.gid}';attendance()">${s.start}–${s.end} | ${esc(g?g.n:"")} | ${esc(r?r.n:"")}</button>`}).join("")}</div>`:"<p class='muted'>لا توجد حصص مبرمجة في استعمال الزمن لهذا اليوم.</p>"}</div><div class="card"><h3>الحضور والغياب</h3><div class="row"><div><label>تاريخ الحصة</label><input type="date" value="${date}" onchange="window.attDate=this.value;attendance()"></div><div><label>الفوج</label><select onchange="window.attGid=this.value;attendance()">${groups.map(g=>`<option value="${g.id}" ${g.id===gid?"selected":""}>${esc(g.n)} — ${esc(objName(by(db.t,g.tid)))}</option>`).join("")}</select></div></div></div>
 <div class="grid"><div class="card"><div class="muted">عدد المسجلين</div><div class="kpi">${students.length}</div></div><div class="card"><div class="muted">الحاضرون</div><div class="kpi">${c.present}</div></div><div class="card"><div class="muted">الغائبون</div><div class="kpi">${c.absent}</div></div><div class="card"><div class="muted">المتأخرون</div><div class="kpi">${c.late}</div></div><div class="card"><div class="muted">غياب بعذر</div><div class="kpi">${c.excused}</div></div><div class="card"><div class="muted">غادر قبل النهاية</div><div class="kpi">${c.leftEarly??0}</div></div></div>
 <div class="card"><div class="row"><button onclick="markAllAttendance('present')">تحديد الجميع حاضرين</button><button onclick="clearAttendanceDay()">مسح تسجيلات الحصة</button></div></div>
 <div class="card"><h3>لائحة المتعلمين</h3>${students.length?`<table><tr><th>المتعلم</th><th>الحالة</th><th>ملاحظة</th></tr>${students.map(s=>{let a=records.find(x=>x.sid===s.id),st=a?a.status:"";return`<tr><td>${esc(objName(s))}</td><td><select onchange="saveAttendance('${date}','${gid}','${s.id}',this.value)"><option value="">— اختر —</option><option value="present" ${st==="present"?"selected":""}>حاضر</option><option value="absent" ${st==="absent"?"selected":""}>غائب</option><option value="late" ${st==="late"?"selected":""}>متأخر</option><option value="excused" ${st==="excused"?"selected":""}>غياب بعذر</option><option value="leftEarly" ${st==="leftEarly"?"selected":""}>غادر قبل نهاية الحصة</option></select></td><td><input value="${esc(a&&a.note||"")}" placeholder="ملاحظة اختيارية" onchange="saveAttendanceNote('${date}','${gid}','${s.id}',this.value)"></td></tr>`}).join("")}</table>`:"<p>لا يوجد متعلمون نشطون في هذا الفوج.</p>"}</div>
 <div class="card"><h3>ملخص الشهر</h3>${attendanceMonthSummary(gid,date.slice(0,7))}</div>`;applyLang()
}
function saveAttendance(date,gid,sid,status){let i=db.att.findIndex(a=>attKey(a.date,a.gid,a.sid)===attKey(date,gid,sid));if(!status){if(i>=0)db.att.splice(i,1)}else if(i>=0)db.att[i].status=status;else db.att.push({id:uid(),date,gid,sid,status,note:""});save();attendance()}
function saveAttendanceNote(date,gid,sid,note){let i=db.att.findIndex(a=>attKey(a.date,a.gid,a.sid)===attKey(date,gid,sid));if(i>=0)db.att[i].note=note;else if(note.trim())db.att.push({id:uid(),date,gid,sid,status:"",note});save()}
function markAllAttendance(status){let date=window.attDate||today(),gid=window.attGid||"";db.e.filter(e=>e.active&&e.gid===gid&&(!e.start||e.start<=date)).forEach(e=>{let i=db.att.findIndex(a=>attKey(a.date,a.gid,a.sid)===attKey(date,gid,e.sid));if(i>=0)db.att[i].status=status;else db.att.push({id:uid(),date,gid,sid:e.sid,status,note:""})});save();attendance()}
function clearAttendanceDay(){let date=window.attDate||today(),gid=window.attGid||"";if(!confirm("هل تريد مسح تسجيلات الحضور والغياب لهذه الحصة؟"))return;db.att=db.att.filter(a=>!(a.date===date&&a.gid===gid));save();attendance()}
function attendanceMonthSummary(gid,m){

function backupStamp(){

 return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}`

function exportData(){

function validateBackup(obj){
 let d=(obj&&obj.emciaBackup===true&&obj.data)?obj.data:obj;
 if(!d||typeof d!=="object")return {ok:false,msg:"الملف لا يحتوي على قاعدة بيانات صالحة."};
 let required=["t","s","g","e","p","x"];
 let missing=required.filter(k=>!Array.isArray(d[k]));
 if(missing.length)return {ok:false,msg:"النسخة ناقصة أو غير متوافقة. الحقول المفقودة: "+missing.join(", ")};
 return {ok:true,data:d,meta:(obj&&obj.emciaBackup===true)?obj:null}
}
function inspectBackup(inp){
 let f=inp.files&&inp.files[0];if(!f)return;let r=new FileReader();
 r.onload=()=>{let box=$("#backupCheck");try{
   let obj=JSON.parse(r.result),v=validateBackup(obj);
   if(!v.ok){box.style.display="block";box.innerHTML=`<h3>❌ النسخة غير صالحة</h3><p>${esc(v.msg)}</p>`;inp.value="";return}
   window.pendingBackup=v.data;
   let d=v.data,created=v.meta&&v.meta.createdAt?new Date(v.meta.createdAt).toLocaleString("fr-MA"):"نسخة قديمة بدون تاريخ داخلي";
   box.style.display="block";box.innerHTML=`<h3>✅ تم التحقق من النسخة</h3><p><b>الملف:</b> ${esc(f.name)}<br><b>تاريخ الإنشاء:</b> ${esc(created)}</p>
   <p>الأساتذة: ${d.t.length} — المتعلمون: ${d.s.length} — الأفواج: ${d.g.length} — التسجيلات: ${d.e.length} — الأداءات: ${d.p.length}</p>
   <p class="warn">الاسترجاع سيستبدل جميع البيانات الحالية في التطبيق.</p><button type="button" onclick="restoreVerifiedBackup()">♻️ استرجاع هذه النسخة</button>`;
 }catch(e){box.style.display="block";box.innerHTML="<h3>❌ ملف غير صالح</h3><p>تعذر قراءة الملف كنسخة احتياطية لـ EMCIA.</p>";inp.value=""}};
 r.readAsText(f)
}
function restoreVerifiedBackup(){

}
