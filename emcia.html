function editSchedule(id){
 let o=by(db.sch,id);if(!o)return;
 let day=prompt("اليوم",o.day);if(day===null)return;
 let start=prompt("وقت البداية HH:MM",o.start);if(start===null)return;
 let end=prompt("وقت النهاية HH:MM",o.end);if(end===null)return;
 if(start>=end)return alert("وقت النهاية يجب أن يكون بعد وقت البداية");
 let types="1. رسمية\n2. إضافية\n3. تعويضية\n4. استثنائية",cur={official:1,extra:2,makeup:3,exceptional:4}[o.type||"official"]||1;
 let pick=prompt(`نوع الحصة:\n${types}`,String(cur));if(pick===null)return;
 let type=({1:"official",2:"extra",3:"makeup",4:"exceptional"})[+pick];if(!type)return alert("نوع الحصة غير صحيح");
 const rooms=db.rooms.filter(r=>r.active!==false||r.id===o.rid);
 if(!rooms.length)return alert("لا توجد قاعات متاحة. أضف قاعة أولاً.");
 const currentRoom=rooms.findIndex(r=>r.id===o.rid);
 const roomPick=prompt("تعديل القاعة — اختر الرقم من اللائحة:\n"+rooms.map((r,i)=>(i+1)+". "+r.n+" — السعة: "+r.cap+(r.active===false?" (القاعة الحالية غير نشطة)":"")).join("\n"),currentRoom>=0?String(currentRoom+1):"");
 if(roomPick===null)return;
 const roomNumber=Number(roomPick.trim()),room=Number.isInteger(roomNumber)?rooms[roomNumber-1]:null;
 if(!room)return alert("اختر رقم قاعة صحيحاً من اللائحة");
 let c={...o,day:day.trim()||o.day,start,end,type,rid:room.id,makeupFor:type==="makeup"?o.makeupFor||"":""};
 if(!DAYS.includes(c.day)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(start)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(end))return alert("اليوم أو التوقيت غير صحيح");
 let p=scheduleConflict(c,id);if(p.length)return alert("تعذر تعديل الحصة:\n• "+p.join("\n• "));
 const learners=db.e.filter(e=>emciaEnrollmentDate(e,today())&&e.gid===c.gid).length;
 if(learners>Number(room.cap)&&!confirm("عدد المسجلين ("+learners+") يتجاوز سعة القاعة ("+room.cap+"). هل تريد حفظ التعديل رغم ذلك؟"))return;
 Object.assign(o,c);save();schedule()
}

function emciaPotentialDuplicatePayments(){
 const buckets=new Map();
 const confirmed=new Set((db.duplicateDismissals||[]).map(x=>x.key));
 for(const p of [...db.p.map(x=>({...x,_mode:'شهري'})),...db.sp.map(x=>({...x,_mode:'بالحصة'}))]){
  if(p.voidedAt||p.cancelledAt||!p.sid||!p.date)continue;
  const amount=Number(p.netAfterRefund??p.a);
  if(!Number.isFinite(amount))continue;
  const key=[p.sid,p.gid||'',p.date,Math.round(amount*100),p._mode].join('|');
  if(!buckets.has(key))buckets.set(key,[]);
  buckets.get(key).push(p);
 }
 return [...buckets].filter(([,rows])=>rows.length>1).map(([bucket,rows])=>{
  const receipts=rows.map(p=>JSON.stringify([p.id,p.receiptNo,p.a,p.method,p.paymentRef,
   p._mode==='شهري'?paymentAllocations(p).map(x=>JSON.stringify([x.month,Number(x.amount)])).sort():p.paymentTiming]));
  const key=JSON.stringify([bucket,receipts.sort()]);
  return {key,rows,student:by(db.s,rows[0].sid),group:by(db.g,rows[0].gid)};
 }).filter(item=>!confirmed.has(item.key));
}

function emciaApprovedMonthlyDue(e,m){
 const adjustments=db.adj?.length?db.adj:db.monthlyAdjustmentDues||[];
 let latest=null;
 for(const adjustment of adjustments){
  if(adjustment.sid!==e.sid||adjustment.gid!==e.gid||adjustment.month!==m||
     !Number.isFinite(adjustment.approvedDue)||adjustment.approvedDue<0)continue;
  const receipt=db.p.find(p=>p.id===adjustment.pid&&p.adjustmentId===adjustment.id&&
   p.sid===e.sid&&p.gid===e.gid&&p.allocMonth===m&&!p.voidedAt&&!p.cancelledAt);
  if(!receipt)continue;
  const monthlyEnrollments=db.e.filter(row=>row.billingMode!=="session");
  const enrollment=emciaBillingEnrollment(monthlyEnrollments,e.sid,e.gid,m,receipt.enrollmentId||receipt.eid);
  if(enrollment?.id!==e.id)continue;
  if(!latest||(adjustment.updatedAt||"")>=(latest.updatedAt||""))latest=adjustment;
 }
 return latest==null?null:Math.round(latest.approvedDue*100)/100;
}
function dueForEnrollmentMonth(e,m,{beforeAdjustment=false}={}){
 if(!m||m<EMCIA_ACCOUNTING_START_MONTH||!emciaEnrollmentMonth(e,m)||e.billingMode==="session")return 0;
 if(e.end&&e.end.slice(0,7)===m&&e.stopMonthCharge!=="yes")return 0;
 if(!beforeAdjustment){
  const approved=emciaApprovedMonthlyDue(e,m);
  if(approved!==null)return approved;
 }
 const terms=emciaMonthlyTerms(by(db.g,e.gid),e,m),discount=activeDiscount(e,m);
 return Math.max(0,Math.round((terms.base-(discount?.amount||0)*terms.factor)*100)/100);
}

function teacherExportData(tid,m){

   const planned=relevant.reduce((a,e)=>{
    const terms=emciaMonthlyTerms(g,e,m),discount=activeDiscount(e,m),base=Math.max(0,terms.base);

  });
  return {group:g,rows,paid:rows.reduce((s,r)=>s+r.paid,0),teacherDue:rows.reduce((s,r)=>s+r.due,0),teacherDiscount:rows.reduce((s,r)=>s+r.teacherDiscount,0)};
 })};

function emciaTeacherReceiptSources(sid,gid,m){
 const entries=[];
 (db.p||[]).filter(p=>p.sid===sid&&p.gid===gid).forEach(p=>{
  const allocation=paymentAllocations(p).filter(x=>x.month===m).reduce((n,x)=>n+(Number(x.amount)||0),0);
  if(!(allocation>0))return;
  const original=Number(p.a)||0,net=p.netAfterRefund==null?original:Math.max(0,Number(p.netAfterRefund)||0);
  const effective=original>0?allocation*Math.min(1,net/original):0;
  if(!(effective>0))return;
  entries.push({receipt:p.receiptNo||p.receipt||p.number||"غير مسجل",date:p.date||"غير مسجل",amount:effective});
 });
 return entries;
}

 if(e?.start&&month<e.start.slice(0,7)||e?.end&&!emciaEnrollmentMonth(e,month))return {teacher:0,emcia:0,due:0};
 let d=Number(e?.discountAmount)||0,dt=0,de=0;
 if(d&&month){
  const start=e?.discountStart||(e?.start||'').slice(0,7);
  let end='';
  if(e?.discountTerm==='month')end=start;
  else if(e?.discountTerm==='date')end=e?.discountEnd||'';
  else if(e?.discountTerm==='season'&&start){const y=Number(start.slice(0,4)),m=Number(start.slice(5,7));end=(m>=9?y+1:y)+'-06';}
  if((start&&month<start)||(end&&month>end))d=0;
 }
 if(d){
  const bearer=e?.discountBearer||'emcia';
  if(bearer==='teacher')dt=d;
  else if(bearer==='emcia')de=d;
  else if(bearer==='half'){dt=d/2;de=d/2}
  else if(bearer==='proportional'){if(!Number.isFinite(rate)||rate<0||rate>100)throw Error('نسبة الأستاذ غير صحيحة');dt=Math.round(d*rate)/100;de=d-dt}
  else if(bearer==='custom'){dt=Number(e?.discountTeacher)||0;de=Number(e?.discountEmcia)||0}
 }
 d*=terms.factor;dt*=terms.factor;de*=terms.factor;
 const due=Math.max(0,base-d),scale=due>0?Math.min(1,(Number(amount)||0)/due):0;
 const teacher=Math.max(0,base*rate/100-dt)*scale;
 const emcia=Math.max(0,base*(100-rate)/100-de)*scale+(e?.end||terms.settlement?0:Math.max(0,(Number(amount)||0)-due));
 return {teacher,emcia,due};
}

function emciaTeacherDiscountSchedule(tid,month){

  const factor=emciaMonthlyTerms(g,e,month).factor;
  const payments=db.p.filter(p=>(p.sid||by(db.e,p.eid)?.sid)===e.sid&&(p.gid||by(db.e,p.eid)?.gid)===e.gid&&((p.month||p.m||p.date||"").slice(0,7)===month||(Array.isArray(p.allocations)&&p.allocations.some(a=>a.month===month))));
  items.push({name:name(db.s,e.sid),group:g.n,teacher:Math.round(d.teacher*factor*100)/100,emcia:Math.round(d.emcia*factor*100)/100,bearer:d.bearer,hasPayment:payments.length>0,missingBreakdown:payments.some(p=>p.discountTeacher==null||p.discountEmcia==null)});
 }

}

function joinState(op,fin){
 const state={...op};
 if(canFinance())state.reserveGoals=fin?.reserveGoals&&typeof fin.reserveGoals==="object"?{low:Number(fin.reserveGoals.low)||0,dev:Number(fin.reserveGoals.dev)||0}:{low:0,dev:0};
 for(const k of operationalKeys)if(!Array.isArray(state[k]))state[k]=[];
 for(const k of financialKeys)state[k]=(canFinance()||k==='x'||k==='oi')&&Array.isArray(fin?.[k])?fin[k]:[];
 if(canFinance())for(const k of ['g','e','p','sc']){
  for(const item of fin?.[k]||[]){
   const recordId=item._id??legacyFinancialIds[k]?.[item._index];
   const target=state[k]?.find(row=>row.id===recordId);
   if(target&&typeof target==='object')for(const [field,value] of Object.entries(item))if(!['_index','_id'].includes(field)&&!(field==='r'&&target.r!=null)&&!(k==='p'&&['d','e','t'].includes(field)&&target[field]!=null))target[field]=value;
  }
 }
 state.receiptReviews=Object.fromEntries((state.reviewEvents||[]).filter(x=>x&&x.id).map(({id,...review})=>[id,review]));
 emciaRepricePayments(state,cloudPaymentSplit);

 return state;
}

async function loadCloudSnapshot(){

async function cloudFetch(){

  const cash=await request(api+'/rest/v1/rpc/emcia_cash_snapshot_v1',{method:'POST',headers:headers(),body:JSON.stringify({p_id:cloudId})});
  snapshot.financial={revision:cash.financial_revision,payload:{x:cash.x,oi:cash.oi}};
  op.payload={...op.payload,monthlyAdjustmentDues:cash.monthly_adjustment_dues};
 }
 const fin=snapshot.financial;
 opRevision=Number(op.revision)||0;finRevision=Number(fin?.revision)||0;

}
async function atomicCloudWrite(op,fin){
 const body={p_id:cloudId,p_operational_revision:opRevision,p_operational:op};
 if(canFinance()&&fin){body.p_financial_revision=finRevision;body.p_financial=fin;}
 const out=await request(api+'/rest/v1/rpc/emcia_save_state_v2',{method:'POST',headers:headers(),body:JSON.stringify(body)});
 if(!Number.isSafeInteger(Number(out.operational_revision)))throw Error('تعذر تأكيد عملية الحفظ المترابط');
 opRevision=Number(out.operational_revision);
 if(canFinance()&&fin)finRevision=Number(out.financial_revision);

}
async function flushCloud(){

  const {op,fin}=splitState(state);
  await atomicCloudWrite(op,fin);
  revision=opRevision;
  cloudStatus('☁️ تم الحفظ المترابط — '+new Date().toLocaleTimeString('ar-MA'));
 }catch(e){blocked=true;dirty=true;cloudStatus('⚠️ تعذر تأكيد الحفظ: '+e.message+' — احتفظ بنسخة محلية');}
 finally{saving=false;if(dirty&&!blocked)flushCloud();}
}

async function request(url,options){
 const response=await fetch(url,options);
 const body=await response.json().catch(()=>({}));
 if(!response.ok)throw Error(body.msg||body.error_description||body.message||body.error||('HTTP '+response.status));
 return body;
}

<script>
/* EMCIA compact draggable calculator — read-only, 28-day reference. */
(function(){
 window.emciaOpenSessionCalculator=function(){
  const previous=document.getElementById('emcia-session-calculator');
  if(previous){previous.style.display='block';return;}
  const panel=document.createElement('section');
  panel.id='emcia-session-calculator';
  panel.setAttribute('role','dialog');panel.setAttribute('aria-label','حاسبة الحصص');
  panel.style.cssText='position:fixed;z-index:100101;top:105px;left:10px;width:min(420px,calc(100vw - 20px));max-height:calc(100dvh - 20px);overflow:auto;background:white;color:#102a43;border:1px solid #cbd5e1;border-radius:12px;box-shadow:0 10px 32px #102a4344;direction:rtl;padding:0 10px 10px;font-size:12px';
  panel.innerHTML=`<div data-drag style="position:sticky;top:0;z-index:1;background:#102a43;color:white;margin:0 -10px 9px;padding:6px 10px;display:flex;align-items:center;justify-content:space-between;border-radius:11px 11px 0 0;cursor:move;touch-action:none;min-height:32px"><strong style="font-size:13px">▦ حاسبة الحصص</strong><button type="button" data-close aria-label="إغلاق" title="إغلاق" style="width:24px;height:24px;min-height:24px;padding:0;display:grid;place-items:center;background:transparent;color:white;border:0;border-radius:5px;font-size:17px;line-height:1">×</button></div>
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;align-items:end">
   <label style="display:block;min-width:0;font-size:11px">الواجب الشهري<input data-field="monthly" type="number" min="0" step="0.01" value="150" inputmode="decimal" style="display:block;width:100%;height:32px;min-height:32px;padding:4px 5px;font-size:13px;margin-top:3px"></label>
   <label style="display:block;min-width:0;font-size:11px">حصص الشهر (28 يومًا)<input data-field="monthlySessions" type="number" min="1" step="1" value="8" inputmode="numeric" style="display:block;width:100%;height:32px;min-height:32px;padding:4px 5px;font-size:13px;margin-top:3px"></label>
   <div style="min-width:0"><div style="font-size:11px;margin-bottom:3px">قيمة الحصة</div><output data-out="unit" style="display:flex;align-items:center;justify-content:center;min-height:32px;padding:4px 3px;background:#eef3f8;border-radius:6px;font-weight:700;font-size:13px;text-align:center"></output></div>
   <label style="display:block;min-width:0;font-size:11px">الحصص المطلوبة<input data-field="sessions" type="number" min="0" step="1" value="4" inputmode="numeric" style="display:block;width:100%;height:32px;min-height:32px;padding:4px 5px;font-size:13px;margin-top:3px"></label>
   <div style="min-width:0"><div style="font-size:11px;margin-bottom:3px">المبلغ المستحق</div><output data-out="total" style="display:flex;align-items:center;justify-content:center;min-height:32px;padding:4px 3px;background:#e8f5ee;border-radius:6px;font-weight:700;font-size:13px;text-align:center"></output></div>
   <button type="button" data-copy title="نسخ النتائج" aria-label="نسخ النتائج" style="height:32px;min-height:32px;width:100%;padding:3px 6px;font-size:12px;border-radius:6px">⧉ نسخ</button>
  </div>
  <div data-error role="status" style="color:#b42318;font-size:11px;margin-top:5px"></div>`;
  document.body.appendChild(panel);
  const field=k=>panel.querySelector('[data-field="'+k+'"]');
  const out=k=>panel.querySelector('[data-out="'+k+'"]');
  const format=n=>n.toLocaleString('fr-MA',{minimumFractionDigits:2,maximumFractionDigits:2});
  let summary='';
  function calculate(){
   const m=Number(field('monthly').value),n=Number(field('monthlySessions').value),q=Number(field('sessions').value);
   const valid=[m,n,q].every(Number.isFinite)&&m>=0&&Number.isInteger(n)&&n>0&&Number.isInteger(q)&&q>=0&&[field('monthly'),field('monthlySessions'),field('sessions')].every(x=>x.value.trim()!=='');
   panel.querySelector('[data-error]').textContent=valid?'':'أدخل مبلغاً صحيحاً وعدداً صحيحاً للحصص (حصص الشهر أكبر من صفر).';
   if(!valid){out('unit').textContent='—';out('total').textContent='—';summary='';return;}
   const unit=m/n,total=unit*q;
   out('unit').textContent=format(unit)+' د.م';
   out('total').textContent=format(total)+' د.م';
   summary='حاسبة EMCIA للحصص\nالواجب الشهري: '+format(m)+' درهم\nحصص الشهر المرجعي (28 يوماً): '+n+'\nقيمة الحصة: '+format(unit)+' درهم\nالحصص المطلوبة: '+q+'\nالمبلغ المستحق: '+format(total)+' درهم';
  }
  panel.querySelectorAll('input').forEach(x=>x.addEventListener('input',calculate));
  panel.querySelector('[data-close]').onclick=()=>panel.remove();
  panel.querySelector('[data-copy]').onclick=async()=>{
   if(!summary)return;
   try{await navigator.clipboard.writeText(summary)}
   catch(e){const t=document.createElement('textarea');t.value=summary;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();}
  };
  const handle=panel.querySelector('[data-drag]');let drag=null;
  handle.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const rect=panel.getBoundingClientRect();drag={x:e.clientX-rect.left,y:e.clientY-rect.top};handle.setPointerCapture(e.pointerId);});
  handle.addEventListener('pointermove',e=>{if(!drag)return;panel.style.left=Math.max(0,Math.min(innerWidth-panel.offsetWidth,e.clientX-drag.x))+'px';panel.style.top=Math.max(0,Math.min(innerHeight-40,e.clientY-drag.y))+'px';});
  handle.addEventListener('pointerup',()=>drag=null);handle.addEventListener('pointercancel',()=>drag=null);
  calculate();
 };
})();
</script>
<script>
/* EMCIA experimental: retain identity columns while scrolling data tables horizontally. */
(function(){
 const names=/^(المتعلم|اسم المتعلم|التلميذ|اسم التلميذ|الأستاذ|اسم الأستاذ|الفوج|اسم الفوج|المادة|المستفيد|الاسم|المصدر|الفئة|النوع|Apprenant|Élève|Enseignant|Professeur|Groupe|Matière|Bénéficiaire|Nom|Source|Catégorie|Type)$/i;
 const css=document.createElement('style');
 css.textContent=`
 .emcia-sticky-table-scroll{max-width:100%;overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch;position:relative}
 .emcia-sticky-table-scroll>table{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0}
 .emcia-sticky-identity{position:sticky!important;inset-inline-start:0!important;inset-inline-end:auto!important;z-index:2!important;background:#fff!important;box-shadow:-2px 0 4px #102a4322;min-width:105px}
 th.emcia-sticky-identity{z-index:3!important;background:#f1f5fa!important}
 @media(max-width:500px){.emcia-sticky-identity{min-width:90px;max-width:155px;overflow-wrap:anywhere}}
 `;
 document.head.appendChild(css);
 let scheduled=false;
 function update(){
  scheduled=false;
  document.querySelectorAll('main table').forEach(table=>{
   if(table.closest('#schedule,[id*="timetable"],.emcia-session-calculator,.emcia-sticky-table-scroll'))return;
   const rows=Array.from(table.rows);
   if(rows.length<2)return;
   // Find a descriptive header, including reports with a grouped title or total row.
   let header=null,index=-1;
   for(const row of rows.slice(0,4)){
    let col=0;
    for(const cell of row.cells){
     if(cell.matches('th')&&cell.colSpan===1&&names.test((cell.dataset.uiAr||cell.textContent||'').trim().replace(/\s+/g,' '))){header=row;index=col;break}
     col+=cell.colSpan;
    }
    if(header)break;
   }
   if(index<0)return;
   const wrapper=document.createElement('div');wrapper.className='emcia-sticky-table-scroll';wrapper.setAttribute('tabindex','0');wrapper.setAttribute('aria-label','جدول قابل للتمرير أفقيًا مع تثبيت عمود التعريف');
   table.parentNode.insertBefore(wrapper,table);wrapper.appendChild(table);
   rows.forEach(row=>{
    let col=0;
    for(const cell of row.cells){
     if(col===index&&cell.colSpan===1){cell.classList.add('emcia-sticky-identity');break}
     col+=cell.colSpan;
    }
   });
  });
 }
 function schedule(){if(scheduled)return;scheduled=true;requestAnimationFrame(update)}
 const observer=new MutationObserver(schedule);
 observer.observe(document.body,{childList:true,subtree:true});
 schedule();
})();
</script>

/* Screen font (print documents keep their own Arial/Tahoma stacks) */
body,#authGate{font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body{font-size:15px}
/* Micro-interactions */
button{transition:filter .15s ease,transform .08s ease,box-shadow .2s ease}
button:hover{filter:brightness(1.08)}
button:active{transform:scale(.965)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #267a94;outline-offset:1px}
.card{transition:box-shadow .2s ease,transform .2s ease}
@media(hover:hover){.card:hover{box-shadow:0 6px 18px #102a4318}}
nav button{border-radius:9px;transition:background .15s ease,transform .08s ease}
nav button:hover{background:#dde8f2}
.emcia-home-link{transition:transform .12s ease,box-shadow .2s ease}
.emcia-home-link:hover{transform:translateY(-2px);box-shadow:0 6px 14px #102a431a}
/* Dashboard: tinted KPI cards */
#daily > .grid > .card:nth-child(3n+1){background:linear-gradient(180deg,#eef7f1,#fff);border-color:#bfe0cf}
#daily > .grid > .card:nth-child(3n+2){background:linear-gradient(180deg,#eaf3f9,#fff);border-color:#bfdcec}
#daily > .grid > .card:nth-child(3n){background:linear-gradient(180deg,#fdf3ec,#fff);border-color:#f0d4b8}
#daily > .grid > .card .kpi{font-variant-numeric:tabular-nums}
/* Six-month chart: gentle hover emphasis on the bars */
div[title^="المستحقات:"],div[title^="المحصل:"]{transition:filter .15s ease,transform .15s ease;transform-origin:bottom}
div[title^="المستحقات:"]:hover,div[title^="المحصل:"]:hover{filter:brightness(1.18);transform:scaleY(1.03)}
/* Toasts */
#emcia-toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;max-width:min(92vw,480px)}
.emcia-toast{pointer-events:auto;background:#102a43;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:700;box-shadow:0 10px 30px #0004;opacity:0;transform:translateY(14px);transition:opacity .3s ease,transform .3s ease;max-width:100%;overflow-wrap:anywhere;text-align:center}
.emcia-toast.show{opacity:1;transform:translateY(0)}
.emcia-toast-success{background:#16865c}
.emcia-toast-error{background:#c0392b}
/* Network activity bar */
#emcia-netbar{position:fixed;top:0;right:0;left:0;height:3px;z-index:100001;overflow:hidden;background:transparent;opacity:0;transition:opacity .25s ease}
#emcia-netbar.on{opacity:1}
#emcia-netbar::after{content:"";display:block;height:100%;width:38%;background:linear-gradient(90deg,transparent,#2a9d8f,#267a94,transparent);animation:emciaNetSlide 1.1s linear infinite}
@keyframes emciaNetSlide{from{transform:translateX(120%)}to{transform:translateX(-320%)}}
/* Display and language preferences */
@media screen{
.emcia-display-controls{display:flex;gap:6px;justify-content:flex-end;margin:0 0 8px}
/* Keep the brand centered between two equal side columns. */
.emcia-app-header{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding:8px 12px;min-height:54px}
.emcia-app-header .emcia-display-controls{justify-content:flex-start;gap:4px;margin:0}
.emcia-header-brand{display:flex;align-items:center;gap:6px;white-space:nowrap}
.emcia-header-brand b{font-size:clamp(17px,4.5vw,23px);line-height:1}
.emcia-header-symbol{width:34px;height:34px;border-radius:8px;background:#fff url("./EMCIA_Official_Logo-1.jpg") 2.44% 50% / 301.18% auto no-repeat}
.emcia-header-meta{display:flex;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
.emcia-header-meta #emcia-release{font-size:10px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.emcia-sync-menu{position:relative;z-index:6}
.emcia-sync-menu summary{list-style:none;display:grid;place-items:center;cursor:pointer;width:26px;height:36px}
.emcia-sync-menu summary::-webkit-details-marker{display:none}
.emcia-sync-menu summary span{display:block;width:9px;height:9px;border-radius:50%;background:#879aaf}
.emcia-sync-menu [data-sync-state="ready"] span{background:#4ade80}
.emcia-sync-menu [data-sync-state="busy"] span{background:#fbbf24}
.emcia-sync-menu [data-sync-state="error"] span{background:#f87171}
#emcia-cloud-detail{position:absolute;inset-inline-end:0;top:100%;z-index:7;min-width:min(210px,70vw);max-width:70vw;padding:8px 10px;border-radius:8px;background:var(--card);color:var(--txt);border:1px solid var(--line);font-size:12px;direction:rtl;text-align:right;overflow-wrap:anywhere;box-shadow:0 5px 14px #0003}
#emcia-cloud-detail:empty{display:none}
.emcia-visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
header.emcia-app-header .emcia-display-controls>button,.emcia-app-header .emcia-language-menu summary{width:38px;min-width:38px;height:38px}
.emcia-app-header .emcia-language-options{inset-inline-start:0;inset-inline-end:auto}
@media(max-width:330px){
 .emcia-app-header{gap:4px;padding-inline:8px}
 .emcia-header-symbol{width:29px;height:29px}
 .emcia-header-meta{gap:1px}
 .emcia-sync-menu summary{width:20px}
}
header .emcia-display-controls button,#authGate .emcia-display-controls button{display:inline-flex;align-items:center;justify-content:center;width:42px;min-width:42px;height:42px;padding:0;margin:0;border:1px solid #b9c9d8;border-radius:9px;background:#edf4f9;color:#153753;font-weight:750;line-height:1}
#authGate{direction:inherit}
.emcia-language-menu{position:relative;z-index:6}
.emcia-language-menu summary{display:grid;place-items:center;width:42px;height:42px;cursor:pointer;list-style:none;border:1px solid #b9c9d8;border-radius:9px;background:#edf4f9;color:#153753}
.emcia-language-menu summary::-webkit-details-marker{display:none}
.emcia-language-options{position:absolute;inset-inline-end:0;top:calc(100% + 5px);min-width:132px;display:grid;gap:4px;padding:5px;border:1px solid var(--line);border-radius:9px;background:var(--card);box-shadow:0 5px 14px #0003}
header .emcia-language-options button,#authGate .emcia-language-options button{width:100%;justify-content:flex-start;padding-inline:10px;white-space:nowrap}
.emcia-language-options button[aria-pressed="true"]{outline:2px solid #479ac7;outline-offset:-2px}
[data-theme="dark"] .emcia-language-menu summary{background:#22374a;color:#dceaf5;border-color:var(--line)}
#authGate .emcia-login-logo{width:min(100%,200px);height:auto}
#workspace .emcia-home-hero .emcia-official-logo{width:min(100%,240px);height:auto}
#authGate .emcia-login-logo[hidden]{display:none}
html[dir="ltr"] #authGate .emcia-password-field input{text-align:left}
[data-theme="dark"]{color-scheme:dark}
[data-theme="dark"] header .emcia-display-controls button,[data-theme="dark"] #authGate .emcia-display-controls button,[data-theme="dark"] #authGate #emcia-forgot{background:#22374a!important;color:#dceaf5!important;border-color:var(--line)}
[data-theme="dark"] .emcia-display-controls .emcia-theme-toggle svg{color:#ffd98a}
[data-theme="dark"] #authGate .emcia-login-logo,[data-theme="dark"] #workspace .emcia-home-hero .emcia-official-logo{display:none}
[data-theme="dark"] #authGate .panel,[data-theme="dark"] #authGate .emcia-login-footer{border-color:var(--line)}
[data-theme="dark"] #authGate .emcia-login-brand h1{color:var(--txt)}
[data-theme="dark"] #authGate .emcia-login-brand p,[data-theme="dark"] #authGate form>label,[data-theme="dark"] #authGate .emcia-login-footer,[data-theme="dark"] #authGate .panel>small{color:var(--muted)}
[data-theme="dark"] #authGate #authEmail,[data-theme="dark"] #authGate .emcia-password-field input{background:#101c28;color:var(--txt);border-color:var(--line)}
[data-theme="dark"] #authGate .emcia-password-field .emcia-eye-button{background:#22374a!important;color:var(--txt)!important;border-color:var(--line)!important}
[data-theme="dark"] #authGate .emcia-password-field .emcia-eye-button svg{stroke:currentColor!important}
[data-theme="dark"] main .emcia-sticky-table-scroll :is(th,td).emcia-sticky-identity{background:var(--card)!important;color:var(--txt)!important}
[data-theme="dark"] main .emcia-sticky-table-scroll th.emcia-sticky-identity{background:#1e2f40!important}
/* Keep legible ink on light surfaces that retain their own background. */
[data-theme="dark"] main :is(.warn,.emcia-review-summary>div,.emcia-review-table :is(th,td):last-child,.emcia-week-grid,#emciaSchedulePopup){color:#19344e}
[data-theme="dark"] #schedule .emcia-week-grid td[onclick]{color:#19344e}
[data-theme="dark"] .emcia-review-status.pending{color:#bfd0de}
[data-theme="dark"] .emcia-review-status.changed{color:#ffc676}
[data-theme="dark"] .emcia-review-status.confirmed{color:#69d8ac}
[data-theme="dark"] main .emcia-enroll-discount,
[data-theme="dark"] main .emcia-enroll-discount :is(h4,label,.muted){color:#19344e}
[data-theme="dark"] main .emcia-enroll-discount input[readonly]{color:var(--txt)}
[data-theme="dark"] main .emcia-unified-accounts :is(th,td:nth-child(n+5)){color:#19344e}
[data-theme="dark"] main .blank-attendance{background:#fff}
[data-theme="dark"] main .blank-attendance :is(h3,th,td){color:#192b3b}
[data-theme="dark"] main .blank-attendance .emcia-sticky-table-scroll .emcia-sticky-identity{background:#f1f5fa!important;color:#192b3b!important}
.emcia-daily-date-picker{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;width:fit-content;max-width:100%;min-height:44px;margin-top:5px;padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--txt)}
.emcia-daily-date-picker time{font-weight:700;overflow-wrap:anywhere}
.emcia-daily-date-picker input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}

.emcia-daily-date-picker:focus-within{outline:2px solid #479ac7;outline-offset:2px}

<script id="emcia-ui-refresh-js">
/* EMCIA UI refresh: dark-mode toggle, toast messages, network activity bar.
   Additive only: no changes to app logic or data. */
(function(){
"use strict";
if(window.__emciaUiRefresh)return;window.__emciaUiRefresh=true;
var root=document.documentElement;
/* ---- Theme (dark mode) ---- */
function storedTheme(){try{return localStorage.getItem("emcia_theme")||""}catch(e){return""}}
var MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';
var SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function applyTheme(theme){
 root.dataset.theme=theme;
 const dark=theme==="dark";
 document.querySelectorAll("[data-toggle-theme]").forEach(button=>{
  button.innerHTML=dark?SUN:MOON;
  const labels={ar:["التبديل إلى الوضع الليلي","التبديل إلى الوضع النهاري"],fr:["Passer au mode sombre","Passer au mode clair"],en:["Switch to dark mode","Switch to light mode"]};
  const label=labels[root.lang][Number(dark)];
  button.setAttribute("aria-label",label);
  button.title=label;
 });
}
const loginEnglish={
 "مرحبًا بكم في EMCIA": "Welcome to EMCIA",
 "نظام تدبير المؤسسة": "Institution management system",
 "البريد الإلكتروني": "Email",
 "كلمة المرور": "Password",
 "دخول إلى الحساب": "Sign in",
 "نسيت كلمة المرور؟": "Forgot your password?",
 "أدخل بريد الحساب لإرسال رابط إعادة التعيين. افتح الرابط من البريد ثم اختر كلمة مرور جديدة.": "Enter your account email to receive a password reset link.",
 "إرسال رابط الاستعادة": "Send reset link",
 "اختر كلمة مرور جديدة (8 أحرف على الأقل).": "Choose a new password (at least 8 characters).",
 "كلمة المرور الجديدة": "New password",
 "تأكيد كلمة المرور": "Confirm password",
 "حفظ كلمة المرور الجديدة": "Save new password",
 "الموسم الدراسي 2026–2027": "School year 2026–2027",
 "البيانات محفوظة بأمان في النظام السحابي للمؤسسة.": "Data is stored in the institution’s cloud system."
};
function syncDisplayLanguage(){
 const language=root.lang;
 const labels={ar:"اللغة",fr:"Langue",en:"Language"};
 const syncLabels={ar:"حالة الاتصال والمزامنة",fr:"État de la connexion et de la synchronisation",en:"Connection and sync status"};
 document.getElementById("emcia-sync-indicator").setAttribute("aria-label",syncLabels[language]);
 document.querySelectorAll("[data-language-summary]").forEach(summary=>{
  summary.setAttribute("aria-label",labels[language]);
  summary.title=labels[language];
 });
 document.querySelectorAll("[data-language]").forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.language===language)));
 document.querySelectorAll("#authGate [data-fr],#authGate [data-fr-placeholder]").forEach(element=>{
  const attribute=element.hasAttribute("data-fr-placeholder");
  element.dataset.loginAr??=attribute?element.placeholder:element.textContent;
  const original=element.dataset.loginAr;
  const text=language==="fr"?(attribute?element.dataset.frPlaceholder:element.dataset.fr):language==="en"?(loginEnglish[original]||original):original;
  if(attribute)element.placeholder=text;else element.textContent=text;
 });
 applyTheme(root.dataset.theme==="dark"?"dark":"light");
}
window.emciaSyncDisplayLanguage=syncDisplayLanguage;
try{
 const stored=localStorage.getItem("emcia_lang");
 root.lang=stored==="fr"||stored==="en"?stored:"ar";
}catch(e){}
root.dir=root.lang==="ar"?"rtl":"ltr";
root.dataset.theme=storedTheme()==="dark"?"dark":"light";
syncDisplayLanguage();
document.querySelectorAll("[data-toggle-theme]").forEach(button=>button.addEventListener("click",()=>{
 const next=root.dataset.theme==="dark"?"light":"dark";
 try{localStorage.setItem("emcia_theme",next)}catch(e){}
 applyTheme(next);
}));
document.querySelectorAll(".emcia-language-menu").forEach(menu=>{
 const summary=menu.querySelector("summary");
 menu.addEventListener("click",event=>{
  const button=event.target.closest("[data-language]");
  if(!button)return;
  const next=button.dataset.language;
  menu.open=false;
  summary.focus();
  if(typeof window.setLang==="function"){window.setLang(next);return}
  try{localStorage.setItem("emcia_lang",next)}catch(e){}
  root.lang=next;
  root.dir=next==="ar"?"rtl":"ltr";
  syncDisplayLanguage();
 });
 menu.addEventListener("keydown",event=>{
  if(event.key==="Escape"&&menu.open){menu.open=false;summary.focus()}
 });
 document.addEventListener("pointerdown",event=>{
  if(menu.open&&!menu.contains(event.target))menu.open=false;
 });
});
/* ---- Toasts (replace native alert) ---- */
function toastBox(){var c=document.getElementById("emcia-toasts");if(!c){c=document.createElement("div");c.id="emcia-toasts";c.setAttribute("aria-live","polite");document.body.appendChild(c)}return c}
window.emciaToast=function(msg,type,stayOpen){
 /* Skip DOM toasts in headless test DOMs (jsdom): they only trigger observers there. */
 if(/jsdom/i.test((window.navigator&&window.navigator.userAgent)||""))return;
 try{
  var box=toastBox();var t=document.createElement("div");
  t.className="emcia-toast emcia-toast-"+(type==="error"?"error":type==="success"?"success":"info");
  t.textContent=msg;box.appendChild(t);
  void t.offsetWidth; /* reflow so the entry transition runs without requestAnimationFrame */
  t.classList.add("show");
  if(!stayOpen)setTimeout(function(){t.classList.remove("show");setTimeout(function(){t.remove()},350)},type==="error"?6000:3800);
 }catch(e){}
};
var prevAlert=window.alert;
function isNative(fn){try{return /\[native code\]/.test(Function.prototype.toString.call(fn))}catch(e){return false}}
window.alert=function(m){
 var s=String(m);
 /* Chain to a previously installed custom handler (test harnesses, embedders);
    replace only the browser's native dialog with the toast. */
 if(prevAlert&&!isNative(prevAlert)){try{prevAlert(s)}catch(e){}}
 if(document.body){window.emciaToast(s,"info")}
};
/* ---- Test-environment hardening: drop RAF callbacks scheduled after window teardown.
   (jsdom crashes internally if RAF fires on a destroyed window; browsers never throw here.) ---- */
if(window.requestAnimationFrame){
 var origRAF=window.requestAnimationFrame.bind(window);
 window.requestAnimationFrame=function(cb){
  try{void window.location.href}catch(e){return 0}
  return origRAF(cb);
 };
}
/* ---- Network activity bar (shows while cloud requests run) ---- */
var pending=0,bar=null;
function barEl(){if(!bar){bar=document.createElement("div");bar.id="emcia-netbar";bar.setAttribute("aria-hidden","true");document.body.appendChild(bar)}return bar}
function paintBar(){var b=barEl();b.classList.toggle("on",pending>0)}
if(window.fetch){
 var nativeFetch=window.fetch.bind(window);
 window.fetch=function(){
  pending++;paintBar();
  return nativeFetch.apply(null,arguments).finally(function(){pending=Math.max(0,pending-1);paintBar()});
 };
}
})();
</script>
