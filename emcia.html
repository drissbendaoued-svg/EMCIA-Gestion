<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMCIA Gestion</title>
<meta name="emcia-release" content="2026.11.17.2">
<meta name="application-name" content="EMCIA Gestion">
<meta name="apple-mobile-web-app-title" content="EMCIA Gestion">
<style>
:root{--nav:#102a43;--bg:#f4f7fb;--card:#fff;--line:#d9e2ec;--txt:#102a43;--muted:#627d98;--ok:#16865c;--bad:#c0392b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt)}
header{background:var(--nav);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
header b{font-size:20px} header small{display:block;opacity:.8}
nav{display:flex;gap:7px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:66px;z-index:4}
nav button{white-space:nowrap;background:#eef3f8;color:var(--txt)}
main{max-width:1050px;margin:auto;padding:12px}.page{display:none}.page.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #102a4310}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
/* Daily operations: three complete title/value cards per row, including on phones. */
#daily > .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#daily > .grid > .card{min-width:0;margin:0;padding:10px 6px;text-align:center;overflow-wrap:anywhere}
#daily > .grid > .card .muted{font-size:12px;line-height:1.4}
#daily > .grid > .card .kpi{font-size:clamp(18px,3.8vw,24px);line-height:1.3}
@media(max-width:600px){#daily > .grid{gap:5px}#daily > .grid > .card{padding:9px 4px}#daily > .grid > .card .muted{font-size:11px}}.kpi{font-size:24px;font-weight:800}.muted{color:var(--muted);font-size:13px}
label{font-size:13px;color:var(--muted)}input,select,textarea,button{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;margin:4px 0 8px}
button{border:0;background:var(--nav);color:#fff;font-weight:700;cursor:pointer}.secondary{background:#627d98}.danger{background:var(--bad)}.ok{background:var(--ok)}
#regularPaymentBox{grid-column:1/-1;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:end;min-width:0}
#regularPaymentBox>div{min-width:0}
#regularPaymentBox input,#regularPaymentBox select{min-width:0;max-width:100%}
#pSettlement,#pcompWrap,#paymentReceiptHelp,#paymentSubmit{grid-column:1/-1;min-width:0}
#paymentReceiptHelp{font-size:13px;color:var(--muted)}
#paymentReceiptHelp summary{cursor:pointer}
@media(min-width:800px){#regularPaymentBox{grid-template-columns:repeat(3,minmax(0,1fr))}}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;align-items:end}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:right;vertical-align:top}th{background:#f7f9fc}
.actions{display:flex;gap:5px}.actions button{width:auto;padding:6px 9px;margin:0}.badge{padding:3px 7px;border-radius:20px;background:#eaf2f8;display:inline-block}
.warn{background:#fff5df;border:1px solid #f1c40f;padding:10px;border-radius:10px}.hidden{display:none}
progress{width:100%;height:16px}.ltr{direction:ltr;text-align:left}
@media(max-width:600px){nav{top:64px}th,td{padding:6px;font-size:12px}.actions{flex-direction:column}.actions button{width:100%}}

@media print{
 body *{visibility:hidden!important}
 #rcPreview,#rcPreview *{visibility:visible!important}
 #rcPreview{display:block!important;position:absolute!important;left:0;top:0;width:100%;margin:0!important;padding:0!important;border:0!important;box-shadow:none!important;background:#fff!important;color:#000!important}
 #rcPreview .rc-actions{display:none!important} #rcPreview .rc-paper{padding:18px!important;font-family:Arial,Tahoma,sans-serif!important}
 #rcPreview h1,#rcPreview h2{text-align:center!important;color:#000!important}
 #rcPreview table{width:100%!important;border-collapse:collapse!important}
 #rcPreview th,#rcPreview td{border:1px solid #777!important;padding:6px!important;color:#000!important;background:#fff!important}
}

/* V5.7.1 navigation corrections */
#nav{display:flex;gap:8px;align-items:flex-start;padding:10px;overflow:visible}
.main-nav{width:165px;flex:0 0 165px;display:flex;flex-direction:column;gap:7px}
.main-nav button{width:100%;min-height:42px;text-align:right;white-space:normal;font-weight:700}
.main-nav button.active-cat{outline:2px solid currentColor}
.subnav-wrap{flex:1;min-width:0}
.subnav-title{font-weight:800;margin:2px 0 7px}
.subnav{display:flex;flex-wrap:wrap;gap:6px;overflow:visible}
.subnav button{flex:1 1 125px;min-width:0;white-space:normal;line-height:1.2;padding:7px 6px}
body.reception-mode #nav{display:none}
body.reception-mode main{width:100%;max-width:none;margin:0;padding:0}
body.reception-mode #home{min-height:calc(100vh - 60px);width:100%}
body.reception-mode #home .welcome-card{min-height:calc(100vh - 95px);margin:0;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
body.reception-mode #home .dashboard-after-welcome{display:none}
.welcome-card{text-align:center;padding:28px 16px}
.welcome-logo{width:100px;height:100px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;border:2px solid currentColor}
.welcome-name{font-size:1.5rem;font-weight:900;margin:8px 0}
.welcome-season{font-size:1.1rem;font-weight:700;margin-top:8px}
.welcome-enter{margin-top:24px;min-width:180px}
@media(max-width:650px){
 #nav{gap:7px;padding:8px}
 .main-nav{width:128px;flex-basis:128px}
 .main-nav button{font-size:.80rem;padding:7px 5px}
 .subnav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
 .subnav button{width:100%;font-size:.80rem;padding:7px 4px}
}

/* V5.7.2: section content directly under its sub-navigation */
#appWorkspace{display:grid;grid-template-columns:165px minmax(0,1fr);grid-template-rows:auto 1fr;gap:0 8px;align-items:start}
#nav{display:contents}
#nav .main-nav{grid-column:1;grid-row:1 / span 2;width:auto;min-width:0;padding:10px 0 10px 10px}
#nav .subnav-wrap{grid-column:2;grid-row:1;padding:10px 10px 0 0;min-width:0}
#appWorkspace main{grid-column:2;grid-row:2;min-width:0;margin:0;padding:0 10px 10px 0}
#appWorkspace main .page.active{margin-top:0}
body.reception-mode #appWorkspace{display:block}
body.reception-mode #nav{display:none}
body.reception-mode #appWorkspace main{width:100%;max-width:none;margin:0;padding:0}
@media(max-width:650px){
 #appWorkspace{grid-template-columns:128px minmax(0,1fr);gap:0 7px}
 #nav .main-nav{padding-left:8px}
 #nav .subnav-wrap{padding:8px 8px 0 0}
 #appWorkspace main{padding:0 8px 8px 0}
}

/* V5.7.3 mobile collapsible navigation */
#mobileNavToggle{display:none}
body.reception-mode #mobileNavToggle{display:none!important}
@media(max-width:650px){
 #mobileNavToggle{display:block;position:sticky;top:0;z-index:50;margin:6px 8px;padding:8px 12px}
 body.mobile-nav-collapsed #appWorkspace{grid-template-columns:1fr}
 body.mobile-nav-collapsed #nav .main-nav{display:none}
 body.mobile-nav-collapsed #nav .subnav-wrap{grid-column:1;grid-row:1;padding:8px}
 body.mobile-nav-collapsed #appWorkspace main{grid-column:1;grid-row:2;padding:0 8px 8px}
 body:not(.mobile-nav-collapsed) #appWorkspace{grid-template-columns:128px minmax(0,1fr)}
}

/* V5.7.4 language-aware direction */
html[dir="rtl"] body{text-align:right}
html[dir="ltr"] body{text-align:left}
html[dir="rtl"] #appWorkspace{direction:rtl}
html[dir="ltr"] #appWorkspace{direction:ltr}
html[dir="rtl"] #nav .main-nav{grid-column:1;padding:10px 10px 10px 0}
html[dir="rtl"] #nav .subnav-wrap{grid-column:2;padding:10px 0 0 10px}
html[dir="rtl"] #appWorkspace main{grid-column:2;padding:0 0 10px 10px}
html[dir="ltr"] #nav .main-nav{grid-column:1;padding:10px 0 10px 10px}
html[dir="ltr"] #nav .subnav-wrap{grid-column:2;padding:10px 10px 0 0}
html[dir="ltr"] #appWorkspace main{grid-column:2;padding:0 10px 10px 0}
html[dir="rtl"] .main-nav button{text-align:right}
html[dir="ltr"] .main-nav button{text-align:left}
html[dir="rtl"] #mobileNavToggle{margin-left:auto;margin-right:8px}
html[dir="ltr"] #mobileNavToggle{margin-right:auto;margin-left:8px}
@media(max-width:650px){
 html[dir="rtl"] #nav .main-nav{padding:8px 8px 8px 0}
 html[dir="rtl"] #nav .subnav-wrap{padding:8px 0 0 8px}
 html[dir="rtl"] #appWorkspace main{padding:0 0 8px 8px}
 html[dir="ltr"] #nav .main-nav{padding:8px 0 8px 8px}
 html[dir="ltr"] #nav .subnav-wrap{padding:8px 8px 0 0}
 html[dir="ltr"] #appWorkspace main{padding:0 8px 8px 0}
 body.mobile-nav-collapsed #nav .subnav-wrap,
 body.mobile-nav-collapsed #appWorkspace main{grid-column:1}
}

/* V5.7.6 — compact mobile dropdown menu */
@media(max-width:650px){
 #mobileNavToggle{
   display:block!important;
   position:relative!important;
   width:auto!important;
   min-width:108px!important;
   margin:7px 8px 7px auto!important;
   padding:8px 12px!important;
   z-index:2100!important;
 }
 html[dir="rtl"] #mobileNavToggle{margin-left:auto!important;margin-right:8px!important}
 html[dir="ltr"] #mobileNavToggle{margin-right:auto!important;margin-left:8px!important}

 #appWorkspace{display:block!important;width:100%!important}
 #nav{display:block!important;width:100%!important;padding:0!important}
 #nav .subnav-wrap{display:block!important;width:100%!important;padding:8px!important;box-sizing:border-box}
 #appWorkspace main{display:block!important;width:100%!important;padding:0 8px 8px!important;box-sizing:border-box}

 #nav .main-nav{
   display:none!important;
   position:absolute!important;
   top:auto!important;
   width:min(76vw,280px)!important;
   height:auto!important;
   max-height:70vh!important;
   overflow-y:auto!important;
   z-index:2000!important;
   padding:7px!important;
   background:#f4f7fb!important;
   border:1px solid #d7e0e8!important;
   border-radius:12px!important;
   box-shadow:0 8px 22px rgba(0,0,0,.22)!important;
 }
 html[dir="rtl"] #nav .main-nav{right:8px!important;left:auto!important}
 html[dir="ltr"] #nav .main-nav{left:8px!important;right:auto!important}
 body.mobile-menu-open #nav .main-nav{display:flex!important}

 body.mobile-nav-collapsed #nav .main-nav{display:none!important}
 body.mobile-nav-collapsed #nav .subnav-wrap,
 body.mobile-nav-collapsed #appWorkspace main{width:100%!important}
}



/* Compact report action buttons */
#reportcenter .rc-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#reportcenter .rc-actions button{width:auto!important;min-width:88px;min-height:44px;padding:9px 14px!important;font-size:16px!important;flex:0 0 auto!important}

/* V5.9.8 — report actions: one compact row */
#reportcenter .rc-actions{
  display:flex!important;
  flex-wrap:nowrap!important;
  gap:6px!important;
  align-items:center!important;
  justify-content:center!important;
  width:100%!important;
}
#reportcenter .rc-actions button{
  flex:1 1 0!important;
  width:0!important;
  min-width:0!important;
  min-height:40px!important;
  padding:7px 5px!important;
  margin:0!important;
  font-size:14px!important;
  white-space:nowrap!important;
}
@media(max-width:650px){
  #reportcenter .rc-actions{gap:5px!important}
  #reportcenter .rc-actions button{
    min-height:38px!important;
    padding:6px 3px!important;
    font-size:13px!important;
  }
}

/* V5.9.9 — actual report buttons: exactly one row */
#reportcenter .report-action-row{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:5px!important;width:100%!important}
#reportcenter .report-action-row button{width:100%!important;min-width:0!important;min-height:36px!important;padding:5px 1px!important;margin:0!important;font-size:12px!important;line-height:1.1!important;white-space:nowrap!important}

/* V5.10.0 — compact sub-navigation on phones: 3 per row */
@media(max-width:650px){
 .subnav{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:5px!important}
 .subnav button{width:100%!important;min-width:0!important;padding:6px 3px!important;font-size:.72rem!important;line-height:1.15!important}
}

/* V5.10.1 — clear active navigation state */
.main-nav button.active-cat{
 transform:scale(1.035);
 box-shadow:0 0 0 2px rgba(255,255,255,.72),0 0 12px rgba(255,255,255,.32);
 font-weight:700!important;
}
.subnav button.active-sub{
 transform:scale(1.035);
 box-shadow:0 0 0 2px #2563eb,0 0 10px rgba(37,99,235,.28);
 font-weight:700!important;
 position:relative;
 z-index:1;
}
@media(max-width:650px){
 .main-nav button.active-cat,.subnav button.active-sub{transform:scale(1.025)}
}

/* V5.11.3 — enrollment selector layout and immediate success feedback */
#enroll .enroll-select-row{align-items:center}
#enroll .show-all-learners{display:flex;align-items:center;gap:6px;margin-inline-start:auto;white-space:nowrap}
#enroll .enroll-success{margin:8px 0;padding:8px 12px;border-radius:8px;font-weight:700;text-align:center;background:#ecfdf5;border:1px solid #86efac}
@media(max-width:650px){
 #enroll .enroll-select-row{display:grid!important;grid-template-columns:1fr 1fr!important;gap:6px!important}
 #enroll .show-all-learners{margin-inline-start:0;justify-self:start}
 #enroll #esearch{width:100%!important}
}

/* Budget: all eight indicators on one horizontally scrollable line. */
#budget .budget-kpi-strip{display:flex!important;flex-wrap:nowrap!important;overflow-x:auto!important;gap:7px!important;width:100%;padding-bottom:8px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
#budget .budget-kpi-strip>.card{flex:0 0 auto!important;width:max-content!important;min-width:112px!important;max-width:220px;margin:0!important;padding:10px 12px!important;text-align:center;white-space:normal}
#budget .budget-kpi-strip>.card>.muted{font-size:clamp(10px,2.4vw,12px);line-height:1.35;min-height:2.7em}
#budget .budget-kpi-strip>.card>.kpi{font-size:clamp(14px,3.2vw,20px);white-space:nowrap;font-variant-numeric:tabular-nums}

/* Compact financial analysis and arrears KPI strips. */
#analysis .analysis-kpi-strip,#arrears .arrears-kpi-strip{display:flex!important;flex-wrap:nowrap!important;overflow-x:auto!important;gap:7px!important;width:100%;padding-bottom:8px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
#analysis .analysis-kpi-strip>.card,#arrears .arrears-kpi-strip>.card{flex:0 0 auto!important;width:max-content!important;min-width:112px!important;max-width:220px!important;margin:0!important;padding:10px 12px!important;text-align:center;white-space:normal}
#analysis .analysis-kpi-strip>.card>.muted,#arrears .arrears-kpi-strip>.card>.muted{font-size:clamp(10px,2.4vw,12px);line-height:1.35;min-height:2.7em}
#analysis .analysis-kpi-strip>.card>.kpi,#arrears .arrears-kpi-strip>.card>.kpi{font-size:clamp(14px,3.2vw,20px);white-space:nowrap;font-variant-numeric:tabular-nums}
/* KPI overview without horizontal scrolling: compact, responsive, full-width grids. */
#budget .budget-kpi-strip,#analysis .analysis-kpi-strip,#arrears .arrears-kpi-strip{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;overflow:visible!important;flex-wrap:wrap!important;gap:7px!important;width:100%!important;padding-bottom:0!important}
#budget .budget-kpi-strip>.card,#analysis .analysis-kpi-strip>.card,#arrears .arrears-kpi-strip>.card{width:auto!important;min-width:0!important;max-width:none!important;flex:initial!important;margin:0!important;padding:9px 4px!important;text-align:center!important;overflow-wrap:anywhere!important;white-space:normal!important}
#budget .budget-kpi-strip>.card>.muted,#analysis .analysis-kpi-strip>.card>.muted,#arrears .arrears-kpi-strip>.card>.muted{font-size:clamp(10px,2.6vw,13px)!important;line-height:1.3!important;min-height:0!important}
#budget .budget-kpi-strip>.card>.kpi,#analysis .analysis-kpi-strip>.card>.kpi,#arrears .arrears-kpi-strip>.card>.kpi{font-size:clamp(12px,3.3vw,20px)!important;line-height:1.35!important;white-space:normal!important;overflow-wrap:anywhere!important;font-variant-numeric:tabular-nums}
@media(min-width:650px){#budget .budget-kpi-strip{grid-template-columns:repeat(4,minmax(0,1fr))!important}}


/* EMCIA V26 — phone-sized table viewing without shrinking data columns */
@media screen and (max-width:650px){
 #groups .card:has(table),#arrears .card:has(table),#reportcenter .card:has(table),#students .card:has(table){
  max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
 }
 #groups .card table,#arrears .card table,#reportcenter .card table,#students .card table{
  width:max-content;min-width:100%;font-size:12px;
 }
 #groups .card th,#groups .card td,#arrears .card th,#arrears .card td,#reportcenter .card th,#reportcenter .card td,#students .card th,#students .card td{
  padding:8px 9px;overflow-wrap:normal;white-space:normal;min-width:70px;
 }
 #groups .card .actions button,#arrears .card .actions button{min-height:38px}
}
@media print{
 #groups .card:has(table),#arrears .card:has(table),#reportcenter .card:has(table),#students .card:has(table){overflow:visible!important}
}

/* EMCIA V27 — visible compact navigation on desktop, balanced account control */
@media screen and (min-width:651px){
 body:not(.reception-mode) #emcia-top-controls #mobileNavToggle{
  display:inline-flex!important;flex:0 0 auto!important;width:auto!important;
  min-width:108px!important;max-width:150px!important;min-height:40px!important;
  align-items:center;justify-content:center;padding:8px 12px!important;
 }
 #emcia-top-controls{justify-content:space-between!important;align-items:center!important;gap:12px!important}
 #emcia-top-controls #emcia-account-menu{flex:0 0 auto!important;width:auto!important;max-width:210px!important;min-width:0!important}
 #emcia-top-controls #emcia-account-menu>button{width:auto!important;max-width:210px!important;min-height:40px!important;padding:8px 12px!important;font-size:14px!important;white-space:nowrap!important}
}

/* EMCIA V109 — semantic non-selectable subject category headings */
#teacherSubjectSelect optgroup,#studentSubjectSelect optgroup{font-weight:700;color:#6b7280;font-style:normal}
#teacherSubjectSelect option,#studentSubjectSelect option{font-weight:400;color:inherit}

/* EMCIA V110 — accessible password visibility control */
#authGate .emcia-password-field{position:relative;display:flex;align-items:center;width:100%;margin:5px 0 12px}
#authGate .emcia-password-field input{width:100%;padding-left:52px;margin:0;direction:ltr;text-align:right}
#authGate .emcia-password-field button{position:absolute;left:5px;top:50%;transform:translateY(-50%);width:42px!important;height:42px!important;min-height:42px!important;padding:0!important;margin:0!important;display:flex;align-items:center;justify-content:center;background:transparent!important;color:#506b82!important;border:0!important;box-shadow:none!important;cursor:pointer}
#authGate .emcia-password-field button:focus-visible{outline:2px solid #2563eb!important;border-radius:7px}

.emcia-eye-wrap{display:block;position:relative;width:100%}
.emcia-eye-wrap>input{width:100%!important;padding-left:48px!important;box-sizing:border-box}
.emcia-eye-wrap>.emcia-eye-button{position:absolute!important;left:4px!important;top:50%!important;transform:translateY(-50%)!important;width:40px!important;height:40px!important;min-height:40px!important;padding:0!important;margin:0!important;display:flex!important;align-items:center!important;justify-content:center!important;background:transparent!important;color:#506b82!important;border:0!important;box-shadow:none!important;z-index:2}

/* EMCIA V113 — ensure the login eye stays visible above the input on phones */
#authGate .emcia-password-field .emcia-eye-wrap{display:block!important;position:relative!important;overflow:visible!important;width:100%!important}
#authGate .emcia-password-field .emcia-eye-wrap>.emcia-eye-button{display:flex!important;visibility:visible!important;opacity:1!important;position:absolute!important;left:5px!important;right:auto!important;top:50%!important;transform:translateY(-50%)!important;width:42px!important;height:42px!important;min-width:42px!important;min-height:42px!important;z-index:50!important;background:#eef3f8!important;color:#102a43!important;border:1px solid #d9e2ec!important;border-radius:8px!important;pointer-events:auto!important}
#authGate .emcia-password-field .emcia-eye-wrap>.emcia-eye-button svg{display:block!important;width:22px!important;height:22px!important;stroke:#102a43!important;visibility:visible!important}
#authGate .emcia-password-field .emcia-eye-wrap>input{padding-left:55px!important}

/* EMCIA student registration — grouped non-selectable level headings */
#studentRequestLevel optgroup{color:#6b7280;font-weight:700;font-style:normal}
#studentRequestLevel option{color:#102a43;font-weight:400}

/* Compact three-column income entry, including narrow phones. */
.oi-compact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:8px 0;align-items:end}.oi-compact-grid>div{min-width:0}.oi-compact-grid label{display:block;font-size:12px;margin:0 0 4px}.oi-compact-grid input,.oi-compact-grid select{width:100%;min-width:0;max-width:100%;padding:8px 5px;font-size:clamp(11px,2.7vw,14px);height:39px}.oi-compact-grid .oi-action button{width:100%;min-width:0;padding:8px 3px;font-size:clamp(10px,2.5vw,13px);min-height:39px;white-space:normal}

/* Waiting cohorts: contact-first cards fit narrow phones. */

 "المستحق حسب شهر الدراسة، والمخصص له من الأداءات حتى تاريخ الكشف. المقبوض حسب تاريخ الأداء ويُحتسب مرة واحدة. الرصيد المسبق لا يمحو ديناً في فوج آخر. حصة الأستاذ والمؤسسة عن الأداء الشهري تُنسب لشهر الاستحقاق المحفوظ، وعن الحصص تُثبت بعد إنجاز الحصة وتحصيل مقابلها.": "Le dû est calculé selon le mois de scolarité, avec la part des paiements allouée jusqu’à la date du relevé. L’encaissé suit la date de paiement et n’est compté qu’une fois. Le solde prépayé n’efface pas une dette dans un autre groupe. La part de l’enseignant et de l’établissement pour un paiement mensuel est rattachée au mois d’échéance enregistré ; pour les séances, elle est confirmée après la tenue de la séance et l’encaissement de sa contrepartie.",

 "المصاريف التشغيلية حسب شهر تسجيل المصروف؛ مستحقات الأساتذة محسوبة عن شهر الاستحقاق وتشمل حصص المتأخرات المقبوضة فيه. عدد المتعلمين دون تكرار داخل أفواج الأستاذ، وقد يظهر المتعلم لدى أكثر من أستاذ. مجموع الأفواج هو مجموع أفواج الأساتذة، وليس بالضرورة عدد الأفواج الفريدة بالمؤسسة. لا تُضاف مستحقات الأساتذة إلى المصاريف التشغيلية أعلاه حتى لا يحدث احتساب مزدوج.": "Les dépenses d’exploitation suivent le mois d’enregistrement de la dépense ; les rémunérations des enseignants sont calculées sur le mois d’échéance et incluent les parts d’arriérés encaissés durant celui-ci. Le nombre d’apprenants est compté sans doublon au sein des groupes de l’enseignant, mais un même apprenant peut apparaître chez plusieurs enseignants. Le total des groupes est la somme des groupes des enseignants, pas nécessairement le nombre de groupes distincts de l’établissement. Les rémunérations des enseignants ne sont pas ajoutées aux dépenses d’exploitation ci-dessus afin d’éviter un double comptage.",

 "المستحق حسب شهر الدراسة، والمخصص له من الأداءات حتى تاريخ الكشف. المقبوض حسب تاريخ الأداء ويُحتسب مرة واحدة. الرصيد المسبق لا يمحو ديناً في فوج آخر. حصة الأستاذ والمؤسسة عن الأداء الشهري تُنسب لشهر الاستحقاق المحفوظ، وعن الحصص تُثبت بعد إنجاز الحصة وتحصيل مقابلها.": "The due is computed by tuition month, with the allocated share of payments up to the statement date. The collected amount follows the payment date and is counted once. A prepaid balance does not clear a debt in another group. The teacher's and institution's shares of a monthly payment are attached to its recorded due month; for sessions, the share is confirmed after the session takes place and is collected.",
 "المستحقات عن الشهر": "Dues for the month",
 "المصاريف التشغيلية حسب شهر تسجيل المصروف؛ مستحقات الأساتذة محسوبة عن شهر الاستحقاق وتشمل حصص المتأخرات المقبوضة فيه. عدد المتعلمين دون تكرار داخل أفواج الأستاذ، وقد يظهر المتعلم لدى أكثر من أستاذ. مجموع الأفواج هو مجموع أفواج الأساتذة، وليس بالضرورة عدد الأفواج الفريدة بالمؤسسة. لا تُضاف مستحقات الأساتذة إلى المصاريف التشغيلية أعلاه حتى لا يحدث احتساب مزدوج.": "Operating expenses follow the month the expense was recorded; teacher dues are computed on the due month and include shares of arrears collected within it. Learners are counted once within a teacher's groups, but the same learner may appear under more than one teacher. The group total sums teachers' groups and is not necessarily the number of distinct groups in the institution. Teacher dues are not added to the operating expenses above, to avoid double counting.",

 "المصاريف المتغيرة": "Variable expenses",
 "مجموع المصاريف الثابتة": "Total fixed expenses",

 "المقبوضات حسب تاريخ التحصيل، والمخصص للدراسة حسب شهر الاستحقاق الأصلي. تُحتسب حصة الأستاذ عن شهر الدراسة من الأداءات المخصصة له، ولو قُبضت في شهر سابق، دون احتسابها مرتين.": "Collections follow the collection date, and the share allocated to tuition follows the original due month. The teacher's share for a tuition month is computed from the payments allocated to it, even if collected a month earlier, without being counted twice.",

 "تظهر افتراضياً أسماء المتعلمين الذين اختاروا مادة الفوج أثناء التسجيل. فعّل «إظهار جميع المتعلمين» لعرض بقية الأسماء، ويمكنك كتابة بداية الاسم أو الهاتف لتصفية القائمة.": "By default, only learners who chose the group's subject during enrollment are shown. Enable \"Show all learners\" to see the rest, or type the start of a name or a phone number to filter the list.",

 "شهر واحد": "One month",
 "التخفيض لا يغيّر ثمن الفوج. في النظام الشهري يُطبّق شهرياً، وفي نظام الحصص يُحدد لكل حصة. يُوزّع أثره حسب الجهة التي تتحمله، ويبدأ احتسابه المالي مع تفعيل سجل الحصص في المرحلة المقبلة.": "The discount does not change the group's price. In monthly mode it applies monthly; in session mode it is set per session. Its effect is split according to who bears it, and its financial counting starts when the session register is activated in the next stage.",
 "سجل مستقل للمبالغ المقبوضة فعلياً. تظهر المقبوضات في التقارير والصندوق، وتُوزّع حصص الأستاذ والمؤسسة بعد إنجاز الحصة وتحصيل مقابلها. المبلغ المسبق يبقى رصيداً للمتعلم.": "An independent record of amounts actually collected. Collections appear in reports and the cash box, and the teacher's and institution's shares are distributed after the session is delivered and paid. Any advance remains a credit for the learner.",
 "شهر دخول المال إلى الميزانية يُستخرج تلقائياً من تاريخ الأداء الفعلي. شهر الاستحقاق = الشهر الذي يغطيه الأداء. التخفيض النشط لذلك الشهر يُحتسب تلقائياً عند توزيع حصة الأستاذ والمؤسسة.": "The month money enters the budget is derived automatically from the actual payment date. Due month = the month the payment covers. That month's active discount is calculated automatically when splitting the teacher's and institution's shares.",
 "العهدة الثابتة للمؤسسة هي ": "The institution's fixed float is ",
 "، وهي ليست مدخولاً. تحتسب في حركة الصندوق الأداءات النقدية فقط.": " and is not income. Only cash payments count in cash movements.",

 "نقص في الصندوق": "Cash shortage",
 "ملاحظة:": "Note:",
 "المستحق المحسوب يشمل حصص أداءات شهر الدراسة وحصص المتأخرات المقبوضة خلال الشهر. راجع التسويات السابقة لتفادي الصرف المكرر. لا يعتبر مؤدى للأستاذ إلا بعد تسجيل الاستلام فعلياً.": "The calculated due includes shares of the school month's payments and shares of arrears collected during the month. Review previous settlements to avoid duplicate payouts. It is only considered paid to the teacher once the handover is actually recorded.",
 "الغياب لا يخفض الواجب تلقائياً. تستعمل هذه التسوية فقط بعد قبول الإدارة لسبب التوقف. الحساب يعتمد شهراً مالياً من 28 يوماً، والقرار النهائي للمدة المعتمدة يبقى للإدارة.": "Absence does not lower the fee automatically. This adjustment is used only after the administration accepts the reason for stopping. The calculation uses a 28-day financial month, and the final decision on the approved period rests with the administration.",
 "سجّل رسوم التسجيل والتأمين والكتب والنسخ هنا منفصلة عن واجبات الدراسة، حتى لا تدخل في مستحقات الأستاذ. مبالغ التأمين المحصلة تُتابع على حدة إلى حين تسويتها مع الجهة المعنية، ولا تُعد ربحاً صافياً تلقائياً. اذكر اسم المتعلم ورقم التوصيل في الملاحظة.": "Record registration, insurance, book and copy fees here, separate from tuition, so they do not count toward the teacher's dues. Collected insurance amounts are tracked separately until settled with the concerned party and are not automatically counted as net profit. Mention the learner's name and receipt number in the note.",

 "الأشهر مرتبة من الأقدم يساراً إلى الأحدث يميناً. النسبة أسفل كل شهر = المحصل ÷ المستحقات × 100؛ والشرطة تعني عدم وجود مستحقات. المبالغ منسوبة إلى شهر الاستحقاق؛ التدريس بالحصة حسب شهر إنجازها، دون احتساب الرصيد المسبق تحصيلاً للحصص.": "Months are ordered oldest on the left to newest on the right. The rate under each month = collected ÷ dues × 100; a dash means there are no dues. Amounts are attributed to the due month; per-session teaching is attributed to the month sessions were delivered, without counting advance balance as session collection.",

function emciaFormatMetrics(root){
 if(!root)return;
 const normalize=text=>String(text||'').replace(/ـ/g,'').replace(/[:：]\s*$/,'').trim();
 const groups=Array.from(root.querySelectorAll('.grid,.row,.advance-metrics'));
 for(const group of groups){
  if(group.hidden||group.classList.contains('hidden')||group.style.display==='none'||group.closest('.rc-paper,#rcPreview,#certDetails'))continue;
  const cards=Array.from(group.children);if(cards.length<2)continue;
  const advanced=group.classList.contains('advance-metrics');
  const readonly=cards.every(card=>{
   if(!['DIV','BUTTON'].includes(card.tagName)||card.querySelector('input,select,textarea,button,table,canvas'))return false;
   if(Array.from(card.children).some(node=>node.classList.contains('kpi')))return true;
   if(advanced&&card.querySelector('.advance-value'))return true;
   const label=Array.from(card.children).find(node=>node.tagName==='B');
   if(!label)return false;
   const nodes=Array.from(card.childNodes);return nodes.slice(nodes.indexOf(label)+1).some(node=>node.textContent.trim());
  });
  if(!readonly)continue;
  group.classList.add('emcia-metric-grid');
  for(const card of cards){
   let value=Array.from(card.children).find(node=>node.classList.contains('kpi'))||card.querySelector('.advance-value');
   let label=card.querySelector('.emcia-metric-label')||Array.from(card.children).find(node=>node.classList.contains('muted')||node.classList.contains('advance-label')||node.tagName==='B');
   if(!label)continue;
   if(!value){
    value=document.createElement('div');value.className='kpi';
    const nodes=Array.from(card.childNodes),index=nodes.indexOf(label);
    for(const node of nodes.slice(index+1)){if(node.nodeType===1&&node.tagName==='BR')node.remove();else value.appendChild(node)}
    card.appendChild(value);
   }
   value.classList.add('kpi');card.classList.add('card','emcia-metric-card');
   const original=normalize(label.dataset.metricFullAr||label.dataset.uiAr||label.textContent);
   let key=original,meta=emciaMetricLabels.get(key);
   if(!meta)for(const [candidate,config]of emciaMetricLabels)if(normalize(tr(candidate))===original){key=candidate;meta=config;break;}
   if(!meta)meta=[original,tr(original),'info'];
   label.dataset.metricFullAr=key;label.classList.add('emcia-metric-label');label.textContent=LANG==="fr"?meta[1]:tr(meta[0]);
   label.title=tr(key);
   let head=card.querySelector('.emcia-metric-head');
   if(!head){
    head=document.createElement('div');head.className='emcia-metric-head';
    const oldIcon=card.querySelector('.advance-icon');if(oldIcon){oldIcon.classList.add('emcia-metric-icon');head.appendChild(oldIcon)}else head.innerHTML=emciaMetricIcon(meta[2]);
    head.appendChild(label);card.insertBefore(head,card.firstChild);
   }
   if(card.tagName!=='BUTTON'&&!card.hasAttribute('role'))card.setAttribute('role','group');
   card.title=tr(key);
   if(/^[\d\s.,+%/\-:–]+(?:\s*DH)?$/.test(value.textContent.trim()))value.dir='ltr';
  }
 }
}

const emciaLocalizedUI="main,#nav,#emcia-top-controls,#emcia-users-panel";
const emciaArabicDocument="[data-emcia-arabic]";
const emciaOriginalText=new WeakMap();
function emciaTranslateLabels(root,scope){
 const labels="button,a,th,h1,h2,h3,h4,h5,h6,p,label,option,b,strong,summary,legend,.k,.muted,.warn,.welcome-season,.subnav-title,.emcia-review-summary small,.emcia-review-status,#certDetails,.page-footer span,.page-title span";
 const elements=[...root.querySelectorAll(labels)];
 if(root.matches?.(labels))elements.unshift(root);
 elements.forEach(el=>{
  if((scope&&!el.closest(scope))||el.closest(emciaArabicDocument))return;
  const textNodes=[...el.childNodes].filter(node=>node.nodeType===Node.TEXT_NODE);
  if(el.matches("th")&&(emciaOriginalText.has(el)||(el.children.length>0&&[...el.children].every(child=>child.tagName==="BR")))){
   // Split headings are safe to rebuild with text nodes and line breaks only.
   let record=emciaOriginalText.get(el);
   if(!record){
    record={original:textNodes.map(node=>node.data),display:null};
    emciaOriginalText.set(el,record);
   }
   const phrase=record.original.join(" ").trim();
   const translated=tr(phrase);
   const parts=LANG==="ar"||translated===phrase?record.original:translated.split(/ (?=\S+$)/);
   if(record.display!==LANG){
    el.replaceChildren(...parts.flatMap((part,index)=>index?[document.createElement("br"),part]:[part]));
    record.display=LANG;
   }
   return;
  }
  for(const node of textNodes){
   let record=emciaOriginalText.get(node);
   if(!record||node.data!==record.display){
    if(!/[\u0600-\u06ff]/.test(node.data))continue;
    record={original:node.data,display:node.data};
    emciaOriginalText.set(node,record);
   }
   const display=tr(record.original);
   if(node.data!==display)node.data=display;
   record.display=display;
  }
 });
}
function emciaLocalizedDocumentHTML(html){
 const template=document.createElement("template");
 template.innerHTML=html;
 emciaTranslateLabels(template.content);
 return template.innerHTML;
}
const emciaOriginalAttributes=new WeakMap();
function emciaTranslateAttributes(root){
 const selector="input[placeholder],textarea[placeholder],[title]";
 const elements=[...root.querySelectorAll(selector)];
 if(root.matches?.(selector))elements.unshift(root);
 elements.forEach(el=>{
  if(!el.closest(emciaLocalizedUI)||el.closest(emciaArabicDocument))return;
  let originals=emciaOriginalAttributes.get(el);
  for(const attribute of ["placeholder","title"]){
   if(!el.hasAttribute(attribute))continue;
   const value=el.getAttribute(attribute);
   let record=originals?.[attribute];
   if(!record||record.display!==value){
    if(!/[\u0600-\u06ff]/.test(value))continue;
    if(!originals){originals={};emciaOriginalAttributes.set(el,originals);}
    record=originals[attribute]={original:value,display:value};
   }
   const translated=tr(record.original);
   if(translated!==value)el.setAttribute(attribute,translated);
   record.display=translated;
  }
 });
}
const emciaTranslationObserver=new MutationObserver(records=>{
 if(LANG==="ar")return;
 const roots=new Set();
 for(const {target,addedNodes} of records){
  const element=target.nodeType===Node.ELEMENT_NODE?target:target.parentElement;
  if(!element?.closest(emciaLocalizedUI))continue;
  if(addedNodes.length===0||[...addedNodes].some(node=>node.nodeType===Node.TEXT_NODE))roots.add(element);
  for(const node of addedNodes)if(node.nodeType===Node.ELEMENT_NODE)roots.add(node);
 }
 for(const root of roots){
  if(!root.isConnected)continue;
  emciaTranslateLabels(root,emciaLocalizedUI);
  emciaTranslateAttributes(root);
 }
});
emciaTranslationObserver.observe(document.getElementById("appWorkspace"),{childList:true,subtree:true});

function emciaSubmitCorrectedReceipt(kind,id){
 if(!emciaIsSecretary())return;
 const x=emciaReviewRows().find(x=>x.kind===kind&&String(x.p.id)===String(id));
 if(!x||emciaReviewState(x)!=="corrected")return alert("يجب حفظ التصحيح في سجل الأداء والتسبيق أولاً.");
 if(!confirm("إرسال التوصيل للمحاسب لإعادة المراجعة؟"))return;
 const v=db.receiptReviews[kind+":"+id];v.state="resubmitted";v.fingerprint=x.fingerprint;v.history=[...(v.history||[]),{action:"إرسال لإعادة المراجعة",role:emciaRole(),at:new Date().toISOString()}];
 save();show("payments");
}
function emciaReviewState(x){
 const v=db.receiptReviews?.[x.kind+":"+x.p.id];if(!v)return "pending";
 if(v.state==="returned")return v.fingerprint===x.fingerprint?"returned":"corrected";
 if(v.state==="resubmitted")return "resubmitted";
 if(v.state==="confirmed"||(!v.state&&v.fingerprint===x.fingerprint))return v.fingerprint===x.fingerprint?"confirmed":"changed";
 return v.fingerprint===x.fingerprint?"pending":"changed";
}
function emciaReturnReceiptReview(kind,id){
 if(!emciaCanViewManagement())return alert("هذه العملية مخصصة للمدير والمحاسب");
 const x=emciaReviewRows().find(x=>x.kind===kind&&String(x.p.id)===String(id));if(!x)return alert("لم يعد التوصيل موجوداً");
 const note=prompt("ملاحظة التصحيح المطلوبة للتوصيل "+(x.p.receiptNo||x.p.id)+" (إلزامية):");if(note===null)return;if(note.trim().length<5)return alert("يرجى كتابة ملاحظة واضحة من خمسة أحرف على الأقل");
 if(!confirm("إرجاع هذا التوصيل للكاتبة للتصحيح في سجل الأداء والتسبيق؟"))return;
 db.receiptReviews=db.receiptReviews||{};const key=kind+":"+id,old=db.receiptReviews[key]||{};
 db.receiptReviews[key]={...old,state:"returned",fingerprint:x.fingerprint,role:emciaRole(),at:new Date().toISOString(),note:note.trim(),history:[...(old.history||[]),{action:"إرجاع للتصحيح",role:emciaRole(),at:new Date().toISOString(),note:note.trim()}]};
 save();emciaFinanceReviewPlaceholder();
}

function addTeacher(){
 const ar=($("#tnAr")?.value||"").trim(),fr=($("#tnFr")?.value||"").trim();
 if(!ar&&!fr){alert("أدخل اسم الأستاذ");$("#tnAr")?.focus();return}
 const subjects=[...new Set((tempTeacherSubjects||[]).map(x=>String(x||"").trim()).filter(Boolean))];
 if(!subjects.length&&!confirm("لم تحدد أي مادة للأستاذ. هل تريد إضافته دون مادة حالياً؟"))return;
 const subjectIds=[];
 try{
   for(const n of subjects){const rec=ensureSubjectRecordForGroupMaterial(n);if(rec?.id)subjectIds.push(rec.id)}
   const teacher={id:uid(),n:ar||fr,nAr:ar,nFr:fr,ph:($("#tph")?.value||"").trim(),address:($("#taddr")?.value||"").trim(),note:($("#tnote")?.value||"").trim(),sub:subjects[0]||"",subjects:[...subjects],subjectIds:[...new Set(subjectIds)],r:0,active:true};
   db.t.push(teacher);
   try{save()}catch(err){db.t=db.t.filter(x=>x.id!==teacher.id);throw err}
   // إفراغ النموذج المرئي صراحة، وليس الاكتفاء بتصفير البيانات المؤقتة.
   tempTeacherSubjects=[];
   ["tnAr","tnFr","tph","taddr","tnote","teacherOtherSubject"].forEach(id=>{const el=$("#"+id);if(el)el.value=""});
   $("#teacherOtherSubjectWrap")?.classList.add("hide");
   renderSubjectPicker("teacher");
   // تحديث جدول الأساتذة مع إعادة إنشاء النموذج الفارغ.
   teachers();
   const form=$("#teachers");
   if(form){["tnAr","tnFr","tph","taddr","tnote"].forEach(id=>{const el=$("#"+id);if(el)el.value=""});renderSubjectPicker("teacher")}
   alert("تمت إضافة الأستاذ بنجاح: "+(ar||fr));
 }catch(err){console.error("تعذر إضافة الأستاذ",err);alert("تعذر حفظ الأستاذ. لم يتم تأكيد الإضافة: "+(err?.message||err))}
}

function emciaTableFilter(inputId,tableId){
 const value=id=>(document.getElementById(id)?.value||'').trim();
 const q=value(inputId).toLocaleLowerCase(),sub=value(inputId+'Subject'),level=value(inputId+'Level').toLocaleLowerCase(),gid=value(inputId+'Group');
 const status=value(inputId+'Status');let visible=0;
 document.querySelectorAll('#'+tableId+' tr[data-student-id]').forEach(row=>{
  const sid=row.dataset.studentId,student=by(db.s,sid)||{};
  const enrollments=db.e.filter(e=>e.sid===sid&&emciaEnrollmentDate(e,today()));
  const groups=enrollments.map(e=>by(db.g,e.gid)).filter(Boolean);
  const requests=studentRequestLabels(student).join(' ').toLocaleLowerCase();
  const hay=[row.textContent,student.n,student.nAr,student.nFr,student.ph,student.parent,student.land].filter(Boolean).join(' ').toLocaleLowerCase();
  const levels=[student.level,...(student.requestedSubjectLevels||[]).map(r=>r.level),...groups.map(g=>g.level)].filter(Boolean).map(x=>String(x).trim().toLocaleLowerCase());
  const matchesSubject=!sub||requests.includes(sub.toLocaleLowerCase())||groups.some(g=>g.subject===sub);
  const matches=hay.includes(q)&&matchesSubject&&(!level||levels.includes(level))&&(!gid||enrollments.some(e=>e.gid===gid))&&(!status||(status==="active"?!!student.active:!student.active));
  row.style.display=matches?'':'none';row.hidden=!matches;
  if(matches)visible++;
 });

}

function emciaSaveStudy(id){
 const o=by(db.s,id);if(!o)return;
 const status=$('#studyStatus').value,end=$('#studyEnd').value,ar=$('#studyNameAr').value.trim(),fr=$('#studyNameFr').value.trim();
 if(!ar&&!fr)return alert('أدخل اسم المتعلم');
 if(status==='active'&&o.studyStatus==='stopped')return alert('للعودة إلى الدراسة، سجّل المتعلم مجدداً في الفوج بتاريخ بداية جديد. تبقى الفترة السابقة محفوظة.');
 if(status==='stopped'){
  const selected=$('#studyStopGroup')?.value||'all';
  if(!emciaValidDate(end)||o.joined&&end<o.joined)return alert('حدد تاريخ توقف صحيحاً لا يسبق التسجيل بالمؤسسة');
  if(o.studyStatus==='stopped'&&selected==='all'&&end!==o.stoppedOn)return alert('تاريخ التوقف محفوظ. لتصحيح فترة سبق إغلاقها، راجع التسوية أولاً.');
  const affected=db.e.filter(e=>e.sid===id&&e.active!==false&&(selected==='all'||e.id===selected));
  if(!affected.length)return alert('لا يوجد تسجيل نشيط في الفوج المحدد.');
  if(affected.some(e=>e.start&&end<e.start))return alert('تاريخ التوقف يسبق بداية التسجيل في الفوج.');
  if(db.sc.some(x=>x.sid===id&&x.date>end&&x.date<=today()&&affected.some(e=>e.gid===x.gid)))return alert('توجد حصة منجزة بعد تاريخ التوقف. راجع التاريخ أو الحصة أولاً.');
  if(affected.some(e=>db.at2.some(a=>a.sid===id&&a.gid===e.gid&&a.date>end&&['present','late','leftEarly'].includes(a.status))||db.att.some(a=>a.sid===id&&a.gid===e.gid&&a.date>end&&['present','late','leftEarly'].includes(a.status))))return alert('يوجد حضور مسجل بعد تاريخ التوقف. صحح التاريخ أو سجل الحضور أولاً.');
  if(affected.some(e=>db.tp.some(t=>t.tid===by(db.g,e.gid)?.tid&&t.month>end.slice(0,7)&&+t.amount>0)&&db.p.some(p=>p.sid===id&&p.gid===e.gid&&paymentAllocations(p).some(a=>a.month>end.slice(0,7)))))return alert('توجد مستحقات أستاذ مؤداة عن فترة بعد التوقف. راجع التسوية المالية قبل تغييرها.');
  affected.forEach(e=>{db.p.filter(p=>p.sid===id&&p.gid===e.gid&&!p.enrollmentId).forEach(p=>{p.enrollmentId=e.id});Object.assign(e,{stopMonthCharge:$("#studyStopCharge").value,end,active:false,endReason:$('#studyReason').value.trim(),endedAt:new Date().toISOString()})});
  affected.forEach(e=>e.stopMonthCharge=$('#studyStopCharge').value);
  if(!db.e.some(e=>e.sid===id&&e.active!==false))Object.assign(o,{studyStatus:'stopped',stoppedOn:end,stopMonthCharge:$('#studyStopCharge').value,stopReason:$('#studyReason').value.trim()});
 }
 Object.assign(o,{nAr:ar,nFr:fr,n:ar||fr});
 save();students();
}

}

function emciaWaitLevel(value){
 const raw=String(value||'').trim().replace(/\s+/g,' ');
 const key=raw.toLocaleLowerCase().replace(/[\u064b-\u065f\u0670\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي');
 const aliases={'1bac':'الأولى بكالوريا','1 bac':'الأولى بكالوريا','bac1':'الأولى بكالوريا','1ere bac':'الأولى بكالوريا','1ère bac':'الأولى بكالوريا','اولى بكالوريا':'الأولى بكالوريا','الاولي بكالوريا':'الأولى بكالوريا','2bac':'الثانية بكالوريا','2 bac':'الثانية بكالوريا','bac2':'الثانية بكالوريا','الثانية بكالوريا':'الثانية بكالوريا','ثانية بكالوريا':'الثانية بكالوريا','جذع مشترك':'الجذع المشترك','الجذع المشترك':'الجذع المشترك'};
 if(aliases[key])return aliases[key];
 if(/^[abc][12]$/i.test(raw))return raw.toUpperCase();
 const known=educationLevelCatalog().find(x=>x.toLocaleLowerCase().replace(/[أإآ]/g,'ا').replace(/ى/g,'ي')===key);
 if(known)return known;
 if(!raw||['غير محدد','مستوى غير محدد'].includes(key))return 'غير محدد';
 if(['ابتدائي','اعدادي','ثانوي','جامعي'].includes(key))return raw+' — مستوى غير محدد';
 return raw;
}

function shiftLabel(v){return v==="evening"?"المناوبة المسائية":"المناوبة الصباحية"}
function shiftRecord(day,type){return db.shifts.find(x=>x.date===day&&x.type===type)||null}
function shiftCashPayments(day,type){
 let rec=shiftRecord(day,type); if(!rec||!rec.openedAt)return [];
 let start=new Date(rec.openedAt).getTime(), end=rec.closedAt?new Date(rec.closedAt).getTime():Infinity;
 return [...db.p,...db.sp].filter(p=>{
   if((p.method||"cash")!=="cash"||(p.date||"")!==day)return false;
   let ts=p.createdAt?new Date(p.createdAt).getTime():NaN;
   // Legacy/current payments without timestamp cannot be reliably assigned to a shift.
   return Number.isFinite(ts)&&ts>=start&&ts<=end
 })
}

function paymentAllocations(p){
 if(Array.isArray(p.allocations)&&p.allocations.length)return p.allocations;
 return [{month:p.allocMonth||p.receiptMonth||"",amount:+p.a||0}]
}
function emciaMonthlyRecognizedParts(p,m){
 const amount=Number(p.a)||0;
 if(!(amount>0)||!m)return {teacher:0,emcia:0,discountTeacher:0};
 const factor=p.netAfterRefund==null?1:Math.max(0,Number(p.netAfterRefund)||0)/amount;
 const allocated=paymentAllocations(p).filter(x=>x.month===m).reduce((n,x)=>n+(Number(x.amount)||0),0);
 const share=Math.max(0,allocated)/amount*factor;
 return {teacher:teacherDueOf(p)*share,emcia:(Number(p.e)||0)*share,discountTeacher:(Number(p.discountTeacher)||0)*share};
}
function emciaRecognizedShares(m){
 const accounts=emciaAccountTotals(emciaAccountRows(m));
 return {teacher:accounts.teacher,emcia:accounts.emcia};
}
function allocatedAmountForMonth(p,m){return paymentAllocations(p).filter(x=>x.month===m).reduce((s,x)=>s+(+x.amount||0),0)}
function emciaMonthlyPaid(sid,gid,m){return db.p.filter(p=>p.sid===sid&&p.gid===gid).reduce((sum,p)=>sum+allocatedAmountForMonth(p,m)*(p.netAfterRefund==null?1:(+p.a>0?Math.max(0,+p.netAfterRefund)/+p.a:0)),0)}

  if(p.voidedAt||p.cancelledAt||!received||received>=m)continue;
  const paid=Number(p.a)||0;
  const factor=p.netAfterRefund==null?1:paid>0?Math.max(0,Number(p.netAfterRefund)||0)/paid:0;

function emciaValidDate(value){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;
 const date=new Date(value+"T12:00:00Z");
 return Number.isFinite(date.getTime())&&date.toISOString().slice(0,10)===value;
}
function emciaCompletedFlexibleLessons(e,month=""){
 return db.sc.filter(x=>x.gid===e.gid&&x.sid===e.sid&&(!e.start||x.date>=e.start)&&(!month||x.date.slice(0,7)===month)).filter(x=>{
  const record=db.at2.find(a=>a.date===x.date&&a.ref==="f:"+x.id&&a.sid===x.sid);
  return !record||["present","late","leftEarly"].includes(record.status);
 });
}
function emciaAttendanceRecords(){
 // A timed record supersedes the ambiguous legacy day record for that learner/group/date.
 const keys=new Set(db.at2.map(a=>attKey(a.date,a.gid,a.sid)));

// Session accounting is derived from individual lessons and receipts; no duplicate payment records are stored.
function emciaSessionLedger(asOf=today()){
 const cents=value=>Math.round((Number(value)||0)*100),lessons=[],allocations=[],credits=[];
 const pairs=new Set([...db.e.filter(e=>e.billingMode==='session').map(e=>e.sid+'|'+e.gid),...db.sp.map(p=>p.sid+'|'+p.gid)]);
 for(const pair of pairs){
  const [sid,gid]=pair.split('|'),g=by(db.g,gid),enrollments=db.e.filter(e=>e.sid===sid&&e.gid===gid&&e.billingMode==='session');
  const flexible=db.sc.filter(x=>x.sid===sid&&x.gid===gid&&x.date<=asOf);
  const rows=flexible.map(x=>{
   const e=enrollments.find(e=>e.id===x.enrollmentId)||enrollments.filter(e=>!e.start||e.start<=x.date).sort((a,b)=>(b.start||'').localeCompare(a.start||''))[0];
   const attendance=db.at2.find(a=>a.ref==='f:'+x.id&&a.date===x.date&&a.sid===sid);
   if(!e||!emciaEnrollmentDate(e,x.date)||attendance&&!['present','late','leftEarly'].includes(attendance.status))return null;
   return {id:'f:'+x.id,date:x.date,time:x.time||'',sid,gid,e,source:x};
  }).filter(Boolean);
  // Historical day-only entries count once, and are never duplicated with a flexible lesson on that date.
  const legacyDates=new Set(db.att.filter(a=>a.sid===sid&&a.gid===gid&&a.date<=asOf&&['present','late','leftEarly'].includes(a.status)).map(a=>a.date));
  for(const date of legacyDates){
   if(flexible.some(x=>x.date===date))continue;
   const e=enrollments.filter(e=>!e.start||e.start<=date).sort((a,b)=>(b.start||'').localeCompare(a.start||''))[0];
   if(e&&emciaEnrollmentDate(e,date))rows.push({id:'legacy:'+date+'|'+pair,date,time:'',sid,gid,e,source:{}});
  }
  for(const row of rows){
   const x=row.source,e=row.e,discount=activeDiscount(e,row.date.slice(0,7));
   const base=Math.max(0,cents(x.unitPrice??e.sessionPrice)),deduction=Math.min(base,Math.max(0,cents(x.unitDiscount??discount?.amount)));
   const bearer=x.unitBearer??discount?.bearer??'none',net=base-deduction,rate=Number(g?.r)||0;
   let teacherDiscount=bearer==='teacher'?deduction:bearer==='half'?Math.round(deduction/2):bearer==='custom'?cents(x.unitTeacherDiscount??discount?.teacher):0;
   row.cost=net;row.remaining=net;row.teacher=Math.min(net,Math.max(0,Math.round(base*emciaExactTeacherRate(rate))-teacherDiscount));row.teacherDiscount=teacherDiscount;
  }
  rows.sort((a,b)=>(a.date+a.time+a.id).localeCompare(b.date+b.time+b.id));lessons.push(...rows);
  const receipts=db.sp.filter(p=>p.sid===sid&&p.gid===gid&&p.date<=asOf).slice().sort((a,b)=>(a.date+(a.createdAt||'')+a.id).localeCompare(b.date+(b.createdAt||'')+b.id));
  for(const receipt of receipts){
   let remaining=Math.max(0,cents(receipt.a));
   for(const lesson of rows){
    if(!remaining)break;if(!lesson.remaining)continue;
    const amount=Math.min(remaining,lesson.remaining),before=lesson.cost-lesson.remaining,after=before+amount;
    // Difference of rounded cumulative shares preserves cents across partial receipts.
    const teacher=lesson.cost?Math.round(lesson.teacher*after/lesson.cost)-Math.round(lesson.teacher*before/lesson.cost):0;
    const discountTeacher=lesson.cost?Math.round(lesson.teacherDiscount*after/lesson.cost)-Math.round(lesson.teacherDiscount*before/lesson.cost):0;
    allocations.push({receipt,lesson,amount:amount/100,teacher:teacher/100,emcia:(amount-teacher)/100,discountTeacher:discountTeacher/100,date:receipt.date>lesson.date?receipt.date:lesson.date});
    lesson.remaining-=amount;remaining-=amount;
   }
   if(remaining)credits.push({receipt,amount:remaining/100});
  }
 }

}

function emciaAccountRows(month="",options={}){

 db.e.filter(e=>eligible(e.sid,e.gid)&&emciaBillingHistory(e)&&(!e.start||e.start<=cutoff)).forEach(e=>{

 });
 db.p.forEach(p=>{
  const sid=p.sid||by(db.e,p.eid)?.sid,gid=p.gid||by(db.e,p.eid)?.gid;

 ledger.allocations.filter(x=>eligible(x.lesson.sid,x.lesson.gid)&&inPeriod(x.date.slice(0,7))).forEach(x=>{
  const r=get(x.lesson.sid,x.lesson.gid,"session");r.teacher+=x.teacher;r.emcia+=x.emcia;r.teacherDiscount+=x.discountTeacher;

function emciaSaveLearnerExtra(form){
 const fields=form.elements,sid=fields.learner.value,gid=fields.group.value;
 const cat=(fields.category.value==="أخرى"?fields.customCategory.value:fields.category.value).trim();
 const a=Number(fields.amount.value),date=fields.paidOn.value,receiptNo=fields.receiptNo.value.trim();
 if(!by(db.s,sid)||!cat||!Number.isFinite(a)||a<=0||!emciaValidDate(date)||!receiptNo)
  return alert("اختر المتعلم وأدخل نوع المدخول والمبلغ وتاريخ الأداء ورقم التوصيل.");
 if(gid&&!db.e.some(e=>e.sid===sid&&e.gid===gid))return alert("اختر المتعلم");
 if([...db.p,...db.sp,...db.oi].some(p=>(p.receiptNo||"").trim()===receiptNo))return alert("رقم التوصيل مستعمل سابقاً");

 const record={id:uid(),sid,gid:gid||null,cat,a,date,month:date.slice(0,7),receiptNo,method:fields.paymentMethod.value,note:fields.note.value.trim()};
 emciaStoreIncome([record]);payments();applyLang();

function emciaEditSessionPayment(id){
 const p=db.sp.find(x=>x.id===id);if(!p)return alert("لم يُعثر على الدفعة");
 const amount=prompt("المبلغ المقبوض (درهم)",p.a);if(amount===null)return;
 const a=Number(amount);if(!Number.isFinite(a)||a<=0)return alert("المبلغ غير صحيح");
 const date=prompt("تاريخ الأداء YYYY-MM-DD",p.date);if(date===null)return;
 if(!emciaValidDate(date))return alert("التاريخ غير صحيح");
 const receipt=prompt("رقم التوصيل",p.receiptNo||"");if(receipt===null)return;
 const receiptNo=receipt.trim();if(!receiptNo)return alert("رقم التوصيل مطلوب");
 if([...db.p,...db.sp].some(x=>x.id!==id&&(x.receiptNo||"").trim()===receiptNo))return alert("رقم التوصيل مستخدم بالفعل");
 const method=prompt("طريقة الأداء: cash / transfer / cheque / other",p.method||"cash");if(method===null)return;
 if(!["cash","transfer","cheque","other"].includes(method))return alert("طريقة الأداء غير صحيحة");
 const timing=prompt("نوع الدفعة: instant / advance / later",p.paymentTiming||"instant");if(timing===null)return;
 if(!["instant","advance","later"].includes(timing))return alert("نوع الدفعة غير صحيح");
 const note=prompt("ملاحظة",p.note||"");if(note===null)return;
 if(!confirm("تأكيد تعديل دفعة الحصص؟"))return;
 Object.assign(p,{a,date,receiptNo,method,paymentTiming:timing,note,updatedAt:new Date().toISOString()});
 save();payments();emciaRefreshUnifiedPaymentHistory("session");
}
function emciaDeleteSessionPayment(id){
 const p=db.sp.find(x=>x.id===id);if(!p)return alert("لم يُعثر على الدفعة");
 if(!confirm("هل تريد حذف دفعة الحصص رقم "+(p.receiptNo||"—")+" بمبلغ "+money(p.a)+"؟ لا يؤثر هذا على الحضور أو الحصص المنجزة."))return;
 db.sp=db.sp.filter(x=>x.id!==id);save();payments();emciaRefreshUnifiedPaymentHistory("session");
}
function emciaUnifiedPaymentRows(){
 const rows=db.p.map(p=>({p,mode:"monthly"})).concat(db.sp.map(p=>({p,mode:"session"})));
 rows.push(...db.oi.filter(p=>p.sid&&!p.voidedAt&&!p.cancelledAt).map(p=>({p,mode:"extra"})));
 rows.sort((x,y)=>(y.p.date||y.p.month||"").localeCompare(x.p.date||x.p.month||"")||(y.p.createdAt||"").localeCompare(x.p.createdAt||""));
 return rows.map(({p,mode})=>{
  const action=mode==="extra"?'<button onclick="editSimple(\'oi\',\''+p.id+'\')">✏️</button><button class="danger" onclick="delTx(\'oi\',\''+p.id+'\')">🗑️</button>':mode==="session"?'<button title="تعديل دفعة الحصص" onclick="emciaEditSessionPayment(\''+p.id+'\')">✏️</button><button class="danger" title="حذف دفعة الحصص" onclick="emciaDeleteSessionPayment(\''+p.id+'\')">🗑️</button>':'<button onclick="editPayment(\''+p.id+'\')">✏️</button><button class="danger" onclick="delTx(\'p\',\''+p.id+'\')">🗑️</button>';
  const category=mode==="extra"?p.cat||"مدخول إضافي":mode==="session"?({instant:"فوري",advance:"مسبق",later:"لاحق"}[p.paymentTiming]||"دفعة حصص"):((p.type==="settlement"?"تسوية — ":"")+(p.allocMonth||"—")+(+p.creditAmount>0?" — رصيد للمراجعة: "+money(p.creditAmount):""));
  return '<tr data-mode="'+mode+'" data-sid="'+esc(p.sid||'')+'" data-gid="'+esc(p.gid||'')+'"><td>'+esc(p.date||p.month||"—")+'</td><td>'+esc(name(db.s,p.sid))+'</td><td>'+esc(groupCompactName(by(db.g,p.gid)))+'</td><td>'+(mode==="extra"?"مدخول إضافي":mode==="session"?"بالحصة":"شهري")+'</td><td>'+money(p.a)+'</td><td>'+esc(p.receiptNo||"—")+'</td><td>'+esc(mode==="extra"&&!p.method?"—":paymentMethodLabel(p.method))+'</td><td>'+esc(category)+'</td><td class="actions">'+action+'</td></tr>';
 }).join("");
}
function emciaRefreshUnifiedPaymentHistory(mode){

 emciaFilterPaymentHistory();
}

 });

function emciaSelectPaymentStudent(){

 let mode=modes.includes("monthly")?"monthly":"session";
 if(modes.includes("monthly")&&modes.includes("session"))mode=confirm("المتعلم مسجل بالنظامين. موافق = شهري، إلغاء = بالحصة.")?"monthly":"session";
 window.emciaPaymentMode=mode;
 if($("#regularPaymentBox"))$("#regularPaymentBox").style.display=mode==="monthly"?"grid":"none";

 const select=$("#ps"),q=($("#paymentStudentSearch")?.value||"").trim().toLocaleLowerCase();
 if(!select)return;
 window.emciaPaymentSearch=$("#paymentStudentSearch")?.value||"";
 const previous=select.value;
 Array.from(select.options).forEach(o=>{o.hidden=!!q&&!!o.value&&!o.textContent.toLocaleLowerCase().includes(q)});
 if(previous&&select.selectedOptions[0]?.hidden){select.value="";emciaSessionPaymentSelection();emciaSettlementPanel()}

function addCompositeRow(month=""){
 let box=$("#pcompRows");if(!box)return;
 let row=document.createElement("div");row.className="row composite-row";row.style.marginBottom="6px";
 row.innerHTML=`<div><label>شهر الاستحقاق</label><input class="pcmonth" type="month" value="${esc(month)}" onchange="compositeSummary()"></div><div><label>المبلغ المخصص</label><input class="pcamount" type="number" step="0.01" min="0" oninput="compositeSummary()"></div><div style="align-self:end"><button type="button" class="danger" onclick="this.closest('.composite-row').remove();compositeSummary()">حذف</button></div>`;

function compositeAllocations(){
 return [...document.querySelectorAll(".composite-row")].map(r=>({month:r.querySelector(".pcmonth")?.value||"",amount:+(r.querySelector(".pcamount")?.value||0)})).filter(x=>x.month||x.amount)
}
function compositeSummary(){
 let el=$("#pcompSummary");if(!el)return;
 let receipt=+($("#pa")?.value||0),allocs=compositeAllocations(),sum=allocs.reduce((s,x)=>s+x.amount,0),diff=receipt-sum;
 el.innerHTML=`مبلغ التوصيل: <b>${money(receipt)}</b> — مجموع التوزيع: <b>${money(sum)}</b> — الفرق: <b>${money(diff)}</b>`
}
function addPayment(){
 let gid=window.pg||"",sid=$("#ps").value,a=+$("#pa").value;
 if(db.e.some(e=>e.active&&e.gid===gid&&e.sid===sid&&e.billingMode==="session"))return alert("استعمل سجل دفعات الحصص لهذا المتعلم");
 if(!gid||!sid||!(a>0))return alert("اختر الفوج والمتعلم وأدخل المبلغ");
 let receipt=($("#preceipt")?.value||"").trim();
 if(!receipt)return alert("أدخل رقم التوصيل");
 if([...db.p,...db.sp].some(p=>(p.receiptNo||"").trim()===receipt))return alert("هذا المرجع مسجل سابقاً. للتوصيل المشترك، استخدم لاحقة فريدة لكل متعلم مثل 125/1 و125/2، وسجّل حصته فقط.");
 let am=$("#pam").value,type=$("#pty").value,method=$("#pmethod")?.value||"cash",ref=($("#pref")?.value||"").trim(),allocations=null;
 if(type==="composite"){
   allocations=compositeAllocations();
   if(!allocations.length||allocations.some(x=>!x.month||!(x.amount>0)))return alert("حدد الشهر والمبلغ في كل جزء من الأداء المركب.");
   let months=allocations.map(x=>x.month);
   if(new Set(months).size!==months.length)return alert("لا تكرر الشهر نفسه داخل الأداء المركب.");
   let total=allocations.reduce((s,x)=>s+x.amount,0);
   if(Math.abs(total-a)>0.01)return alert(`مجموع توزيع الأشهر (${money(total)}) يجب أن يساوي مبلغ التوصيل (${money(a)}).`);
   am=allocations[0].month;
 }
 if(!/^\d{4}-\d{2}$/.test(am)||!emciaValidDate($('#pd').value))return alert('حدد شهر الاستحقاق وتاريخ الأداء الصحيحين');
 const en=enrollmentFor(sid,gid,am);
 if(!en||en.billingMode==='session')return alert('التسجيل الشهري غير موجود');
 const months=allocations||[{month:am,amount:a}];
 if(months.some(x=>!emciaEnrollmentMonth(emciaBillingEnrollment(db.e,sid,gid,x.month),x.month)))return alert('لا يمكن تسجيل استحقاق خارج فترة دراسة المتعلم. راجع تاريخ البداية أو التوقف.');
 if(type==='settlement'){
  const draft=emciaSettlementDraft();if(!draft)return alert('راجع معلومات التسوية');
  if(adjustmentTeacherPaid(by(db.g,gid)?.tid,am))return alert('سبق أداء مستحقات الأستاذ لهذا الشهر. راجع قسم التسوية الاستثنائية أولاً.');
  if(emciaApprovedMonthlyDue(en,am)!==null)return alert('هذا الشهر مرتبط بتسوية استثنائية سابقة؛ راجعها قبل تعديل الاستحقاق.');
  if(draft.paid+a>draft.split.due+0.01)return alert('المبلغ يتجاوز المتبقي في التسوية. راجع المؤدى السابق أو المبلغ المقبوض.');
  draft.e.monthlySettlements=[...(draft.e.monthlySettlements||[]).filter(x=>x.month!==am),draft.agreement];
 }
 let currentAmount=type==="composite"?(allocations.find(x=>x.month===am)?.amount||0):a;
 let sp=paymentSplit(sid,gid,currentAmount,am);
 db.p.push({id:uid(),sid,gid,enrollmentId:en.id,settlementId:type==="settlement"?en.monthlySettlements.find(x=>x.month===am)?.id:null,a,d:type==="composite"?0:sp.teacher,e:type==="composite"?0:sp.emcia,date:$("#pd").value||today(),receiptMonth:($("#pd").value||today()).slice(0,7),allocMonth:am,type,note:$("#pnote").value,receiptNo:receipt,method,paymentRef:ref,createdAt:new Date().toISOString(),allocations:allocations||null,discount:type==="composite"?0:sp.discount,discountTeacher:type==="composite"?0:sp.discountTeacher,discountEmcia:type==="composite"?0:sp.discountEmcia,dueAfterDiscount:type==="composite"?0:sp.due});
 save();payments()
}
function editPayment(id){
 const p=by(db.p,id);if(!p)return;
 if(p.adjustmentId||adjustmentForPayment(id))return alert('هذا الأداء مرتبط بتسوية استثنائية؛ عدله من قسم التسوية الاستثنائية.');
 const rn=prompt('رقم التوصيل',p.receiptNo||'');if(rn===null)return;
 const receiptNo=rn.trim();if(!receiptNo||[...db.p,...db.sp].some(x=>x.id!==id&&(x.receiptNo||'').trim()===receiptNo))return alert('رقم التوصيل غير صحيح أو مستعمل');
 const method=prompt('طريقة الأداء: cash / transfer / cheque / other',p.method||'cash');if(method===null)return;
 if(!['cash','transfer','cheque','other'].includes(method))return alert('طريقة الأداء غير صحيحة');
 const paymentRef=method==='cash'?'':prompt('مرجع العملية',p.paymentRef||'');if(paymentRef===null)return;
 const amount=prompt('المبلغ',p.a);if(amount===null)return;const a=Number(amount);if(!Number.isFinite(a)||a<=0)return alert('المبلغ غير صحيح');
 const date=prompt('تاريخ الأداء الفعلي YYYY-MM-DD',p.date||today());if(date===null)return;
 const am=prompt('شهر الاستحقاق YYYY-MM',p.allocMonth);if(am===null)return;
 let allocations=null;

function emciaTeacherLateCashRows(tid,m){

 (db.p||[]).forEach(p=>{
  if((p.date||"").slice(0,7)!==m||by(db.g,p.gid)?.tid!==tid)return;
  const total=Number(p.a)||0;if(!(total>0))return;
  const factor=p.netAfterRefund==null?1:Math.max(0,Number(p.netAfterRefund)||0)/total;
  paymentAllocations(p).filter(a=>a.month&&a.month<m&&Number(a.amount)>0).forEach(a=>{
   const ratio=Number(a.amount)/total*factor;
   rows.push({sid:p.sid,gid:p.gid,receipt:p.receiptNo||p.receipt||p.number||"—",date:p.date,month:a.month,amount:Number(a.amount)*factor,teacher:teacherDueOf(p)*ratio});
  });
 });
 return rows;
}

function emciaObligationDueDate(month,day){
 const [year,number]=month.split('-').map(Number),last=new Date(Date.UTC(year,number,0)).getUTCDate();
 return month+'-'+String(Math.min(last,Math.max(1,+day||1))).padStart(2,'0');
}
function emciaObligationTerms(rule,month){return (rule.versions||[]).filter(x=>x.from<=month).sort((a,b)=>b.from.localeCompare(a.from))[0]||null}
function emciaObligationRows(date=emciaLocalDay(),selectedMonth=''){
 if(!emciaCanViewManagement())return [];
 const rows=[],through=selectedMonth||monthShift(date.slice(0,7),1);
 for(const rule of db.obligations||[]){
  for(let month=selectedMonth||rule.start;month&&month<=through;month=monthShift(month,1)){
   if(month<rule.start||rule.end&&month>rule.end)continue;
   const terms=emciaObligationTerms(rule,month);if(!terms)continue;
   const dueDate=emciaObligationDueDate(month,terms.day),paid=db.x.filter(x=>x.obligationId===rule.id&&x.obligationMonth===month&&(x.date||x.month+'-01')<=date).reduce((sum,x)=>sum+(+x.a||0),0);
   const amount=+terms.amount||0,remaining=Math.max(0,Math.round((amount-paid)*100)/100),settled=amount>0?remaining<0.005:paid>0;
   const days=Math.round((new Date(dueDate+'T12:00:00Z')-new Date(date+'T12:00:00Z'))/86400000);
   const status=settled?'paid':days<0?'overdue':days===0?'today':days<=terms.lead?'soon':'future';
   rows.push({rule,month,dueDate,amount,paid,remaining,status,days});
  }
 }
 return rows.sort((a,b)=>a.dueDate.localeCompare(b.dueDate)||a.rule.n.localeCompare(b.rule.n));
}

 });

 }).join('');
 return '<style>@page{size:A4 landscape;margin:7mm}.blank-attendance{direction:inherit;font-family:Arial,Tahoma,sans-serif;color:#111;width:100%}.blank-attendance .blank-page{break-after:page;page-break-after:always;position:relative;box-sizing:border-box;padding-bottom:2mm;width:100%}.blank-attendance .blank-page:last-child{break-after:auto;page-break-after:auto}.blank-attendance .page-header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #bbb;padding-bottom:5px;margin-bottom:7px;min-height:54px}.blank-attendance .page-header img{width:66px;height:54px;object-fit:contain;flex-shrink:0}.blank-attendance .page-title{display:flex;flex-direction:column;gap:4px;font-size:11px}.blank-attendance .page-title strong{font-size:15px}.blank-attendance h3{font-size:10px;margin:6px 0 3px}.blank-attendance .group-block{break-inside:avoid;page-break-inside:avoid}.blank-attendance table{border-collapse:collapse;width:100%;table-layout:fixed;margin:0 0 4px}.blank-attendance th,.blank-attendance td{border:1px solid #d9dee4!important;text-align:center;font-size:8px;padding:1px 0;height:17px;box-sizing:border-box}.blank-attendance th{background:#edf0f3!important;line-height:1.2}.blank-attendance .student,.blank-attendance .student-head{width:22%;text-align:right;padding:1px 4px;font-size:10px;white-space:nowrap}.blank-attendance .payment-col{width:20px}.blank-attendance .unused{background:#f7f8f9!important}.blank-attendance tr{break-inside:avoid}.blank-attendance .page-footer{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #bbb;padding-top:5px;font-size:9px;margin-top:7px;break-inside:avoid}@media print{html,body{margin:0!important;padding:0!important}.rc-paper{margin:0!important;padding:0!important;border:0!important;box-shadow:none!important}.blank-attendance .blank-page{margin:0;padding:0;break-inside:avoid;page-break-inside:avoid}.blank-attendance table{margin:0 0 3px!important}.blank-attendance th,.blank-atten  let ms=c[n-1],md=(prompt("أدخل تاريخ تنفيذ حصة التعويض (YYYY-MM-DD):",r.date)||"").trim();
 if(!/^\d{4}-\d{2}-\d{2}$/.test(md)){alert("تاريخ غير صالح.");return}
 if(md.slice(0,7)!==r.date.slice(0,7)){alert("يجب أن يتم التعويض داخل نفس شهر الغياب.");return}
 if(md<r.date){alert("لا يمكن أن يكون تاريخ التعويض قبل تاريخ الغياب.");return}

 let mr=teacherSessionRecord(ms.id,md);if(mr)Object.assign(mr,{status:"madeup",makeupForAbsenceId:r.id,updatedAt:new Date().toISOString()});
 else db.tatt.push({id:uid(),sid:ms.id,date:md,status:"madeup",note:"حصة تعويضية",makeupForAbsenceId:r.id,createdAt:new Date().toISOString()});

function emciaStudentFileCandidates(query=window.sfQuery||'',gid=window.sfGroup||''){

 return db.s.filter(s=>{
  const name=[s.n,s.nAr,s.nFr].filter(Boolean).join(' ').toLocaleLowerCase();

 }).slice().sort((a,b)=>objName(a).localeCompare(objName(b),'ar'));
}

function dayAr(date){return["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"][new Date(date+"T12:00:00").getDay()]}
function emciaRecordsForSchedule(s,date){
 const refs=db.sch.filter(x=>x.active!==false&&x.gid===s.gid&&x.day===dayAr(date));
 return emciaAttendanceRecords().filter(a=>a.date===date&&a.gid===s.gid&&(a.ref==="m:"+s.id||(!a.ref&&refs.length===1)));
}
function sessionAttendanceStatus(s,date){
 let es=db.e.filter(e=>emciaEnrollmentDate(e,date)&&e.billingMode!=="session"&&e.gid===s.gid),rec=emciaRecordsForSchedule(s,date);
 if(!es.length)return{label:"لا متعلمين",cls:"muted",done:true,n:0,marked:0};
 let marked=new Set(rec.filter(a=>a.status).map(a=>a.sid)).size;
 if(marked>=es.length)return{label:"مكتمل",cls:"ok",done:true,n:es.length,marked};
 if(marked>0)return{label:`جزئي ${marked}/${es.length}`,cls:"warn",done:false,n:es.length,marked};
 return{label:"لم يسجل",cls:"bad",done:false,n:es.length,marked:0}
}
function repeatedAbsences(date){
 let cutoff=date.slice(0,7), map={};
 emciaAttendanceRecords().filter(a=>a.status==="absent"&&a.date.slice(0,7)===cutoff).forEach(a=>{let k=a.sid+"|"+a.gid;map[k]=(map[k]||0)+1});
 return Object.entries(map).filter(([k,n])=>n>=3).map(([k,n])=>{let [sid,gid]=k.split("|");return{s:by(db.s,sid),g:by(db.g,gid),n}}).filter(x=>x.s&&x.g).sort((a,b)=>b.n-a.n)
}

function emciaLocalDay(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Africa/Casablanca',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function emciaDailyPaymentRows(date,filters={}){
 const month=date.slice(0,7),sessions=db.sch.filter(s=>s.active!==false&&s.day===dayAr(date)&&by(db.g,s.gid)?.active!==false).sort((a,b)=>a.start.localeCompare(b.start));
 const scheduled=new Set(sessions.map(s=>s.gid)),rows=new Map(),seen=new Set();
 for(const e of db.e){
  if(!emciaEnrollmentDate(e,date)||e.billingMode==='session'||!e.start||!scheduled.has(e.gid))continue;
  const student=by(db.s,e.sid),group=by(db.g,e.gid);if(!student||student.active===false||!group||group.active===false)continue;
  const key=e.sid+'|'+e.gid;if(seen.has(key))continue;seen.add(key);
  if(filters.group&&filters.group!==e.gid)continue;
  const details=[];
  for(const mm of monthRange(e.start,month)){
   const dueDate=mm===e.start.slice(0,7)?e.start:mm+'-01';if(dueDate>date)continue;
   const due=Math.round(dueForEnrollmentMonth(e,mm)*100);
   const paid=db.p.filter(p=>p.sid===e.sid&&p.gid===e.gid&&(p.date||'')<=date).reduce((sum,p)=>{
    const ratio=p.netAfterRefund!=null&&+p.a>0?Math.max(0,+p.netAfterRefund)/(+p.a):1;
    return sum+Math.round(allocatedAmountForMonth(p,mm)*ratio*100);
   },0);
   const remaining=Math.max(0,due-paid);if(remaining<=0)continue;
   if(filters.status==='unpaid'&&paid>0||filters.status==='partial'&&paid<=0||filters.status==='previous'&&mm>=month)continue;
   details.push({gid:e.gid,month:mm,due:due/100,paid:paid/100,remaining:remaining/100,previous:mm<month});
  }
  if(!details.length)continue;
  let row=rows.get(e.sid);if(!row){row={student,sid:e.sid,details:[],sessions:[]};rows.set(e.sid,row)}row.details.push(...details);
 }
 for(const row of rows.values()){
  row.sessions=sessions.filter(s=>(!filters.group||s.gid===filters.group)&&db.e.some(e=>e.sid===row.sid&&e.gid===s.gid&&emciaEnrollmentDate(e,date)&&e.billingMode!=='session'&&e.start));row.first=row.sessions[0]?.start||'';
  row.present=row.sessions.some(s=>emciaRecordsForSchedule(s,date).some(a=>a.sid===row.sid&&['present','late','leftEarly'].includes(a.status)));
  row.remaining=row.details.reduce((sum,x)=>sum+x.remaining,0);
 }
 return [...rows.values()].filter(row=>!filters.present||row.present).sort((a,b)=>a.first.localeCompare(b.first)||objName(a.student).localeCompare(objName(b.student),'ar'));
}

async function emciaLoadDailyReminders(date,force=false){

 const cache=emciaDailyReminderCache;if(cache.loading||cache.loaded&&!force)return;
 cache.loading=true;cache.error='';
 try{cache.rows=await emciaDailyReminderRequest('emcia_daily_payment_reminders?reminder_date=eq.'+encodeURIComponent(date)+'&select=student_id,actor_name,created_at');cache.loaded=true;}
 catch(e){cache.loaded=false;cache.error=tr('تعذر التحقق من سجل التذكير. أعد المحاولة.')}

async function emciaMarkDailyReminder(sid){
 const date=window.dailyDate||emciaLocalDay();if(date!==emciaLocalDay()||emciaDailyReminderBusy.has(sid))return;
 if(!emciaDailyPaymentRows(date).some(row=>row.sid===sid))return;
 emciaDailyReminderBusy.add(sid);emciaDailyReminderCache.error='';emciaRenderDailyPayments();
 try{
  const response=await emciaDailyReminderRequest('rpc/emcia_mark_daily_payment_reminder',{p_student_id:sid,p_date:date});
  const result=Array.isArray(response)?response[0]:response;
  if(!result?.student_id)throw Error('Invalid reminder response');
  if(emciaDailyReminderCache.date===date){emciaDailyReminderCache.rows=emciaDailyReminderCache.rows.filter(x=>x.student_id!==sid).concat(result);emciaDailyReminderCache.loaded=true;}
 }catch(e){if(emciaDailyReminderCache.date===date)emciaDailyReminderCache.error=tr('تعذر حفظ التذكير. أعد المحاولة.')}
 finally{emciaDailyReminderBusy.delete(sid);emciaRenderDailyPayments();}
}

function scheduleConflict(candidate,ignoreId=""){
 let same=db.sch.filter(s=>s.active!==false&&s.id!==ignoreId&&s.day===candidate.day&&overlap(s,candidate));
 let g=by(db.g,candidate.gid),tid=g?g.tid:"";
 let problems=[];
 same.forEach(s=>{let sg=by(db.g,s.gid),stid=sg?sg.tid:"";if(s.rid===candidate.rid)problems.push("القاعة محجوزة في هذا التوقيت");if(s.gid===candidate.gid)problems.push("الفوج لديه حصة أخرى في هذا التوقيت");if(tid&&stid===tid)problems.push("الأستاذ لديه حصة أخرى في هذا التوقيت");const learners=new Set(db.e.filter(e=>emciaEnrollmentDate(e,today())&&e.gid===candidate.gid).map(e=>e.sid));if(db.e.some(e=>emciaEnrollmentDate(e,today())&&e.gid===s.gid&&learners.has(e.sid)))problems.push("متعلم مسجل في الفوجين لديه حصتان متداخلتان")});
 return [...new Set(problems)]
}

function emciaScheduleAttendance(sid){

 const date=today(),day=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"][new Date(date+"T12:00:00").getDay()];
 const enrolled=[...new Set(db.e.filter(e=>emciaEnrollmentDate(e,date)&&e.billingMode!=="session"&&e.gid===ses.gid).map(e=>e.sid))];
 const records=emciaRecordsForSchedule(ses,date).filter(a=>enrolled.includes(a.sid)&&a.status);
 const unique=new Map(records.map(a=>[a.sid,a.status]));
 const count=st=>[...unique.values()].filter(x=>x===st).length;
 const scheduled=ses.day===day;
 const registered=unique.size,complete=enrolled.length>0&&registered>=enrolled.length;
 return '<strong>'+esc(date)+'</strong><div>المسجلون: '+enrolled.length+'</div>'+(scheduled?'<div>الحاضرون: '+count("present")+'</div><div>المتأخرون: '+count("late")+'</div><div>الغائبون: '+count("absent")+'</div><div>بعذر: '+count("excused")+'</div><div>حالة التسجيل: '+(registered===0?"لم يسجل بعد":complete?"مكتمل":"جزئي ("+registered+"/"+enrolled.length+")")+'</div>':'<div>هذا الفوج غير مبرمج اليوم.</div>')+'<div class="actions"><button type="button" onclick="editSchedule(\''+ses.id+'\')">✏️ تعديل</button><button type="button" class="danger" onclick="removeSchedule(\''+ses.id+'\')">🗑️ حذف</button></div>';
}

function emciaScheduleGrid(){
 const rooms=db.rooms.filter(r=>r.active!==false).sort((a,b)=>{const an=Number((String(a.n).match(/[0-9٠-٩]+/)||[])[0]?.replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632))||999),bn=Number((String(b.n).match(/[0-9٠-٩]+/)||[])[0]?.replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632))||999);return an-bn||a.n.localeCompare(b.n,"ar")});
 const sessions=db.sch.filter(x=>x.active!==false);
 const minutes=t=>{const p=(t||"").split(":").map(Number);return p.length===2&&p.every(Number.isFinite)?p[0]*60+p[1]:0};
 const label=n=>String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
 const starts=sessions.map(x=>minutes(x.start)).filter(x=>Number.isFinite(x)),ends=sessions.map(x=>minutes(x.end)).filter(x=>Number.isFinite(x));
 const first=Math.floor(Math.min(9*60,...starts)/30)*30,last=Math.ceil(Math.max(21*60+30,...ends)/30)*30;
 const slots=Array.from({length:Math.ceil((last-first)/30)},(_,i)=>first+i*30);
 const style='border:1px solid #cbd5e1;padding:5px;text-align:center;vertical-align:middle;font-size:12px';
 const breakCell='<td aria-label="استراحة من 12:00 إلى 14:00" style="background:#475569;border-left:3px solid #1e293b;border-right:3px solid #1e293b;min-width:9px;width:9px;padding:0"></td>';
 const head='<tr><th scope="col" class="emcia-day-column" style="'+style+';background:#e8eef5">اليوم</th><th scope="col" class="emcia-room-column" style="'+style+';background:#e8eef5">القاعة</th>'+slots.map(t=>(false?'':'')+'<th style="'+style+';min-width:'+(t===11*60+30?'105':'62')+'px;background:'+(t===14*60?'#dbeafe':'#e8eef5')+';direction:ltr">'+(t===11*60+30?'11:30–12:00':label(t))+'</th>').join('')+'</tr>';
 const body=DAYS.map(day=>rooms.map((r,ri)=>{
  const found=sessions.filter(x=>x.day===day&&x.rid===r.id).sort((a,b)=>a.start.localeCompare(b.start));
  let cells='',index=0;
  while(index<slots.length){
   
   const t=slots[index],ses=found.find(x=>minutes(x.start)<t+30&&minutes(x.end)>t);
   if(!ses){cells+='<td style="'+style+';background:#fafafa;color:#cbd5e1">·</td>';index++;continue}
   let count=1;while(index+count<slots.length&&minutes(ses.start)<slots[index+count]+30&&minutes(ses.end)>slots[index+count])count++;
   const g=by(db.g,ses.gid),teacher=by(db.t,g?.tid);
   cells+='<td colspan="'+count+'" style="'+style+';background:#e0f2fe;border:1px solid #7dd3fc;min-width:65px;cursor:pointer" onclick="emciaSchedulePopup(\''+ses.id+'\')" onmouseenter="emciaScheduleHover(\''+ses.id+'\')"><strong>'+esc(g?.linkCode||g?.n||"—")+'</strong></td>';
   index+=count;
  }
  return '<tr>'+(ri===0?'<th scope="rowgroup" class="emcia-day-column" rowspan="'+rooms.length+'" style="'+style+';background:#e8eef5;font-weight:bold">'+day+'</th>':'')+'<th scope="row" class="emcia-room-column" style="'+style+';white-space:nowrap;background:#f1f5f9">'+esc((r.n.match(/[0-9٠-٩]+/)||[])[0]||r.n)+'</th>'+cells+'</tr>';
 }).join('')).join('');
 return '<div class="card"><h3>استعمال الزمن الأسبوعي حسب القاعات</h3><div id="emciaSchedulePopup" data-sid="" style="display:none;position:sticky;top:5px;z-index:5;background:#fff;border:1px solid #94a3b8;border-radius:8px;padding:10px;max-width:280px;box-shadow:0 3px 10px #0002"><button type="button" style="float:left" onclick="this.parentNode.style.display=\'none\'">✕</button></div><div style="overflow-x:auto;max-width:100%;direction:rtl"><table class="emcia-week-grid" style="width:max-content;min-width:100%;table-layout:fixed"><colgroup><col style="width:80px"><col style="width:52px"></colgroup>'+head+body+'</table></div></div>';
}

function addSchedule(){
 let type=$("#scType")?.value||"official";
 let c={id:uid(),gid:$("#scG").value,day:$("#scD").value,start:$("#scS").value,end:$("#scE").value,rid:$("#scR").value,type,makeupFor:type==="makeup"?($("#scMakeup")?.value||""):"",active:true};
 if(!c.gid||!c.rid||!c.start||!c.end)return alert("أكمل بيانات الحصة");
 if(c.start>=c.end)return alert("وقت النهاية يجب أن يكون بعد وقت البداية");
 let p=scheduleConflict(c);if(p.length)return alert("تعذر إضافة الحصة:\n• "+p.join("\n• "));
